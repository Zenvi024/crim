// Samplex. Essays: id, set, src, t (topics), q, iss (issues to spot), a (model answer, IRAC/CLEAR), c (back-page CLEAR line).
// MCQs: id, src, q, ch (choices), k (key index), why, note.
window.ESSAYS = [
// ── MOCK EXAM A (Sir Barry style: syllabus-case facts, mixed and switched) ──
{id:"m1",set:"Mock exam A",src:"Mock · written for this site",t:["a3","a11"],
q:"Officers Ramos and Tuazon were ordered to arrest Dado, an escaped convict known to be armed, and to “bring him in dead or alive if he resists.” At 2:00 a.m. they learned Dado was hiding in a boarding house. Ramos kicked the door open and, in the dark, saw a man rising from a bed and reaching under his pillow. Ramos fired, killing him. Tuazon, entering a second room, found a man asleep with his back to the door and fired three shots without saying a word. Neither man was Dado: the first was a boarder who kept a flashlight under his pillow; the second was a vendor. Discuss the criminal liability of Ramos and Tuazon.",
iss:["Mistake of fact (Ah Chong requisites)","Fault or carelessness: time to verify (Oanis)","Fulfillment of duty (Art. 11(5)): necessary consequence","Incomplete justification → privileged mitigating (Art. 69)","Dolo vs. culpa (deliberate shooting is not reckless imprudence)","Treachery (sleeping victim) → murder"],
a:"<b>Ramos: not liable (or at most incomplete justification).</b> Under Art. 3, there is no felony by dolo without intent. Mistake of fact excuses if (1) the act would have been lawful had the facts been as believed, (2) the intent was lawful, and (3) the mistake was without fault (<i>U.S. v. Ah Chong</i>). In the dark, a man rising and reaching under his pillow at an officer serving a warrant on an armed fugitive reasonably appears to be reaching for a weapon. Had the facts been as Ramos believed, shooting would have been the <b>necessary consequence of his duty</b> (Art. 11(5); <i>People v. Delima</i>) or self-defense. He had no time to verify. Like Ah Chong, he is not liable.<br><br><b>Tuazon: liable for murder</b>, mitigated by incomplete fulfillment of duty. The man was <b>asleep, with his back to the door</b>. Nothing pressed Tuazon to act at once; he had time to verify identity and effect a bloodless arrest. Even if the man had been Dado, the order allowed force only if he resisted. The mistake was due to his own fault (<i>People v. Oanis</i>), so it does not excuse. Because he shot deliberately, the crime is by <b>dolo</b>, not reckless imprudence; shooting a sleeping victim is <b>treachery</b>, so it is murder. He was on duty (first requisite of Art. 11(5)), but the killing was not its necessary consequence, so he gets the <b>privileged mitigating circumstance</b> of incomplete fulfillment of duty (Art. 69).",
c:"Ramos: mistake of fact without fault (Ah Chong) → not liable. Tuazon: time to verify, sleeping victim → murder with incomplete fulfillment of duty (Oanis)."},

{id:"m2",set:"Mock exam A",src:"Mock",t:["a2","a10"],
q:"(a) The M/V Erin, a Liberian-registered merchant vessel en route from Hong Kong to Sydney, anchored for one night off Batangas. Lito, a Chinese crewman, smoked shabu on deck; Paco, another crewman, kept 50 grams of shabu in his locker and never left the ship; Wei, a third crewman, sold some to a fisherman who came alongside. Which of them may be prosecuted in the Philippines? (b) The M/V Bayani, registered in the Philippines but owned by a Panamanian corporation, was on the high seas when Bert, a Filipino seaman, stabbed Kenji, a Japanese seaman. Do Philippine courts have jurisdiction? (c) Would your answer in (b) change if the Bayani had been registered in Panama but owned by a Filipino?",
iss:["English rule; breach of public order (Wong Cheng)","Mere possession in transit (Look Chaw)","Landing or sale → triable (Look Chaw)","Art. 2(1): Philippine ship = registry, not owner (2000 Bar)"],
a:"<b>(a)</b> We follow the <b>English rule</b>: crimes aboard a foreign merchant vessel in our waters are triable here unless they affect only the vessel's internal management. <b>Lito</b>: yes. Using a drug within our waters makes it produce its harmful effects here, a breach of public order (<i>People v. Wong Cheng</i>). <b>Paco</b>: no. <b>Mere possession</b> aboard a vessel <b>in transit</b>, never landed or used here, causes none of the effects our laws seek to prevent (<i>U.S. v. Look Chaw</i>). <b>Wei</b>: yes. Selling it to a local brings the drug into our territory, an open violation of our laws (<i>Look Chaw</i>).<br><br><b>(b) Yes.</b> Under Art. 2(1), the RPC applies outside our jurisdiction to those who commit an offense while on a <b>Philippine ship</b>. A Philippine ship is one <b>registered</b> here; the owner's nationality is immaterial.<br><br><b>(c) Yes, the answer changes.</b> A Panamanian-registered ship is not a Philippine ship even if a Filipino owns it; the crime on the high seas is not triable here (2000 Bar; <i>U.S. v. Fowler</i>).",
c:"English rule: use or sale here = breach of public order (Wong Cheng; Look Chaw); mere possession in transit is not. Art. 2(1) turns on registry, not ownership."},

{id:"m3",set:"Mock exam A",src:"Mock",t:["a4a","a6"],
q:"During a drinking spree, Nonoy punched Badong, a 60-year-old with a known heart condition, twice in the chest. Badong staggered out of the house in fear and onto the highway, where a speeding jeepney hit him. He was brought to a hospital where he refused a blood transfusion for religious reasons, and he died the next morning. The autopsy listed the cause of death as “cardiac arrest secondary to blunt trauma and blood loss.” Nonoy argues: (1) he only meant to hurt Badong; (2) the jeepney and the refusal of treatment, not his punches, killed Badong. Rule on both arguments.",
iss:["Art. 4(1) requisites","Proximate cause; chain unbroken (Iligan)","Pre-existing illness not an efficient intervening cause (Garcia)","Victim's refusal of treatment / neglect not efficient","Immediate sense of danger","Praeter intentionem (Art. 13(3))"],
a:"<b>Both arguments fail; Nonoy is liable for homicide, mitigated by praeter intentionem.</b><br><br><b>Rule.</b> Under Art. 4(1), one who commits an intentional felony is liable for all its <b>direct, natural and logical consequences</b>, even if unintended. The felony must be the <b>proximate cause</b>: the cause that, in natural and continuous sequence, unbroken by an efficient intervening cause, produces the result.<br><br><b>(1) Lack of intent to kill.</b> The punches were an intentional felony (physical injuries). Intent to kill is not required for liability for the death; lack of it only mitigates under Art. 13(3) (no intention to commit so grave a wrong), as in <i>Garcia v. People</i>, where a mauling triggered a fatal heart attack.<br><br><b>(2) Intervening causes.</b> (a) Badong's <b>heart condition</b> is not an efficient intervening cause; the offender takes his victim as he finds him (<i>Garcia</i>). (b) The <b>jeepney</b>: Badong ran onto the highway out of the immediate sense of danger Nonoy created, so being hit was a natural consequence of the assault. As in <i>People v. Iligan</i>, where the victim was hacked and then run over, the felony need not be the immediate cause; it is enough that it started the unbroken chain. (c) The <b>refusal of treatment</b> is neglect by the victim, which Reyes lists as <b>not</b> an efficient intervening cause.",
c:"Art. 4(1): the punches set off an unbroken chain (Iligan); illness and refusal of treatment are not efficient intervening causes (Garcia) → homicide with Art. 13(3) mitigating."},

{id:"m4",set:"Mock exam A",src:"Mock",t:["a4b","a6"],
q:"(a) Ading, a collector of Bright Foam, received a ₱50,000 check from a customer, payable to Bright Foam. She deposited it in her boyfriend's account. The check bounced for insufficient funds. Charged with qualified theft, Ading says she committed no crime. (b) Tonyo, wanting to kill his rival Jun, crept to Jun's hut at night and fired five shots through the bamboo wall where Jun usually slept. Jun had left for Manila that afternoon; Jun's goats inside were killed. (c) Pinong abducted a 7-year-old boy and mailed a ransom note to the parents. Police rescued the boy before the note arrived. Pinong argues it is an impossible crime. Discuss.",
iss:["Impossible crime requisites (Art. 4(2))","Legal/factual impossibility: worthless check (Jacinto)","Physical impossibility: absent victim (Intod)","'No violation of another provision': damage to the goats (malicious mischief?)","Kidnapping is a crime against liberty; consummated (Domasian)"],
a:"<b>(a) Impossible crime of qualified theft</b> (<i>Jacinto v. People</i>). Theft requires taking personal property with value and with intent to gain. The check was <b>worthless from the start</b>, so the unlawful taking could not produce any gain: this is inherent impossibility. The other requisites are present: the act would be an offense against property, it was done with evil intent, and it violated no other provision. She is liable under Art. 4(2), penalized under Art. 59.<br><br><b>(b) Impossible crime of murder</b> (<i>Intod v. CA</i>). Firing into the place where the victim usually sleeps, with intent to kill, while he is in fact absent, is <b>physical (factual) impossibility</b>, a form of inherent impossibility. <b>Exception:</b> Art. 4(2) applies only if the act constitutes no other felony. Killing the goats may be <b>malicious mischief</b> (damage to property), and if so, Tonyo would be liable for that felony instead. But because the damage was not deliberately caused (it resulted from an act aimed at Jun), the better view following <i>Intod</i> is an impossible crime, with civil liability for the goats.<br><br><b>(c) Not an impossible crime; kidnapping and serious illegal detention</b> (<i>People v. Domasian</i>). An impossible crime covers only offenses against <b>persons or property</b>; kidnapping is a crime against <b>liberty</b>. In any case, the crime was <b>consummated</b> when the boy was deprived of his liberty; the late ransom note only affects the penalty.",
c:"Worthless check → impossible theft (Jacinto); absent victim → impossible murder (Intod); kidnapping is never an impossible crime and was consummated (Domasian)."},

{id:"m5",set:"Mock exam A",src:"Mock",t:["a6"],
q:"(a) In a mall supermarket, Eli loaded six boxes of detergent into a cart, wheeled them past the cashiers without paying, and loaded them into a waiting taxi in the parking lot. A guard stopped the taxi before it left. The RTC convicted Eli of frustrated theft. Correct? (b) Fred shot Gino once in the left shoulder with a .45 pistol inside a store; Gino ran and hid in a back room, and Fred fled. Gino recovered after nine days in the hospital. Fred is charged with frustrated murder. (c) Same as (b), except Gino was shot in the chest, fell, and lay still; Fred, thinking him dead, walked away. Gino survived after emergency surgery. (d) Hector, intending to rape Ana, pinned her down and removed her clothes, and his penis touched her labia before she kicked him away. Hector argues it is only frustrated rape.",
iss:["No frustrated theft; apoderamiento (Valenzuela)","Subjective phase not complete; victim escaped (Sy Pio)","Subjective phase complete; mortal wound (Eduave)","No frustrated rape; slightest penetration (Orita; Campuhan)"],
a:"<b>(a) Not correct; consummated theft.</b> Theft is produced the moment the offender gains <b>possession</b> of the property with intent to gain; the chance to dispose of it is not an element. There is no frustrated theft (<i>Valenzuela v. People</i>).<br><br><b>(b) Attempted murder.</b> A homicide or murder is frustrated only when the subjective phase is complete, meaning the offender has performed all the acts of execution believing they will cause death. Fred saw Gino run and hide, the wound was not fatal, and Fred did not pursue (<i>People v. Sy Pio</i>). (Murder, if treachery attended the shooting; otherwise homicide.)<br><br><b>(c) Frustrated murder (or homicide).</b> Fred inflicted a <b>mortal wound</b> and believed Gino dead, so the subjective phase was complete. Death did not result only because of the surgery, a cause independent of his will (<i>U.S. v. Eduave</i>).<br><br><b>(d) Consummated rape.</b> Rape is consummated by carnal knowledge, and <b>any penetration</b>, even touching the labia, suffices. There is no frustrated rape (<i>People v. Orita</i>; <i>People v. Campuhan</i>).",
c:"Theft and rape have no frustrated stage (Valenzuela; Orita). Homicide is frustrated only if the subjective phase is complete (Eduave), not when the victim visibly escapes (Sy Pio)."},

{id:"m6",set:"Mock exam A",src:"Mock",t:["a11"],
q:"(a) At a card game, Celso accused Dindo of cheating. Dindo swung a wooden pole at Celso; Celso ducked, drew a knife and stabbed Dindo in the arm. Dindo dropped the pole and ran. Celso chased him for 30 meters and stabbed him in the back, killing him. (b) In a crowded, brightly lit church, Lorna's ex-suitor sat beside her and touched her knee. She stabbed him in the neck with a pocket knife. (c) Brothers Ted and Ned arrived at the rice field to see their father lying in the mud, bleeding, with their uncle standing over him holding a bolo. They hacked the uncle to death. It later turned out that their father had started the fight. Discuss the liability of Celso, Lorna, and Ted and Ned.",
iss:["Two stages; aggression ceased (Alconga)","Unlawful aggression vs. reasonable necessity; place and occasion (Jaurigue)","Defense of relatives; honest belief (Esmedia)","Relative's provocation immaterial if the defender had no part in it","Incomplete justification (Art. 69)"],
a:"<b>(a) Celso: homicide.</b> The first stabbing was self-defense (Dindo's attack with the pole was unlawful aggression). But when Dindo dropped the pole and <b>ran</b>, the aggression <b>ceased</b>. Pursuing and stabbing him in the back is retaliation, not defense (<i>People v. Alconga</i>). Without unlawful aggression, there is no self-defense, complete or incomplete, for the fatal blow.<br><br><b>(b) Lorna: homicide, with incomplete self-defense (privileged mitigating).</b> Touching her knee is unlawful aggression against her honor. But in a <b>brightly lit, crowded church</b> there was no danger of rape, so stabbing his neck was <b>not reasonably necessary</b>; a slap or a push would do (<i>People v. Jaurigue</i>). With unlawful aggression and lack of provocation present, she gets the privileged mitigating circumstance under Art. 69.<br><br><b>(c) Ted and Ned: justified (defense of relatives, Art. 11(2)).</b> Unlawful aggression may rest on the defender's <b>honest belief</b> as the facts appeared: seeing their wounded father down with the armed uncle over him, they reasonably believed he would strike again (<i>U.S. v. Esmedia</i>). That the father started the fight is immaterial; under ¶2, the relative's own provocation does not bar the defense as long as the <b>defenders had no part in it</b>.",
c:"Fleeing aggressor = aggression ceased (Alconga); excessive means in a safe setting = incomplete defense (Jaurigue); honest belief + no part in the provocation = defense of relatives (Esmedia)."},

{id:"m7",set:"Mock exam A",src:"Mock",t:["a8","a2","a6"],
q:"(a) In a hotel in Singapore, Colonel X persuaded Majors Y and Z to join him in seizing a military camp in Manila to topple the government. All three agreed and fixed the date. Upon arrival at NAIA, they were arrested. What crime, if any, may they be charged with? (b) In Manila, Ana asked her friend Bea, for ₱50,000, to kill Ana's husband. Bea refused and reported Ana to the police. Is Ana liable? (c) Carlo agreed with Dino to rob a store. As they approached it, Dino changed his mind and went home; Carlo forced open the back door and was caught inside before taking anything. What are their liabilities?",
iss:["Conspiracy/proposal punishable only when the law provides (Art. 8)","Conspiracy to commit coup d'état (Art. 136); territoriality (Art. 2); Title Three not in Art. 2(5)","Proposal to commit murder: not punishable","Desistance before overt acts; indeterminate offense / overt acts (Lamahang)"],
a:"<b>(a)</b> Conspiracy and proposal are punishable only where the law specially provides (Art. 8). Conspiracy to commit <b>coup d'état</b> is punishable under Art. 136. But the agreement was made in <b>Singapore</b>. Coup d'état is a crime against public order (Title Three), not a crime against national security under Art. 2(5), so the RPC cannot reach a conspiracy formed abroad. On arrival they had not yet committed any overt act here. <b>Better answer: no crime triable here</b>, unless they renewed the agreement or performed acts in furtherance of it in the Philippines. (Compare the San Beda question on General Li.)<br><br><b>(b) No.</b> A proposal to commit <b>murder</b> (or parricide) is not punishable: no law provides a penalty for it, and a proposal is only a preparatory act, not an overt act of execution.<br><br><b>(c) Dino: not liable.</b> Conspiracy to commit robbery is not punishable as such, and he desisted before any overt act. <b>Carlo: attempted robbery</b> (robbery with force upon things). He commenced the crime by forcing the door, and here the purpose to rob is clear from the prior agreement and the store's contents, unlike <i>Lamahang</i>, where the purpose was indeterminate. He did not perform all the acts of execution, which was not due to his own desistance. If his purpose cannot be proven, he is liable only for what his acts clearly show, such as attempted trespass (<i>Lamahang</i>).",
c:"Conspiracy and proposal are crimes only where the law provides (Art. 8: coup d'état, rebellion, treason, sedition); a conspiracy formed abroad to commit coup d'état is not within Art. 2. A proposal to commit murder is not punishable."},

{id:"m8",set:"Mock exam A",src:"Mock",t:["a11","a9","a5"],
q:"(a) During a typhoon, barangay captain Mario ordered the destruction of a dike on Pedro's fishpond to stop floodwater from submerging a village of 200 houses. The village was saved; Pedro lost ₱800,000 in fish. Is Mario liable? Who pays Pedro? (b) Sgt. Rey ordered Pvt. Lim to “teach a lesson” to a detainee who insulted the battalion, by beating him. The detainee suffered serious physical injuries. Lim invokes obedience to a superior's order. (c) A felony is punishable by a fine of ₱40,000. Is it a grave, less grave or light felony? (d) A judge believes the penalty for a theft of ₱1,000 worth of rice by a starving mother is too harsh. What should he do?",
iss:["State of necessity: requisites; civil liability of the persons benefited (Art. 11(4); Art. 101)","Obedience: lawful purpose and lawful means; good faith (Beronilla)","Art. 9 vs. Art. 26 (₱40,000 fine)","Art. 5 ¶2: impose the penalty; recommend clemency"],
a:"<b>(a) Not liable: avoidance of a greater evil (Art. 11(4)).</b> The evil (flooding 200 houses) actually existed; the injury feared was greater than the damage done; and on these facts there was no other practical and less harmful means. Unlike the other justifying circumstances, ¶4 carries <b>civil liability</b>: the villagers <b>benefited</b> must pay Pedro in proportion to the benefit each received (Art. 101).<br><br><b>(b) Lim is liable.</b> Obedience to an order justifies only if the order is for a <b>lawful purpose</b> and the subordinate uses <b>lawful means</b> (Art. 11(6)). An order to beat a detainee is patently unlawful; Lim cannot claim good faith as in <i>Beronilla</i>, where the subordinate obeyed in good faith, without negligence, and unaware of the illegality. Sgt. Rey is liable as principal by inducement (beyond the midterm coverage).<br><br><b>(c) Light felony.</b> Under Art. 9 as amended by RA 10951, light felonies are those punished by arresto menor or a fine <b>not exceeding ₱40,000</b>. Although Art. 26 treats a ₱40,000 fine as correctional, Art. 9 governs the classification of felonies.<br><br><b>(d)</b> Under Art. 5 ¶2, he must <b>impose the penalty</b> prescribed and may not suspend its execution, but he may submit a statement to the Chief Executive, through the DOJ, recommending <b>executive clemency</b>, given the low degree of malice and the slight injury caused.",
c:"State of necessity justifies, but the persons benefited pay (Art. 101); an unlawful order does not justify; a ₱40,000 fine is a light felony (Art. 9); excessive penalty → impose it and recommend clemency (Art. 5)."},

// ── SAN BEDA 2019 MIDTERM (essay part; Q3 is on penalties, outside your coverage) ──
{id:"sb1",set:"San Beda 2019 midterm",src:"San Beda Alabang, Crim 1 Midterm (Frias), Q1 (10 pts)",t:["a11"],
q:"Ric was at a party when he saw his friend Morty on the ground screaming for help because Leo was on top of him and about to stab him. Ric and Leo had a long-standing grudge (Leo had kissed Ric's girlfriend). Ric thought, “Two birds with one stone: I save Morty and get revenge on Leo,” and stabbed Leo in the back, killing him. At trial, it turned out Morty was Ric's long-lost brother. You are Ric's lawyer. Present your defense.",
iss:["Defense of a relative (¶2) vs. a stranger (¶3)","Third requisite of ¶3: 'induced' by evil motive","¶2 has no motive requirement","Honest belief; reasonable means (stab in the back vs. an armed attacker on top)"],
a:"<b>Defense: Ric acted in defense of a relative (Art. 11(2)), or at least of a stranger (Art. 11(3)).</b><br><br><b>Primary.</b> Morty is Ric's <b>brother</b>, a relative under ¶2. Defense of relatives requires only (1) unlawful aggression, (2) reasonable necessity of the means, and (3) if the relative gave provocation, that the defender had no part in it. ¶2 has <b>no requirement about the defender's motive</b>. (1) Leo was on top of Morty about to stab him: actual, imminent unlawful aggression. (2) Stabbing an armed attacker who is about to stab is a reasonable means under rational equivalence; Ric could not be expected to calculate his blow. (3) Ric gave no provocation. The defense is complete. The law looks at the objective situation, so the relationship justifies the act even though Ric did not know of it.<br><br><b>Alternative.</b> Even as a <b>stranger</b>, ¶3 bars the defense only if the defender was “<b>induced</b>” by revenge. A grudge does not defeat the defense if the defender also acted to save the victim; Ric's primary aim was to save Morty, who was in mortal danger. The revenge was incidental, not the inducing cause.",
c:"Defense of a relative needs no proof of good motive; even under ¶3, a grudge does not defeat the defense unless it was the inducing cause."},
{id:"sb2",set:"San Beda 2019 midterm",src:"San Beda, Q2 (10 pts)",t:["a10","a3"],
q:"Thomas, a security guard, was issued a firearm by his agency. His routine: get the firearm at the agency, go on duty, return it. One night, on his way back to the agency, he stopped to have dinner with a friend at a restaurant. A police officer saw the firearm protruding from his waist and asked for the license; it had none. Was the arrest valid? (Answer the criminal-law part: is there a crime?)",
iss:["Mala prohibita (Art. 10): intent immaterial","But animus possidendi required for possession","Possession incidental to duty / temporary, in transit"],
a:"<b>Criminal-law issue: illegal possession is malum prohibitum</b>, so good faith or lack of criminal intent is generally not a defense (Art. 10; special law). But possession offenses still require <b>animus possidendi</b>, the intent to possess. A guard carrying a firearm issued by his agency, in the course of returning it after duty, holds it <b>temporarily and incidentally to his duty</b>, not as his own. Jurisprudence has acquitted guards and employees in that situation. The dinner stop is a short, incidental deviation while still in transit to return the firearm. <b>Conclusion: no illegal possession on his part</b> (the agency may be liable for the unlicensed firearm). The arrest without a warrant is a criminal procedure question (an offense committed in the officer's presence), so its validity depends on whether a crime was being committed; on this view, it was not.",
c:"Malum prohibitum: intent is immaterial, but animus possidendi is still required; a guard returning an agency-issued firearm lacks it."},
{id:"sb4",set:"San Beda 2019 midterm",src:"San Beda, Q4 (10 pts)",t:["a3","a4a"],
q:"Tata had a fever; his doctor prescribed paracetamol. The pharmacist sold him three tablets. He took one and, an hour later, had a seizure and died. The autopsy showed the tablet was not paracetamol but a drug to which he was allergic. The pharmacist was charged with the death of Tata. Is the charge proper?",
iss:["No dolo: no intent → not Art. 4(1)","Culpa: negligence/imprudence (Art. 3; Art. 365)","Proximate cause"],
a:"<b>Proper only as reckless imprudence resulting in homicide</b>, not an intentional felony. Art. 4(1) requires an <b>intentional</b> felony; the pharmacist had no intent to harm. But a felony may be committed by <b>culpa</b> (Art. 3): the wrongful act results from imprudence or negligence. A pharmacist must use the highest degree of care in dispensing drugs; giving the wrong drug is a deficiency of action (imprudence) and of perception (negligence). Taking the tablet was the <b>proximate cause</b> of the seizure and death, with no efficient intervening cause. The charge should be reckless imprudence resulting in homicide under Art. 365.",
c:"No intent → no dolo, but culpa: the pharmacist's imprudence was the proximate cause → reckless imprudence resulting in homicide."},
{id:"sb5",set:"San Beda 2019 midterm",src:"San Beda, Q5 (10 pts)",t:["a8","a2"],
q:"During a convention in Hong Kong, General Li and other AFP officers agreed to stage a coup d'état against President Lee. Rio, one of them, informed the government. On arrival at NAIA, General Li and the others were arrested for conspiracy to commit coup d'état. Is the arrest proper?",
iss:["Art. 8: conspiracy punishable only when the law provides (Art. 136: yes)","Territoriality: conspiracy formed abroad","Art. 2(5) covers Title One only; coup d'état is Title Three"],
a:"<b>Not proper.</b> Conspiracy to commit coup d'état is punishable (Art. 136, as allowed by Art. 8). But penal laws are <b>territorial</b>: the conspiracy was formed and completed in <b>Hong Kong</b>. The RPC applies abroad only in the five cases in Art. 2. Coup d'état is a crime against <b>public order</b> (Title Three), not a crime against national security and the law of nations (Title One), so Art. 2(5) does not cover it. On arrival at NAIA they had committed no overt act in the Philippines. (Alternative: if the agreement is shown to have continued or been renewed here, the conspiracy would be committed here.)",
c:"Conspiracy to commit coup d'état is punishable (Art. 136), but one formed abroad is outside Art. 2 (Title Three, not Title One)."},
{id:"sb6",set:"San Beda 2019 midterm",src:"San Beda, Q6 (20 pts)",t:["a2","a4a","a11"],
q:"Jia, a Filipino, was sailing across the Atlantic on a Philippine-registered boat with her friend John. John called her corny; angry, Jia punched at him. John dodged and punched back; Jia fell off the boat and was eaten by a shark. Discuss Jia's and John's criminal liability.",
iss:["Jurisdiction: Art. 2(1), Philippine-registered vessel","Jia: attempted slight physical injuries (light felony against persons, Art. 7)","John: self-defense? Unlawful aggression; reasonable means (fist vs. fist)","Art. 4(1): natural consequence; shark as efficient intervening cause?","Praeter intentionem"],
a:"<b>Jurisdiction.</b> The boat is <b>Philippine-registered</b>, so the RPC applies even on the Atlantic (Art. 2(1)).<br><br><b>Jia</b>: she threw a punch that missed: <b>attempted slight physical injuries</b>. As a light felony <b>against persons</b>, it is punishable even if only attempted (Art. 7). Her criminal liability is extinguished by her death (Art. 89), so in practice she is not liable.<br><br><b>John: not liable (self-defense).</b> (1) Jia's punch was an actual physical assault: <b>unlawful aggression</b>. (2) A punch against a punch is a <b>reasonable means</b> (rational equivalence). (3) Calling her “corny” is not <b>sufficient</b> provocation; mere words that are not proportionate to an assault do not count. Since his act was justified, it was not a felony, and <b>Art. 4(1) cannot apply</b> to the death. <b>Alternatively</b>, if self-defense is rejected (e.g., the aggression had ceased when he struck back), the punch is an intentional felony and death by drowning or a shark after falling overboard is a natural consequence of a blow on a boat at sea (the shark being a danger inherent in the situation): homicide mitigated by praeter intentionem (Art. 13(3)), and arguably by provocation.",
c:"Art. 2(1) applies. John: unlawful aggression + reasonable means + no sufficient provocation → justified; with no felony, Art. 4(1) does not attach. Otherwise homicide with praeter intentionem."},

// ── PAST BAR (from your QUAMTO file; answers follow UPLC/Reyes) ──
{id:"b1",set:"Past bar",src:"2019, 2015 Bar",t:["a2"],
q:"Ms. M, a Malaysian, was aboard an Indonesian-registered vessel still docked at the port of Manila when she saw her enemy Ms. A, an Australian, and stabbed her in the neck from behind, killing her. Ms. M argues the RPC cannot apply because both are foreigners on a foreign vessel. Tenable?",iss:["Territoriality + generality","English rule"],
a:"<b>No.</b> Under the <b>territoriality</b> principle, the RPC applies to crimes committed within Philippine territory, including its ports and interior waters; under <b>generality</b>, it binds all who live or sojourn here regardless of citizenship. A killing aboard a foreign merchant vessel docked in Manila disturbs public order and is triable here under the English rule. The vessel's registry is irrelevant inside our territory. (The crime is murder, given treachery.)",c:"Territoriality + generality: a killing aboard a foreign merchant vessel docked in Manila is triable here."},
{id:"b2",set:"Past bar",src:"1994 Bar",t:["a2"],q:"Abe, married to Liza, married Connie in Singapore. Abe and Connie returned and lived together in Calamba, Laguna. Can Abe be prosecuted for bigamy?",iss:["Territoriality; Art. 2 exceptions do not cover bigamy"],
a:"<b>No.</b> Bigamy is consummated where the second marriage is celebrated: Singapore. It is not among the Art. 2 cases in which the RPC applies extraterritorially, so the general rule of territoriality governs. (Cohabitation here is not itself bigamy; concubinage may be explored.)",c:"Bigamy abroad is outside Art. 2 → territoriality controls → not triable."},
{id:"b3",set:"Past bar",src:"2014, 2009, 2004 Bar",t:["a4b"],q:"Puti, wanting to kill his roommate Pula, asked a veterinarian for poison “for a sick pet.” The vet gave him a non-toxic solution, which Puti mixed into Pula's food; Pula did not die. (a) What crime? (b) What if Pula got an upset stomach and was hospitalized for 10 days?",iss:["Ineffectual means","Another felony committed → liable for it"],
a:"<b>(a) Impossible crime</b> (of murder): with intent to kill, he used <b>ineffectual</b> means (Art. 4(2)). <b>(b) Less serious physical injuries.</b> An impossible crime exists only if the act does not constitute another felony; here the act produced injuries requiring 10 days of medical attendance, so he is liable for that felony.",c:"Non-toxic 'poison' = ineffectual means → impossible crime, unless injuries result, in which case he is liable for the physical injuries."},
{id:"b4",set:"Past bar",src:"1994 Bar",t:["a4b"],q:"JP, Aries and Randal, guided by Ella, fired their automatic weapons at Elsa's room at 10:00 p.m. Elsa was at a prayer meeting in another barangay. The RTC convicted them of attempted murder. Decide the appeal.",iss:["Intod"],
a:"<b>Set aside; impossible crime of murder</b> (<i>Intod v. CA</i>, on nearly identical facts). Their intent to kill was clear, and the act would have been murder, but it was factually impossible because Elsa was not in the room. Factual impossibility is inherent impossibility under Art. 4(2).",c:"Absent victim = physical impossibility = impossible crime (Intod)."},
{id:"b5",set:"Past bar",src:"2019 Bar",t:["a6"],q:"Mr. A poured gasoline on the walls of Mr. B's rest house and lit a match, but the caretaker caught him before he could set it on fire. He was charged with frustrated arson. Proper?",iss:["Attempted vs. frustrated"],
a:"<b>No; attempted arson.</b> He commenced the commission by overt acts (pouring gasoline, lighting a match) but did not perform all the acts of execution (setting the house on fire), because of a cause other than his own desistance (Art. 6).",c:"Interrupted before all the acts of execution were done → attempted."},
{id:"b6",set:"Past bar",src:"2022 Bar",t:["a6"],q:"A police officer found Sisa stabbing her 1-year-old child with a kitchen knife; he grabbed her and she threw down the knife. The child survived multiple stab wounds thanks to treatment. Sisa says it is only attempted parricide because she voluntarily desisted. Tenable?",iss:["Desistance only in attempt; not spontaneous","Frustrated if wounds mortal"],
a:"<b>No.</b> Desistance must be <b>spontaneous</b>; she dropped the knife only after the officer grabbed her. Desistance is also relevant only in the attempted stage. If the stab wounds were <b>mortal</b> and the child survived only because of timely medical help, she performed all the acts of execution: <b>frustrated parricide</b>. If the wounds were not mortal, it is attempted parricide, but not because of desistance.",c:"Desistance must be spontaneous and occur in the attempted stage; mortal wounds + medical help = frustrated."},
{id:"b7",set:"Past bar",src:"2020-21 Bar",t:["a4a"],q:"At an ECQ checkpoint, a resident angered by a barangay tanod's tone punched him on the head. The tanod fell, suffered a brain hemorrhage, and died. Charged with homicide, the resident argues he had no intent to kill. Tenable?",iss:["Art. 4(1)","Praeter intentionem"],
a:"<b>No.</b> Under Art. 4(1), one who commits a felony (the punch: physical injuries) is liable for its direct, natural and logical consequences, even if unintended. The fall and hemorrhage flowed directly from the blow. Lack of intent to kill only mitigates (Art. 13(3), praeter intentionem).",c:"Art. 4(1): liable for the death; no intent to kill → only Art. 13(3) mitigating."},
{id:"b8",set:"Past bar",src:"2019 Bar",t:["a11"],q:"Mr. R broke into Mrs. V's bedroom at night and stashed her cash and jewelry. Mrs. V woke, cocked a rifle and said “Stop or I will shoot you!” Mr. R lunged, wrested the gun away and shot her dead. May he invoke self-defense?",iss:["Unlawful aggression must be unlawful","Lawful defense of property is not aggression"],
a:"<b>No.</b> There was no <b>unlawful</b> aggression by Mrs. V: as owner, she was lawfully defending her property against a thief caught in the act. Mr. R was the unlawful aggressor. (Robbery with homicide.)",c:"A lawful defense of property is not unlawful aggression; the thief cannot claim self-defense."},
{id:"b9",set:"Past bar",src:"2000, 1998 Bar",t:["a11"],q:"Osang, asleep, let a man have intercourse with her thinking he was her husband. When he said “Salamat Osang” and left, she realized it was her neighbor Julio, grabbed a balisong and stabbed him to death. Defense of honor?",iss:["Aggression had ceased"],
a:"<b>No.</b> When she stabbed him, the act was over and he was leaving; the unlawful aggression had ceased. What she did was retaliation, not defense. She may invoke mitigating circumstances (immediate vindication of a grave offense; passion or obfuscation).",c:"Aggression had ceased → no defense of honor; mitigating circumstances only."},
{id:"b10",set:"Past bar",src:"2016 Bar",t:["a11"],q:"Pedro saw a man stabbing Juan, the first cousin of Pedro's wife. Pedro hit the attacker with a spade, killing him. Defense of a relative?",iss:["Affinity: same degrees only","Defense of a stranger"],
a:"<b>Not defense of a relative</b>: relatives by affinity are covered only “in the same degrees” (ascendants, descendants, siblings), and a wife's first cousin is not among them. <b>But</b> Pedro may invoke <b>defense of a stranger</b> (¶3) if there was unlawful aggression, reasonable means, and he was not induced by revenge or another evil motive.",c:"A wife's first cousin is a 'stranger' → ¶3."},
{id:"b11",set:"Past bar",src:"2002 Bar",t:["a11"],q:"A saw three men punching B; C was about to stab B with a knife. Not knowing that B had earlier challenged them to a fight, A shot C. May A invoke defense of a stranger?",iss:["Honest belief; appearances","Provocation by the stranger is immaterial for ¶3 if the defender had no part"],
a:"<b>Yes.</b> As things appeared to A, there was unlawful aggression against B (a knife about to be used), and shooting an attacker with a knife is a reasonable means. A was not induced by an evil motive, and he had no part in B's provocation. Defense is judged by the facts as they reasonably appeared to the defender (<i>Esmedia</i>).",c:"Appearances govern; A had no part in B's provocation → defense of a stranger."},
{id:"b12",set:"Past bar",src:"1996 Bar",t:["a11"],q:"A security guard shot dead a man he saw scaling the factory wall. The man was unarmed. The guard claims defense of property and fulfillment of duty. Convict?",iss:["No unlawful aggression","Killing not a necessary consequence of duty"],
a:"<b>Yes, convict him of homicide.</b> Defense of property requires unlawful aggression; climbing a wall, without any attack on the guard, is not. Fulfillment of duty requires that the injury be the <b>necessary consequence</b> of the duty; a guard's duty does not require killing an unarmed intruder. At most, he gets incomplete fulfillment of duty (Art. 69).",c:"No aggression; killing not a necessary consequence of duty → homicide."},
{id:"b13",set:"Past bar",src:"1996 Bar",t:["a6","a8"],q:"Edgardo paid Vicente to kidnap a girl Edgardo was courting. Vicente asked for more money; when Edgardo would not pay, Vicente reported him. Attempted kidnapping?",iss:["Proposal is preparatory, not overt"],
a:"<b>No.</b> No overt act toward kidnapping was commenced. At most, Edgardo made a <b>proposal</b>, which is a preparatory act and is not punishable for kidnapping (Art. 8).",c:"Proposal ≠ overt act; a proposal to kidnap is not punishable."},
{id:"b14",set:"Past bar",src:"2004 Bar",t:["a11","a8"],q:"BB and CC knifed FT. FT's son ST drew a gun, but AA grappled with him to stop him from shooting. FT died. AA claims avoidance of a greater evil. Will it prosper?",iss:["¶4 requires an actual evil; ST's defense of his father is lawful","Conspiracy"],
a:"<b>No.</b> ST's act was a lawful defense of a relative, not an “evil.” By stopping it, AA only helped ensure the killing (cf. <i>Ricohermoso</i>). His acts show a common design with BB and CC, so he is a co-conspirator: the act of one is the act of all.",c:"Preventing a lawful defense is not avoiding an evil; AA is a co-conspirator."},
{id:"b15",set:"Past bar",src:"1990 Bar",t:["a11"],q:"(a) Is a doctor liable for deliberately turning off a patient's life support (mercy killing)? (b) What if, to save the mother, the doctor sacrificed the unborn child?",iss:["Euthanasia not justified","State of necessity"],
a:"<b>(a) Liable</b>: euthanasia is not a justifying circumstance in our jurisdiction. <b>(b) Not liable</b>: avoidance of a greater evil (Art. 11(4)). The evil to the mother actually existed, the injury avoided was greater, and there was no other practical and less harmful means.",c:"Euthanasia: liable. Sacrificing the fetus to save the mother: Art. 11(4)."}
];

window.MCQ = [
{id:"q1",src:"San Beda 2019 · MCQ 1",q:"Principles of public international law exempt certain individuals from the generality of criminal law. Who among the following is NOT exempt?",ch:["Ministers resident","Commercial attaché of a foreign country","Ambassador","Chiefs of mission"],k:1,why:"Ambassadors, ministers resident and chiefs of mission are diplomatic agents. A commercial attaché, like a consul, is not covered."},
{id:"q2",src:"San Beda 2019 · MCQ 2",q:"The maxim “Nullum crimen, nulla poena sine lege” means that:",ch:["the act is criminal when committed but the penalty is prescribed in a later law","the act is criminal and punished under common law","there is a crime as long as the act is inherently evil","crime is a product of the law"],k:3,why:"There is no crime without a law punishing it: crime is a creation of law (basis of Art. 5 ¶1)."},
{id:"q3",src:"San Beda 2019 · MCQ 3 (2011 Bar)",q:"Three men gave Arnold fist blows and kicks, causing him to fall. As they surrounded him and kept hitting him, he grabbed a knife from his pocket and stabbed one of them in the heart. What crime did Arnold commit?",ch:["Homicide with incomplete self-defense, since he could have run","Homicide, since stabbing the heart is fatal","Homicide mitigated by incomplete self-defense, since stabbing the heart is excessive","No crime, since he needed to repel the aggression with reasonable means"],k:3,why:"There was continuing unlawful aggression by three men; a knife is rationally equivalent given their number; there is no duty to retreat; he is not expected to aim at less vital parts (Mack)."},
{id:"q4",src:"San Beda 2019 · MCQ 4 (2011 Bar)",q:"X killed B, mistakenly believing she was his wife, upon surprising her having sex with another man in a motel room. What is X's liability?",ch:["None: exceptional circumstances (Art. 247)","None: mistake of fact","Parricide","Homicide"],k:3,why:"B was not his wife, so it is not parricide, and the Art. 247 privilege (destierro, not exemption) belongs to a spouse who surprises his own spouse. Killing a stranger by mistaking her identity is still a felony (error in personae) → homicide.",note:"Arguable: Reyes says mistake of fact can cover an absolutory situation such as Art. 247. But neither 'none' option fits, because even Art. 247 is punished with destierro. Go with (D)."},
{id:"q5",src:"San Beda 2019 · MCQ 5/7 (2011 Bar)",q:"When committed outside Philippine territory, our courts DO NOT have jurisdiction over the crime of:",ch:["treason","piracy","espionage","rebellion"],k:3,why:"Art. 2(5) covers crimes against national security and the law of nations (Title One). Rebellion is in Title Three (public order)."},
{id:"q6",src:"San Beda 2019 · MCQ 6",q:"Which is an exception to the territoriality rule?",ch:["Trademark violation by an alien in the Philippines","Forgery of US bank notes in the Philippines","A crime by a Filipino in the disputed Spratly Islands","Plunder committed by a Philippine public officer at his post abroad"],k:3,why:"Art. 2(4): an offense by a public officer in the exercise of his functions, committed abroad. (A and B are committed within the Philippines, so territoriality applies.)"},
{id:"q8",src:"San Beda 2019 · MCQ 8",q:"Motive is generally IMMATERIAL in determining criminal liability EXCEPT when:",ch:["the court wants to know who led several offenders","the evidence is both direct and circumstantial","fixing the degree of the penalty","the evidence of guilt is circumstantial"],k:3,why:"Motive matters when identity is in doubt or the evidence is purely circumstantial."},
{id:"q9",src:"San Beda 2019 · MCQ 9 (2011 Bar)",q:"X inflicted serious injuries on Y. Because of a delay in medical treatment, Y died. Is X liable for Y's death?",ch:["Yes: the delay did not break the causal connection","Yes: any intervening cause is immaterial","No: the injury was not the immediate cause","No: the delay was an intervening cause"],k:0,why:"Neglect by the victim or a third person, such as delayed treatment, is not an efficient intervening cause (Reyes). (B) overstates: an efficient intervening cause does break the chain."},
{id:"q10",src:"San Beda 2019 · MCQ 10 (2011 Bar)",q:"In an attempted felony, the offender's preparatory act:",ch:["itself constitutes an offense","must seem connected to the intended crime","must not be connected to the intended crime","requires another act to result in a felony"],k:3,why:"A preparatory act is not yet an act of execution: another act (an overt act) is needed before it becomes an attempt.",note:"Oddly worded bar question; (D) is the published answer."},
{id:"q11",src:"San Beda 2019 · MCQ 11 (2011 Bar)",q:"X violently kicked vital parts of E's body. E fled for his life, refused treatment, and died 3 days later. Is X liable for E's death?",ch:["No: kicks cannot cause death","No: death took too long","Yes: E cannot be compelled to undergo treatment","Yes: death was a natural result of the injuries X inflicted"],k:3,why:"Death within a reasonable time from injuries to vital parts is the natural consequence; refusal of treatment is not an efficient intervening cause."},
{id:"q12",src:"San Beda 2019 · MCQ 12",q:"A battered woman claiming self-defense must prove that the final acute battering episode was preceded by:",ch:["3 battering episodes","4 battering episodes","5 battering episodes","2 battering episodes"],k:3,why:"Genosa: the cycle of violence must have occurred at least twice."},
{id:"q13",src:"San Beda 2019 · MCQ 13 (2011 Bar)",q:"An Indonesian crewman murders the Filipino captain aboard a Russian-registered vessel anchored outside the breakwaters of Manila Bay. Which court has jurisdiction?",ch:["Indonesian","Russian","Philippine","Whichever court first asserts it"],k:2,why:"The vessel is within Philippine waters; murder breaches public order → triable here (English rule)."},
{id:"q14",src:"San Beda 2019 · MCQ 14",q:"A proposal to commit a felony is punishable only when the law specifically provides, as in proposal to commit:",ch:["rebellion","sedition","espionage","highway robbery"],k:0,why:"Proposal is punished for treason and for coup d'état, rebellion and insurrection (Art. 136). Not for sedition (only conspiracy, Art. 141)."},
{id:"q15",src:"San Beda 2019 · MCQ 15",q:"The Spanish maxim for “He who is the cause of the cause is the cause of the evil caused”:",ch:["El que dela causa es causa del mal causado","El causa dela causa del causa es causa del mal causado","El que es causa de la causa es causa del mal causado","El que es causa es causa dela causa del mal causado"],k:2,why:"El que es causa de la causa es causa del mal causado: the basis of Art. 4(1)."},
{id:"q16",src:"Mock",q:"Theft is consummated when:",ch:["the thief leaves the premises","the thief is able to dispose of the property","the thief gains possession of the property with intent to gain","the owner discovers the loss"],k:2,why:"Valenzuela: apoderamiento is complete upon gaining possession; there is no frustrated theft."},
{id:"q17",src:"Mock",q:"Which of these can never be an impossible crime?",ch:["Murder","Theft","Kidnapping","Estafa"],k:2,why:"Art. 4(2) covers only offenses against persons or property; kidnapping is against liberty (Domasian)."},
{id:"q18",src:"Mock",q:"A felony punishable by a fine of exactly ₱40,000 is:",ch:["grave","less grave","light","not a felony"],k:2,why:"Art. 9 (RA 10951): 'not exceeding ₱40,000' → light. Art. 9 prevails over Art. 26 for classifying felonies."},
{id:"q19",src:"Mock",q:"The only justifying circumstance under which civil liability is incurred:",ch:["self-defense","defense of a stranger","avoidance of a greater evil","obedience to an order"],k:2,why:"Art. 11(4): the persons benefited pay in proportion to the benefit (Art. 101)."},
{id:"q20",src:"Mock",q:"In Oanis, why was mistake of fact rejected?",ch:["The victim was armed","The officers had time and opportunity to verify the victim's identity","The officers had no arrest order","The victim fired first"],k:1,why:"The victim was asleep; nothing pressed them to act at once; the mistake was due to their fault."}
];

<script>(function(){
"use strict";
const EXAM = new Date("2026-11-07T14:00:00+08:00").getTime();
const $ = (s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const strip = s=>String(s).replace(/<[^>]+>/g,"");
const shuffle = a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const KEY="crimdesk1:";
const store={get(k,d){try{const v=localStorage.getItem(KEY+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v));}catch(e){}}};
let srs=store.get("srs",{}), fix=store.get("fix",{}), read=store.get("read",{}), stats=store.get("stats",{rev:0,streak:0,best:0,days:{}}), sxdone=store.get("sx",{}), notes=store.get("notes",{});
const save=()=>{store.set("srs",srs);store.set("fix",fix);store.set("stats",stats);store.set("read",read);store.set("sx",sxdone);};

// ---------- topics ----------
const TOPIC_NAME={}; TOPICS.forEach(t=>TOPIC_NAME[t.k]=t.n);
const ART_TOPIC={"1":"intro","2":"a2","3":"a3","4":"a4a","5":"a5","6":"a6","7":"a7","8":"a8","9":"a9","10":"a10","11":"a11"};
const CASE={}; CASES.forEach(c=>CASE[c.id]=c);
const SHORT={bull:"Bull",vanwilsem:"Van Wilsem",wongcheng:"Wong Cheng",lookchaw:"Look Chaw",ahsing:"Ah Sing",lollo:"Lol-lo",ahchong:"Ah Chong",oanis:"Oanis",magsumbol:"Magsumbol",gervero:"Gervero",iligan:"Iligan",mananquil:"Mananquil",brobst:"Brobst",garcia:"Garcia",balmores:"Balmores",intod:"Intod",domasian:"Domasian",jacinto:"Jacinto",eduave:"Eduave",orita:"Orita",campuhan:"Campuhan",adiao:"Adiao",valenzuela:"Valenzuela",lamahang:"Lamahang",salvilla:"Salvilla",borinaga:"Borinaga",sypio:"Sy Pio",ravelo:"Ravelo",kalalo:"Kalalo",boholst:"Boholst-Caballero",alconga:"Alconga",mack:"Mack",sumicad:"Sumicad",genosa:"Genosa",luague:"Luague",delacruz:"De la Cruz",jaurigue:"Jaurigue",apolinar:"Apolinar",bumanglag:"Bumanglag",narvaez:"Narvaez",chuahiong:"Chua Hiong",pelayo:"Pelayo",esmedia:"Esmedia",normahernandez:"Norma Hernandez",dudley:"Dudley",ty:"Ty",delima:"Delima",belbes:"Belbes",beronilla:"Beronilla",agao:"Agao"};
const BY_SHORT={}; Object.entries(SHORT).forEach(([id,s])=>BY_SHORT[s.toLowerCase()]=id);
const HC={g:"Liable / conviction affirmed",r:"Acquitted / not liable",y:"Modified (crime, stage or circumstance changed)",b:"Principle"};
const hook=c=>`<span class="hk hk-${c.hc}" title="${HC[c.hc]}">${esc(c.h)}</span>`;

// ---------- cards ----------
const CARDS={}; const DECK={codal:[],elements:[],cases:[]};
CODAL.forEach(ar=>ar.p.forEach((para,pi)=>{let bi=0;para.replace(/\[\[(.+?)\]\]/g,()=>{const id=`c-${ar.a}-${pi}-${bi}`;CARDS[id]={id,deck:"codal",art:ar.a,t:ART_TOPIC[ar.a],ar,pi,bi};DECK.codal.push(id);bi++;return"";});}));
ELEMENTS.forEach(L=>L.i.forEach((_,ii)=>{const id=`e-${L.id}-${ii}`;CARDS[id]={id,deck:"elements",t:L.t,L,ii};DECK.elements.push(id);}));
const DIRS={cr:"Case → doctrine",fc:"Facts → case",dc:"Doctrine → case",fr:"Facts → ruling & why"};
CASES.forEach(c=>Object.keys(DIRS).forEach(d=>{const id=`k-${c.id}-${d}`;CARDS[id]={id,deck:"cases",t:c.t==="a4b"?"a4b":c.t,c,dir:d};DECK.cases.push(id);}));
const topicOf=card=>card.t;

// ---------- SRS ----------
const now=()=>Date.now(), DAY=864e5;
function isDue(id){const s=srs[id];return s&&s.due<=now();}
function grade(id,g){
  const s=srs[id]||{ivl:0,ease:2.3,reps:0,due:0};
  if(g===1){s.ivl=0;s.ease=Math.max(1.3,s.ease-.2);s.due=now()+2*6e4;s.lapses=(s.lapses||0)+1;}
  else if(g===2){s.ivl=Math.max(.3,s.ivl*1.2);s.ease=Math.max(1.3,s.ease-.15);}
  else if(g===3){s.ivl=s.reps===0?.5:Math.max(1,s.ivl*s.ease);}
  else {s.ivl=s.reps===0?2:s.ivl*s.ease*1.4;s.ease=Math.min(2.8,s.ease+.15);}
  s.ivl=Math.min(s.ivl,4); if(g>1)s.due=now()+s.ivl*DAY; s.reps++; srs[id]=s;
  if(g===1){fix[id]=0;} else if(id in fix && g>=3){fix[id]++; if(fix[id]>=2) delete fix[id];}
  stats.rev++; const dk=new Date().toDateString(); stats.days[dk]=(stats.days[dk]||0)+1;
  if(g>=3){stats.streak++;stats.best=Math.max(stats.best,stats.streak);} else stats.streak=0;
  save();
}
function buildRound(ids,n=20){
  const due=ids.filter(isDue).sort((a,b)=>srs[a].due-srs[b].due);
  const fresh=ids.filter(i=>!srs[i]);
  const later=ids.filter(i=>srs[i]&&!isDue(i)).sort((a,b)=>srs[a].due-srs[b].due);
  const fx=ids.filter(i=>i in fix);
  const pick=[...new Set([...fx,...due,...shuffle(fresh),...later])].slice(0,n);
  return shuffle(pick);
}

// ---------- rendering helpers ----------
function codalHTML(a,opts={}){
  const ar=CODAL.find(x=>x.a===a); if(!ar)return"";
  const ps=ar.p.map(p=>`<p>${p.replace(/\[\[(.+?)\]\]/g,'<span class="key">$1</span>')}</p>`).join("");
  return `<div class="rv-codal"><div class="mono">Codal · RPC</div><div class="ttl">Art. ${ar.a}. ${esc(ar.t)}.</div>${ps}${ar.n?`<div class="rv-note">⚠ ${ar.n}</div>`:""}</div>`;
}
function linkCases(html){
  return html.replace(/<i>([^<]+)<\/i>/g,(m,t)=>{const id=BY_SHORT[t.trim().toLowerCase()];return id?`<i class="cl" data-case="${id}" style="cursor:pointer;text-decoration:underline dotted">${t}</i>`:m;});
}
function gateHTML(gid){
  const G=GATES[gid]; if(!G)return"";
  return `<div class="gt" data-gate="${gid}"><div class="mono">Decision gate · tap through</div><div class="disp" style="font-size:1.05rem">${G.n}</div><div class="gt-body"></div></div>`;
}
function runGate(el){
  const G=GATES[el.dataset.gate]; const body=$(".gt-body",el); const path=[];
  function show(nodeId){
    const nd=G.nodes[nodeId];
    body.innerHTML=`${path.length?`<div class="gt-path">${path.map(p=>esc(p)).join(" → ")}</div>`:""}<div class="gt-q">${nd.q}</div><div class="cd-row"><button class="cd-btn sm" data-a="y">Yes</button><button class="cd-btn sm" data-a="n">No</button>${path.length?'<button class="cd-btn sm" data-a="r">Restart</button>':""}</div>`;
    body.onclick=e=>{const a=e.target.dataset.a;if(!a)return; if(a==="r"){path.length=0;return show(G.start);} const nx=nd[a]; path.push((a==="y"?"Yes":"No")); if(typeof nx==="string")show(nx); else end(nx);};
  }
  function end(x){const tone={g:"tone-green",r:"tone-red",y:"tone-yellow",b:"tone-blue"}[x.tone]||"tone-blue";
    body.innerHTML=`<div class="gt-path">${path.join(" → ")}</div><div class="gt-end ${tone}">${x.end}</div><div class="cd-row" style="margin-top:8px"><button class="cd-btn sm" data-a="r">Restart</button></div>`;
    body.onclick=e=>{if(e.target.dataset.a==="r"){path.length=0;show(G.start);}};}
  show(G.start);
}

// ---------- modal ----------
function openCase(id){
  const c=CASE[id]; if(!c)return;
  const bg=document.createElement("div"); bg.className="md-bg";
  bg.innerHTML=`<div class="md" role="dialog" aria-label="${esc(c.n)}"><div class="cd-row" style="justify-content:space-between"><span class="mono">${esc(TOPIC_NAME[c.t]||"")} · ${esc(c.g||"")}</span><button class="cd-ic" data-x>✕</button></div>
  <h2>${esc(c.n)}</h2><div class="cd-muted">${esc(c.c)} ${hook(c)}</div>
  <div class="sec"><div class="lbl">Facts</div><div>${c.f}</div></div>
  <div class="sec"><div class="lbl">Ruling</div><div>${c.r}</div></div>
  <div class="sec"><div class="lbl">Why (element met or failed)</div><div>${c.w}</div></div>
  <div class="sec tone-blue rv-box"><div class="lbl">Doctrine</div><div>${c.d}</div></div>
  ${c.k&&c.k.length?`<div class="sec"><div class="lbl">Recit nitpicks</div><ul>${c.k.map(x=>`<li>${x}</li>`).join("")}</ul></div>`:""}
  ${c.x?`<div class="sec flag">⚠ ${c.x}</div>`:""}</div>`;
  bg.addEventListener("click",e=>{if(e.target===bg||e.target.hasAttribute("data-x"))bg.remove();});
  document.body.appendChild(bg);
}
document.addEventListener("click",e=>{const t=e.target.closest("[data-case]");if(t){e.preventDefault();openCase(t.dataset.case);}});

// ---------- views ----------
const V={};
let tab=store.get("tab","today");
function go(t,arg){tab=t;store.set("tab",t);$$(".cd-tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));const m=$("main");m.innerHTML="";V[t](m,arg);window.scrollTo(0,0);}

// TODAY
const PLAN=[
{d:"2026-11-02",lbl:"Mon, 2 Nov",x:"Exam method + <b>Intro/Art. 1, Art. 2, Art. 3</b> in the Reviewer. Codal cloze: Arts. 1–3. Cases: Art. 2–3 (Facts → ruling). Re-read <i>Ah Chong</i>.",go:["review","a2"]},
{d:"2026-11-03",lbl:"Tue, 3 Nov",x:"Class: <b>note what Sir says about the exam</b>. Then <b>Art. 4(1) and 4(2), Art. 5</b>; tap through both gates. Codal cloze: Arts. 4–5. Elements: Art. 3–4 lists.",go:["review","a4a"]},
{d:"2026-11-04",lbl:"Wed, 4 Nov",x:"<b>Art. 6 (12 cases)</b> + Arts. 7–10. Stages gate. Cases drill: Art. 6, all directions. Commute: Reyes elements deck.",go:["review","a6"]},
{d:"2026-11-05",lbl:"Thu, 5 Nov",x:"<b>Art. 11 (20 cases)</b>. Self-defense gate. Codal cloze: Art. 11 (every requisite, word for word). Mock exam A, questions 1–4, timed.",go:["review","a11"]},
{d:"2026-11-06",lbl:"Fri, 6 Nov",x:"<b>Full mock</b>: Mock exam A, questions 5–8, + San Beda, under exam conditions (14 minutes per question). Then clear the fix list and every due card. Sleep by 1:00 a.m.",go:["samplex"]},
{d:"2026-11-07",lbl:"Sat, 7 Nov",x:"Morning: fix list → due codal cards → skim the hooks wall (Cases → Browse). Lunch, then rest. <b>Exam 2:00–4:00 p.m.</b> Write the conclusion first.",go:["today"]}];
function countdown(){const ms=EXAM-now(); if(ms<=0)return"Exam day: done or in progress";const d=Math.floor(ms/DAY),h=Math.floor(ms%DAY/36e5),m=Math.floor(ms%36e5/6e4);return `<b>${d}d ${h}h ${m}m</b> to the midterm`;}
V.today=m=>{
  const all=Object.keys(CARDS), seen=all.filter(i=>srs[i]).length, due=all.filter(isDue).length, fx=Object.keys(fix).length;
  const readN=TOPICS.filter(t=>read[t.k]).length, todayKey=new Date().toISOString().slice(0,10);
  const deckStat=d=>{const ids=DECK[d];return `${ids.filter(i=>srs[i]).length}/${ids.length}`;};
  const sxMiss=Object.entries(sxdone).filter(([k,v])=>v==="miss").map(([k])=>k);
  m.innerHTML=`<div class="cd-card"><div class="mono">Criminal Law 1 · Prof. Gutierrez · Midterm</div><h1 style="margin:4px 0 2px">Saturday, 7 November · 2:00–4:00 p.m.</h1><div class="cd-muted">Arts. 1–11 of the RPC: codal → Reyes → doctrines. ${countdown()}.</div>
  <div class="cd-row" style="margin-top:12px"><button class="cd-btn pri" id="start">▶ Start session (fix list + due + new)</button><button class="cd-btn" data-go="codal">Codal drill</button><button class="cd-btn" data-go="cases">Cases drill</button></div></div>
  <div class="cd-grid">
   <div class="cd-card"><div class="mono">Due now</div><div class="cd-stat">${due}</div><div class="cd-muted">cards across all decks</div></div>
   <div class="cd-card"><div class="mono">Fix list</div><div class="cd-stat">${fx}</div><div class="cd-muted">missed; clear by getting each right twice</div></div>
   <div class="cd-card"><div class="mono">Seen</div><div class="cd-stat">${seen}/${all.length}</div><div class="cd-muted">codal ${deckStat("codal")} · elements ${deckStat("elements")} · cases ${deckStat("cases")}</div></div>
   <div class="cd-card"><div class="mono">Streak</div><div class="cd-stat">${stats.streak}</div><div class="cd-muted">best ${stats.best} · ${stats.rev} reviews total</div></div>
  </div>
  <div class="cd-card"><div class="cd-row" style="justify-content:space-between"><div class="mono">Reviewer read</div><span class="cd-muted">${readN}/${TOPICS.length}</span></div><div class="pg" style="margin-top:6px"><i style="width:${readN/TOPICS.length*100}%"></i></div>
  <div style="margin-top:8px">${TOPICS.map(t=>`<span class="cd-chip ${read[t.k]?"on":""}" data-topic="${t.k}" style="cursor:pointer">${read[t.k]?"✓ ":""}${esc(t.n)}</span>`).join("")}</div></div>
  ${sxMiss.length?`<div class="cd-card"><div class="mono">Samplex to redo</div>${sxMiss.map(id=>{const e=ESSAYS.find(x=>x.id===id);return e?`<span class="cd-chip" data-sx="${id}" style="cursor:pointer">${esc(e.set)} · ${esc(e.src.split("·")[0])}</span>`:"";}).join("")}</div>`:""}
  <h2 style="margin:22px 0 10px">Study plan</h2><div class="cd-plan">${PLAN.map(p=>`<div class="cd-day ${p.d===todayKey?"today":""}"><b>${p.lbl}</b><div>${p.x} <button class="cd-btn sm" data-plan='${JSON.stringify(p.go)}'>Open</button></div></div>`).join("")}</div>
  <p class="cd-muted" style="font-size:.85rem;margin-top:18px">Progress is saved in this browser only (separately on your MacBook and iPhone). Hook colors: <span class="hk hk-g">liable</span> <span class="hk hk-r">acquitted</span> <span class="hk hk-y">modified</span> <span class="hk hk-b">principle</span></p>`;
  $("#start",m).onclick=()=>drill(buildRound(Object.keys(CARDS),25),"Session","today",Object.keys(CARDS));
  m.onclick=e=>{const g=e.target.closest("[data-go]");if(g)go(g.dataset.go);const tp=e.target.closest("[data-topic]");if(tp)go("review",tp.dataset.topic);const pl=e.target.closest("[data-plan]");if(pl){const a=JSON.parse(pl.dataset.plan);go(a[0],a[1]);}const sx=e.target.closest("[data-sx]");if(sx)go("samplex",sx.dataset.sx);};
};

// REVIEWER
let blur=false;
function renderBlock(b){
  switch(b.k){
   case"codal":return codalHTML(b.a);
   case"h":return `<h3>${b.x}</h3>`;
   case"p":return `<p>${b.x}</p>`;
   case"ul":return `<ul>${b.x.map(x=>`<li>${x}</li>`).join("")}</ul>`;
   case"box":return `<div class="rv-box tone-${b.tone}">${b.title?`<div class="bt">${b.title}</div>`:""}${b.x.map(x=>`<p>${x}</p>`).join("")}</div>`;
   case"tbl":return `<div class="tblw"><table class="rv-t"><thead><tr>${b.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
   case"cases":return `<div class="rv-cases">${b.ids.map(id=>{const c=CASE[id];if(!c)return"";return `<div class="rv-case"><span class="nm" data-case="${id}">${esc(c.n)}</span> <span class="cd-muted" style="font-size:.85rem">${esc(c.c)}</span>${hook(c)}<div class="d"><b>Doctrine:</b> ${c.d}</div><div class="cd-muted" style="font-size:.9rem;margin-top:3px">${c.r}</div></div>`;}).join("")}</div>`;
   case"exam":return `<div class="rv-exam"><div class="mono">On the exam, write</div><div>${b.x}</div></div>`;
   case"drill":return `<div class="rv-drill"><h3>Change one fact</h3>${b.x.map(([q,a])=>`<details><summary>${q}</summary><div class="ans">${a}</div></details>`).join("")}</div>`;
   case"gate":return gateHTML(b.id);
   case"gatelist":return `<h3>All decision gates</h3>${Object.keys(GATES).map(gateHTML).join("")}`;
  } return"";
}
V.review=(m,key)=>{
  key=key||store.get("rvTopic","method"); if(!TOPICS.find(t=>t.k===key))key="method"; store.set("rvTopic",key);
  const T=TOPICS.find(t=>t.k===key);

// DRILL ENGINE
let D=null;
function drill(ids,title,back,pool){
  if(!ids.length){alert("No cards match that filter.");return;}
  D={q:ids.slice(),i:0,flipped:false,hist:[],title,back:back||tab,requeued:new Set(),pool:pool||ids.slice()};
  document.body.classList.add("focus"); renderDrill();
}
function exitDrill(){document.body.classList.remove("focus");const b=D&&D.back;D=null;go(b||"today");}
function cardFront(c){
  if(c.deck==="codal"){let bi=0;const para=c.ar.p[c.pi].replace(/\[\[(.+?)\]\]/g,(m,x)=>{const r=bi===c.bi?'<span class="dr-blank">?</span>':x;bi++;return r;});
    return `<div class="dr-kind mono">Codal · Art. ${c.art} · ${esc(c.ar.t)}</div><div class="dr-front rv-codal" style="margin-top:12px">${para}</div>`;}
  if(c.deck==="elements"){return `<div class="dr-kind mono">Reyes · ${esc(TOPIC_NAME[c.t]||"")}</div><div class="disp" style="font-size:1.2rem;text-align:center;margin:8px 0">${esc(c.L.n)}</div><${c.L.o?"ol":"ul"} class="dr-items">${c.L.i.map((x,j)=>`<li>${j===c.ii?'<span class="dr-blank">?</span>':x}</li>`).join("")}</${c.L.o?"ol":"ul"}><div class="dr-cue">What is missing?</div>`;}
  const k=c.c, lbl=`<div class="dr-kind mono">${DIRS[c.dir]} · ${esc(TOPIC_NAME[k.t]||"")}</div>`;
  if(c.dir==="cr")return `${lbl}<div class="dr-name">${esc(k.n)}</div><div class="dr-cue">State the doctrine, the ruling, and the deciding fact.</div>`;
  if(c.dir==="dc")return `${lbl}<div class="dr-front" style="margin-top:14px;text-align:center;font-size:1.1rem">${k.d}</div><div class="dr-cue" style="margin-top:10px">Which case?</div>`;
  const facts=k.f.replace(new RegExp(SHORT[k.id].replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"),"▢▢▢");
  if(c.dir==="fc")return `${lbl}<div class="dr-front" style="margin-top:12px">${facts}</div><div class="dr-cue" style="margin-top:10px">Name the case.</div>`;
  return `${lbl}<div class="dr-front" style="margin-top:12px">${k.f}</div><div class="dr-cue" style="margin-top:10px">Ruling? Which element was met or failed, and <b>why</b>?</div>`;
}
function cardBack(c){
  if(c.deck==="codal"){let bi=0;const para=c.ar.p[c.pi].replace(/\[\[(.+?)\]\]/g,(m,x)=>{const r=bi===c.bi?`<span class="dr-fill">${x}</span>`:x;bi++;return r;});return `<div class="rv-codal">${para}</div>`;}
  if(c.deck==="elements")return `<div><span class="dr-fill">${c.L.i[c.ii]}</span></div>`;
  const k=c.c, head=`<div class="disp" style="font-style:italic;font-size:1.2rem;text-align:center">${esc(k.n)}${hook(k)}</div><div class="cd-muted" style="text-align:center;font-size:.85rem">${esc(k.c)}</div>`;
  if(c.dir==="fc"||c.dir==="dc")return `${head}<p><b>Doctrine:</b> ${k.d}</p><p class="cd-muted">${k.r}</p>${c.dir==="dc"?`<details><summary>Facts</summary>${k.f}</details>`:""}`;
  return `${head}<p><b>Ruling:</b> ${k.r}</p><p><b>Why:</b> ${k.w}</p><p><b>Doctrine:</b> ${k.d}</p>${k.k&&k.k.length?`<details><summary>Recit nitpicks</summary><ul>${k.k.map(x=>`<li>${x}</li>`).join("")}</ul></details>`:""}`;
}
function renderDrill(){
  const m=$("main");
  if(D.i>=D.q.length){m.innerHTML=`<div class="fx-bar"><span>${esc(D.title)}</span><button class="cd-btn sm" id="exit">Exit</button></div><div class="dr-shell"><div class="cd-card dr-done"><div class="disp" style="font-size:1.6rem">Round done</div><p class="cd-muted">${D.q.length} cards · streak ${stats.streak} (best ${stats.best}) · fix list ${Object.keys(fix).length}</p><div class="cd-row" style="justify-content:center"><button class="cd-btn pri" id="again">Another round</button>${D.hist.length?'<button class="cd-btn" id="prev">← Previous</button>':""}<button class="cd-btn" id="exit2">Done</button></div></div></div>`;
    $("#exit",m).onclick=exitDrill;$("#exit2",m).onclick=exitDrill;const p=$("#prev",m);if(p)p.onclick=undo;
    $("#again",m).onclick=()=>{const P=D.pool;drill(buildRound(P,20),D.title,D.back,P);};return;}
  const id=D.q[D.i], c=CARDS[id];
  m.innerHTML=`<div class="fx-bar"><span>${esc(D.title)} · ${countdown().replace(/<[^>]+>/g,"")}</span><button class="cd-btn sm" id="exit">Exit (Esc)</button></div>
  <div class="dr-shell"><div class="dr-bar"><span>${D.i+1} / ${D.q.length}${id in fix?' · <span style="color:var(--red)">fix list</span>':""}</span><span>🔥 ${stats.streak}</span></div>
  <div class="cd-card dr-card" id="card">${cardFront(c)}${D.flipped?`<div class="dr-ans">${cardBack(c)}</div>`:'<button class="cd-btn dr-show" id="flip">Show answer (Space)</button>'}</div>
  ${D.flipped?`<div class="dr-grades"><button class="g1" data-g="1">Again<small>1 · ← swipe</small></button><button class="g2" data-g="2">Hard<small>2</small></button><button class="g3" data-g="3">Good<small>3 · swipe →</small></button><button class="g4" data-g="4">Easy<small>4 · swipe ↑</small></button></div>`:""}
  <div class="cd-row" style="margin-top:10px;justify-content:space-between"><button class="cd-btn sm" id="prev" ${D.hist.length?"":"disabled"}>← Previous</button><span class="cd-muted" style="font-size:.8rem">Space flip · 1–4 grade · ← back · Esc exit</span></div></div>`;
  $("#exit",m).onclick=exitDrill; $("#prev",m).onclick=undo;
  const f=$("#flip",m); if(f)f.onclick=flip;
  $$(".dr-grades button",m).forEach(b=>b.onclick=()=>doGrade(+b.dataset.g));
  const card=$("#card",m); let sx=0,sy=0,st=0;
  card.addEventListener("touchstart",e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now();},{passive:true});
  card.addEventListener("touchend",e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)<12&&Math.abs(dy)<12&&Date.now()-st<400){if(!D.flipped&&!e.target.closest("summary,a,button"))flip();return;}
    if(!D.flipped)return; if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy))doGrade(dx>0?3:1); else if(dy<-80&&Math.abs(dy)>Math.abs(dx))doGrade(4);});
}
function flip(){if(!D||D.flipped)return;D.flipped=true;renderDrill();}
function doGrade(g){
  if(!D||!D.flipped)return; const id=D.q[D.i];
  D.hist.push({i:D.i,id,s:srs[id]?{...srs[id]}:null,f:id in fix?fix[id]:undefined,streak:stats.streak,best:stats.best,rev:stats.rev,qlen:D.q.length});
  grade(id,g);
  if(g===1&&!D.requeued.has(id)){D.requeued.add(id);D.q.push(id);}
  D.i++;D.flipped=false;renderDrill();
}
function undo(){
  if(!D||!D.hist.length)return; const h=D.hist.pop();
  if(h.s)srs[h.id]=h.s; else delete srs[h.id];
  if(h.f===undefined)delete fix[h.id]; else fix[h.id]=h.f;
  stats.streak=h.streak;stats.best=h.best;stats.rev=h.rev; D.q.length=h.qlen; D.requeued.delete(h.id);
  D.i=h.i;D.flipped=true;save();renderDrill();
}
document.addEventListener("keydown",e=>{
  if(!D){if(e.key==="Escape")$$(".md-bg").forEach(x=>x.remove());return;}
  if(e.target.matches("input,textarea"))return;
  if(e.key===" "){e.preventDefault();flip();}
  else if(/^[1-4]$/.test(e.key))doGrade(+e.key);
  else if(e.key==="ArrowLeft")undo();
  else if(e.key==="Escape"){if($(".md-bg"))$$(".md-bg").forEach(x=>x.remove());else exitDrill();}
});

  const hits=words.length?IDX.filter(h=>words.every(w=>(h.t+" "+h.x).toLowerCase().includes(w))).slice(0,60):[];
  const snip=x=>{const i=x.toLowerCase().indexOf(words[0]);const s=Math.max(0,i-70);let t=esc(x.slice(s,s+220));words.forEach(w=>{t=t.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"),mm=>`<mark>${mm}</mark>`);});return(s?"…":"")+t+"…";};
  m.innerHTML=`<div class="cd-card"><h2 style="margin:0 0 6px">Search</h2><div class="cd-muted">${hits.length} result${hits.length===1?"":"s"} for “${esc(q)}”</div>${hits.map((h,i)=>`<div class="sr-hit" data-i="${i}"><span class="hk hk-b" style="margin:0 6px 0 0">${h.k}</span><b>${esc(h.t)}</b><div class="cd-muted" style="font-size:.9rem">${snip(h.x)}</div></div>`).join("")}</div>`;
  m.onclick=e=>{const h=e.target.closest("[data-i]");if(h)hits[+h.dataset.i].go();};
};

// ---------- boot ----------
function theme(t){if(t)document.documentElement.setAttribute("data-theme",t);else document.documentElement.removeAttribute("data-theme");store.set("theme",t||"");}
theme(store.get("theme",""));
$("#theme").onclick=()=>{const cur=document.documentElement.getAttribute("data-theme");const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme: dark)").matches;theme(dark?"light":"dark");};
$$(".cd-tab").forEach(b=>b.onclick=()=>go(b.dataset.tab));
const sIn=$("#search"); let st; sIn.oninput=()=>{clearTimeout(st);st=setTimeout(()=>{if(sIn.value.trim().length>1)go("search",sIn.value);},250);};
sIn.onkeydown=e=>{if(e.key==="Enter")go("search",sIn.value);};
const tick=()=>{$("#count").innerHTML=countdown();}; tick(); setInterval(tick,30000);
go(V[tab]&&tab!=="search"?tab:"today");
})();
</script>
