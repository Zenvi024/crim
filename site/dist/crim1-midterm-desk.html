{a:"1",t:"Time when Act takes effect",p:[
"This Code shall take effect on the [[first day of January, nineteen hundred and thirty-two]]."]},
{a:"2",t:"Application of its provisions",p:[
"Except as provided in the [[treaties]] and [[laws of preferential application]], the provisions of this Code shall be enforced not only within the Philippine Archipelago, including its [[atmosphere]], its [[interior waters]] and [[maritime zone]], but also [[outside of its jurisdiction]], against those who:",
"1. Should commit an offense while on a [[Philippine ship or airship]];",
"2. Should [[forge or counterfeit]] any [[coin or currency note]] of the Philippine Islands or [[obligations and securities]] issued by the Government of the Philippine Islands;",
"3. Should be liable for acts connected with the [[introduction into these Islands]] of the obligations and securities mentioned in the preceding number;",
"4. While being [[public officers or employees]], should commit an offense [[in the exercise of their functions]]; or",
"5. Should commit any of the crimes against [[national security]] and the [[law of nations]], defined in [[Title One of Book Two]] of this Code."]},
{a:"3",t:"Definitions",p:[
"Acts and omissions [[punishable by law]] are [[felonies (delitos)]].",
"Felonies are committed not only by means of [[deceit (dolo)]] but also by means of [[fault (culpa)]].",
"There is deceit when the act is performed with [[deliberate intent]]; and there is fault when the wrongful act results from [[imprudence]], [[negligence]], [[lack of foresight]], or [[lack of skill]]."]},
{a:"4",t:"Criminal liability",p:[
"Criminal liability shall be incurred:",
"1. By any person committing [[a felony (delito)]] although the wrongful act done be [[different from that which he intended]].",
"2. By any person performing an act which would be an offense against [[persons or property]], were it not for the [[inherent impossibility]] of its accomplishment or on account of the employment of [[inadequate or ineffectual means]]."]},
{a:"5",t:"Duty of the court in connection with acts which should be repressed but which are not covered by the law, and in cases of excessive penalties",p:[
"Whenever a court has knowledge of any act which it may deem proper to repress and which is [[not punishable by law]], it shall [[render the proper decision]], and shall report to the [[Chief Executive, through the Department of Justice]], the reasons which induce the court to believe that said act should be made the subject of [[penal legislation]].",
"In the same way, the court shall submit to the Chief Executive, through the Department of Justice, such statement as may be deemed proper, [[without suspending the execution of the sentence]], when a strict enforcement of the provisions of this Code would result in the imposition of a [[clearly excessive penalty]], taking into consideration the [[degree of malice]] and the [[injury caused by the offense]]."]},
{a:"6",t:"Consummated, frustrated, and attempted felonies",p:[
"Consummated felonies, as well as those which are frustrated and attempted, are [[punishable]].",
"A felony is consummated when [[all the elements necessary for its execution and accomplishment]] are present; and it is frustrated when the offender performs [[all the acts of execution]] which would produce the felony as a consequence but which, nevertheless, do not produce it by reason of [[causes independent of the will of the perpetrator]].",
"There is an attempt when the offender [[commences the commission of a felony directly by overt acts]], and does not perform [[all the acts of execution]] which should produce the felony by reason of some cause or accident other than his own [[spontaneous desistance]]."]},
{a:"7",t:"When light felonies are punishable",p:[
"Light felonies are punishable only when they have been [[consummated]], with the exception of those committed against [[persons or property]]."]},
{a:"8",t:"Conspiracy and proposal to commit felony",p:[
"Conspiracy and proposal to commit felony are punishable only in the cases in which [[the law specially provides a penalty therefor]].",
"A conspiracy exists when [[two or more persons]] come to an [[agreement concerning the commission of a felony]] and [[decide to commit it]].",
"There is proposal when the person who [[has decided to commit a felony]] [[proposes its execution]] to some other person or persons."]},
{a:"9",t:"Grave felonies, less grave felonies, and light felonies",p:[
"Grave felonies are those to which the law attaches the [[capital punishment]] or penalties which [[in any of their periods are afflictive]], in accordance with [[Article 25]] of this Code.",
"Less grave felonies are those which the law punishes with penalties which [[in their maximum period are correctional]], in accordance with the above-mentioned article.",
"Light felonies are those infractions of law for the commission of which the penalty of [[arresto menor]] or a fine not exceeding [[Forty thousand pesos (₱40,000)]], or both, is provided."],
n:"Art. 9, par. 3 as amended by RA 10951 (2017). Your Reyes edition still says “200 pesos.” Use ₱40,000."},
{a:"10",t:"Offenses not subject to the provisions of this Code",p:[
"Offenses which are or in the future may be punishable under [[special laws]] are not subject to the provisions of this Code. This Code shall be [[supplementary]] to such laws, [[unless the latter should specially provide the contrary]]."]},
{a:"11",t:"Justifying circumstances",p:[
"The following [[do not incur any criminal liability]]:",
"1. Anyone who acts in defense of his [[person or rights]], provided that the following circumstances concur: <i>First.</i> [[Unlawful aggression]]; <i>Second.</i> [[Reasonable necessity of the means employed]] to [[prevent or repel]] it; <i>Third.</i> [[Lack of sufficient provocation]] on the part of the person defending himself.",
"2. Anyone who acts in defense of the person or rights of his [[spouse]], [[ascendants]], [[descendants]], or [[legitimate, natural or adopted brothers or sisters]], or of his [[relatives by affinity in the same degrees]], and those by [[consanguinity within the fourth civil degree]], provided that the [[first and second requisites]] prescribed in the next preceding circumstance are present, and the further requisite, in case the provocation was given by the person attacked, that the one making defense [[had no part therein]].",
"3. Anyone who acts in defense of the person or rights of a [[stranger]], provided that the first and second requisites mentioned in the first circumstance of this article are present and that the person defending be [[not induced by revenge, resentment, or other evil motive]].",
"4. Any person who, in order to [[avoid an evil or injury]], does an act which causes damage to another, provided that the following requisites are present: <i>First.</i> That the evil sought to be avoided [[actually exists]]; <i>Second.</i> That the injury feared be [[greater than that done to avoid it]]; <i>Third.</i> That there be [[no other practical and less harmful means]] of preventing it.",
"5. Any person who acts in the [[fulfillment of a duty]] or in the [[lawful exercise of a right or office]].",
"6. Any person who acts in obedience to an [[order issued by a superior]] for some [[lawful purpose]]."]}
];

{id:"e-char",t:"intro",n:"Three cardinal characteristics of criminal law",o:false,i:["Generality — binds all who live or sojourn in the Philippines","Territoriality — enforced only within Philippine territory (subject to Art. 2's exceptions)","Prospectivity — acts are judged by the law in force when committed (Art. 22: retroactive only if favorable and the accused is not a habitual criminal)"]},

{id:"e-const",t:"intro",n:"Constitutional limits on the power to enact penal laws",o:false,i:["No ex post facto law","No bill of attainder","Equal protection and due process: the law must be general and must not deprive persons of life, liberty or property without due process","No cruel, degrading or inhuman punishment and no excessive fines"]},

{id:"e-inmalase",t:"a3",n:"Mala in se vs. mala prohibita: key differences",o:false,i:["Mala in se: wrong in itself; generally punished under the RPC; mala prohibita: wrong only because prohibited; generally under special laws","Intent (good faith) is a defense in mala in se, but not in mala prohibita, where the only question is whether the law was violated (intent to perpetrate the act is enough)","Degree of participation, stage of execution and modifying circumstances matter in mala in se, but generally not in mala prohibita"]},

{id:"e-just-vs-exempt",t:"a11",n:"Justifying vs. exempting",o:false,i:["Justifying: the ACT is lawful → no crime, no criminal; exempting: the ACTOR is not culpable → there is a crime, but no criminal liability","Justifying: no civil liability (except Art. 11(4)); exempting: civil liability generally remains (except Art. 12(4) and (7))"]},
{id:"e-sd",t:"a11",n:"Self-defense (Art. 11(1)): requisites",o:true,i:["Unlawful aggression","Reasonable necessity of the means employed to prevent or repel it","Lack of sufficient provocation on the part of the person defending himself"]},
{id:"e-ua",t:"a11",n:"Unlawful aggression: what it requires",o:false,i:["An actual physical assault, or a threat to inflict real injury that is offensive and positively strong","The danger must be actual (already happening) or imminent (about to happen), not merely threatening","It must be unlawful","It must still exist when the defense is made (when the aggressor flees, it ceases: Alconga)","It must come from the person attacked by the defender"]},
{id:"e-provo",t:"a11",n:"Third requisite is PRESENT (lack of sufficient provocation) when",o:false,i:["No provocation at all was given","Provocation was given but it was not sufficient","It was sufficient but was not given by the defender","It was given by the defender but was not proximate and immediate to the aggression"]},
{id:"e-bws",t:"a11",n:"Battered Woman Syndrome: the cycle of violence (at least twice)",o:true,i:["Tension-building phase","Acute battering incident","Tranquil, loving (or at least non-violent) phase"]},
{id:"e-rel",t:"a11",n:"Relatives who may be defended (Art. 11(2))",o:false,i:["Spouse","Ascendants","Descendants","Legitimate, natural or adopted brothers and sisters","Relatives by affinity in the same degrees (parents-, children-, siblings-in-law)","Relatives by consanguinity within the fourth civil degree (e.g., first cousins)"]},
{id:"e-defrel",t:"a11",n:"Defense of relatives: requisites",o:true,i:["Unlawful aggression","Reasonable necessity of the means employed to prevent or repel it","If the relative attacked gave provocation, the defender had no part in it"]},
{id:"e-defstr",t:"a11",n:"Defense of a stranger: requisites",o:true,i:["Unlawful aggression","Reasonable necessity of the means employed to prevent or repel it","The defender was not induced by revenge, resentment or other evil motive"]},
{id:"e-necess",t:"a11",n:"Avoidance of greater evil (Art. 11(4)): requisites",o:true,i:["The evil sought to be avoided actually exists","The injury feared is greater than that done to avoid it","There is no other practical and less harmful means of preventing it"]},
{id:"e-duty",t:"a11",n:"Fulfillment of duty / lawful exercise of a right or office: requisites",o:true,i:["The accused acted in the performance of a duty or in the lawful exercise of a right or office","The injury caused or offense committed is the necessary consequence of the due performance of the duty or lawful exercise of the right or office"]},
{id:"e-obey",t:"a11",n:"Obedience to a superior's order: requisites",o:true,i:["An order has been issued by a superior","The order is for some lawful purpose","The means used by the subordinate to carry it out are lawful"]}
,{id:"r-shavell",t:"readings",n:"Shavell: why fines alone cannot deter crime",o:false,i:["Offenders often lack the wealth to pay","Offenders may escape detection, so the fine would have to be very large","Some crimes bring large private gains that a fine cannot outweigh"]},
{id:"r-prison",t:"readings",n:"Shavell: the two ways imprisonment prevents crime",o:false,i:["Deterrence (the threat discourages the act)","Incapacitation (a person in prison cannot commit crimes outside)"]},
{id:"r-justif",t:"readings",n:"Cavanaugh: justifications of punishment",o:false,i:["Reductivism: punish to reduce future crime","Retributivism: punish because it is deserved, in proportion to the crime","Denunciation: punishment expresses society's condemnation","Restorative justice: repair the harm and reintegrate the offender"]},
{id:"r-reduct",t:"readings",n:"The three mechanisms of reductivism",o:false,i:["Deterrence","Incapacitation","Reform (rehabilitation)"]},
{id:"r-schools",t:"readings",n:"Schools of thought on punishment",o:false,i:["Classical: free will; clear laws; proportionate punishment (basis of the RPC)","Positivist: crime from social or psychological causes; focus on the offender; rehabilitation","Justice model: just deserts with due process; rejects the positivist emphasis on rehabilitation"]},
{id:"r-rjdef",t:"readings",n:"RA 9344 § 4(q): what restorative justice seeks",o:false,i:["Reparation for the victim","Reconciliation of the offender, the offended and the community","Reassurance to the offender that he can be reintegrated into society"]},
{id:"r-rjprin",t:"readings",n:"Restorative justice: principles",o:false,i:["Personal involvement of those mainly concerned","Seeing crime problems in their social context","A forward-looking, preventive, problem-solving orientation","Flexibility and creativity of practice"]},
{id:"r-rjobj",t:"readings",n:"Restorative justice: objectives",o:false,i:["Attend fully to the victim's needs (material, financial, emotional, social)","Prevent re-offending by reintegrating offenders into the community","Enable offenders to take active responsibility for their actions","Recreate a working community that supports rehabilitation and prevents crime","Avoid the escalation of legal justice and its costs and delays"]},
{id:"r-rjprac",t:"readings",n:"Restorative justice: forms of practice",o:false,i:["Victim–offender mediation","Victim–community support","Offender–community programs","Victim, offender and community: family group conferencing"]},
{id:"r-colonial",t:"readings",n:"Rossabi: the layers of Philippine criminal law",o:true,i:["Indigenous law (tolerated, then nullified)","Spanish period, 1521–1898: Laws of the Indies (1680), gobernadorcillo, Penal Code of 1887, Church–State union","American period, 1898–1946: common law; General Order No. 58 (1900); Organic Act of 1902","After independence: American-style procedure kept; 1985 Rules on Criminal Procedure"]}
];

// Reviewer helpers (textbook schema). A chapter = {k,num,n,s,lead,goals,sec:[sections],end:[blocks]}; a section = {id,t,b:[blocks]}.

  S:(id,t,...b)=>({id,t,b}),
  P:x=>({k:"p",x}),            // explanatory prose
  K:(t,x)=>({k:"key",t,x}),    // key idea (green)
  TR:(t,x)=>({k:"trap",t,x}),  // trap / exam warning (amber)
  DS:(t,x)=>({k:"dist",t,x}),  // distinguish (blue)
  EX:(t,x)=>({k:"ex",t,x}),    // Reyes illustration
  C:(id,why)=>({k:"case",id,why}), // inline case card
  V:id=>({k:"viz",id}),        // diagram
  CO:(a,ps)=>({k:"codal",a,ps}),   // codal (ps = paragraph indexes to show; omit = all)
  RQ:(t,items)=>({k:"req",t,items}), // numbered requisite tiles: items = [[name, gloss], …]
  UL:x=>({k:"ul",x}),
  TB:(head,rows)=>({k:"tbl",head,rows}),
  EXAM:x=>({k:"exam",x}),
  DR:x=>({k:"drill",x}),
  G:id=>({k:"gate",id})
};

S("m2","What to bring",

S("m3","Writing in IRAC, the way Sir reads it",
 P("Sir does not need every exception. He wants to see <b>why the element is present</b> (or absent) on these facts, and <b>why the neighboring concept does not fit</b>. Build each answer like this:"),
 TB(["Step","What to write","Example (a mistake-of-fact problem)"],[
  ["<b>I</b>ssue","One sentence: the precise question the facts raise.","Is A criminally liable for killing B, whom he mistook for a robber?"],
  ["<b>R</b>ule","The principle and its elements or requisites, in your own words. Article number and case name are optional.","A felony by dolo needs intent. Mistake of fact removes intent if (1) the act would have been lawful had the facts been as he believed, (2) his intent was lawful, and (3) the mistake was without fault."],
  ["<b>A</b>nalysis","Go element by element: <b>this fact satisfies it, because…</b> Then add the <b>why not</b>: the fact that rules out the nearby alternative.","Requisite 3 is met because the room was dark and he was struck as the door was forced open; he had no time to verify. This is <b>not</b> like a case where the victim was asleep and there was time to check identity, where the mistake would be his fault."],
  ["<b>C</b>onclusion","Answer the question and give the consequence.","A is not criminally liable, and incurs no civil liability either."]]),
 K("★ The “why, and why not” move","For every element you decide, write two sentences: <b>“It is X because [fact].”</b> and <b>“It is not Y because [fact].”</b> Example: “The crime is <b>frustrated</b>, not attempted, because the wound to the liver was mortal and he walked away believing her dead, so the subjective phase was complete. It is <b>not an impossible crime</b>, because the killing was possible; she survived only because of the surgery.”"),
 K("When to say “it depends”","Only when the facts are <b>genuinely</b> ambiguous. Then name the fact it turns on and answer both ways: “If the wound was mortal, frustrated; if not, attempted.” Don't hedge on issues the facts settle."),
 TR("Don't spend time on","Exceptions the facts don't raise; long recitals of article text; case names you're unsure of (the doctrine is enough). Spend the time on the analysis.")),
S("m4","The confusable pairs",
 P("Since Sir asks “why this and not that,” these are the pairs his problems are built around. For each one, learn the <b>one question</b> that separates them."),
 TB(["Looks like…","…but could be","The deciding question"],[
  ["Preparatory act","Attempt (overt act)","Does the act have a <b>direct connection</b> to a <b>specific</b> crime, so that it would logically ripen into it? (Lamahang)"],
  ["Attempted","Frustrated","Did he perform <b>all</b> the acts of execution (subjective phase complete; in homicide, a mortal wound)? (Sy Pio vs. Eduave)"],
  ["Frustrated","Impossible crime","Could the crime have happened? Adequate means that failed → frustrated; inherently impossible or ineffectual means → impossible."],
  ["Attempted","Impossible crime","Did it fail because of an outside cause (an alert clerk) or because it could never succeed (an empty room)? (Balmores vs. Intod)"],
  ["Spontaneous desistance","Stopped by others","Did he stop of his own will, before all the acts of execution? If he was grabbed or interrupted, it is not desistance."],
  ["Mistake of fact","Error in personae","Would the act have been <b>lawful</b> under the facts as he believed (mistake of fact), or a felony against anyone (error in personae)?"],
  ["Error in personae","Aberratio ictus","Did he hit the person he aimed at, who turned out to be someone else (personae), or did the blow land on a different person (ictus)?"],
  ["Dolo","Culpa","Was the harmful act <b>deliberate</b> (dolo; a mistake in identity is still dolo) or careless (culpa)? (Oanis)"],
  ["Proximate cause","Efficient intervening cause","Did a <b>foreign</b> force or the victim's <b>deliberate</b> act break the chain? Illness, complications and medical error don't."],
  ["Praeter intentionem","Intent to kill","Do the means used (weapon, wound, part of the body) show intent to kill? A fist blow → praeter; a knife to the chest → no."],
  ["Conspiracy as a crime","Conspiracy as a mode","Was the crime agreed upon actually committed? No → a crime only if the law punishes it (treason, rebellion, coup d'état, sedition). Yes → the act of one is the act of all."],

  ["Complete justification","Incomplete justification","Is unlawful aggression present, and how many of the other requisites? All → acquittal; the majority → privileged mitigating (Art. 69); fewer → ordinary mitigating."],

  ["Avoidance of greater evil","Self-defense","Is the harm done to an <b>aggressor</b> (self-defense) or to a <b>third person or thing</b> to avoid a different evil (¶4)?"],
  ["Territoriality","Art. 2 exception","Was the crime committed inside the Philippines (including its waters)? If outside, is it one of the five cases?"],
  ["Light felony attempted","Not punishable","Is it against persons or property? Only then is an attempted or frustrated light felony punished (Art. 7)."]])),

CH("intro","1","Introduction & Art. 1","Criminal law, its theories and limits",
"Before the articles: what criminal law is, the two theories the Code is built on, the three characteristics of penal laws (<b>generality, territoriality, prospectivity</b>), and the limits the Constitution puts on Congress. These ideas come back as reasons in later chapters.",
["Define criminal law and give the two theories","State and apply generality, territoriality and prospectivity, with their exceptions","List the constitutional limits on penal laws","Know where the readings fit: see Chapter 2"],
[
S("i1","What criminal law is",
 P("<b>Criminal law</b> is the branch of public law that <mark>defines crimes, treats of their nature, and provides for their punishment</mark>. The State alone may define and punish crimes; this power flows from its police power. There are <b>no common-law crimes</b> in the Philippines: an act is a crime only if a statute says so (<i>nullum crimen, nulla poena sine lege</i>)."),
 P("The Revised Penal Code has <b>two books</b>. <b>Book One</b> (Arts. 1–113) contains the general provisions: when the Code applies, what a felony is, the stages of execution, the circumstances that affect liability, the persons liable, and the penalties. <b>Book Two</b> defines the specific crimes. Your midterm covers the start of Book One.")),
S("i2","Art. 1 · When the Code took effect",
 CO("1"),
 P("The RPC took effect on <b>1 January 1932</b>. It replaced the Spanish Penal Code of 1870 (in force here from 1887), which is why many of its terms are Spanish and why Spanish decisions are still cited.")),
S("i3","The two theories: classical and positivist",
 P("Reyes says the Code is built <mark>mainly on the classical school</mark>, with some positivist features added. The difference is what each theory looks at."),
 V("theories"),
 P("<b>Classical</b>: man has free will and chooses between good and evil, so the basis of liability is that free choice, and the penalty is <b>retribution</b> in proportion to the act. Hence fixed penalties and a mechanical link between crime and penalty, with little regard for the person. <b>Positivist</b>: man is sometimes driven by forces he cannot control, so crime is a social and natural phenomenon. The response should be individualized and preventive, decided after study of the offender."),
 K("Where the positivist features show up","Art. 4(2) punishes an <b>impossible crime</b>, where no felony was produced, because the offender showed a criminal <b>tendency</b>. Juvenile justice and the Indeterminate Sentence Law are also positivist. If a question asks “what theory explains Art. 4(2)?”, the answer is positivist.")),
S("i4","Generality",
 P("Penal laws <mark>bind all persons who live or sojourn in the Philippines</mark>, citizens or foreigners (Civ. Code Art. 14). Being a foreigner is no defense. In <i>Van Wilsem</i>, a Dutch national living in Cebu could be prosecuted here under RA 9262 for refusing to support his son."),
 RQ("Exceptions to generality",[["Treaties and treaty stipulations","e.g., the Visiting Forces Agreement on jurisdiction over US personnel"],["Laws of preferential application","e.g., RA 75, which penalizes acts against foreign diplomatic representatives and their staff"],["Principles of public international law","Sovereigns and heads of state, ambassadors, ministers plenipotentiary, ministers resident and chargés d'affaires are immune"]]),
 TR("Consuls are not immune","Consuls, vice-consuls and commercial representatives are <b>not</b> diplomatic agents, so they are subject to our criminal laws (San Beda MCQ 1: a commercial attaché is not exempt)."),
 C("vanwilsem","Generality and territoriality applied to a foreigner who lives here.")),
S("i5","Territoriality and prospectivity",
 P("<b>Territoriality</b>: penal laws apply only within Philippine territory. The exceptions are the five cases in Art. 2 (Chapter 3). <b>Prospectivity</b>: a penal law looks forward. It cannot punish an act that was innocent when done or make the penalty heavier after the fact."),
 K("Art. 22: the exception to prospectivity","A penal law is retroactive when it is <b>favorable to the accused</b>, unless he is a <b>habitual criminal</b> (Art. 62). The favorable law applies even if he is already serving sentence.")),
S("i6","Constitutional limits on penal laws",
 P("Congress may define crimes, but the Bill of Rights limits how:"),
 UL(["<b>No ex post facto law</b> (Art. III § 22): no law that makes criminal an act innocent when done, aggravates a crime, increases its penalty, or changes the rules of evidence to the accused's disadvantage, applied to past acts.","<b>No bill of attainder</b>: a legislative act that inflicts punishment without a judicial trial.","<b>Due process and equal protection</b> (§ 1): the law must be general, and it must be clear enough to tell people what is forbidden (void-for-vagueness).","<b>No cruel, degrading or inhuman punishment and no excessive fines</b> (§ 19)."]),
 K("Pro reo","When a penal law is doubtful, it is construed <b>strictly against the State and liberally in favor of the accused</b> (<i>in dubio pro reo</i>). This follows from the presumption of innocence and is a 2010 and 2012 bar favorite."))
],[
 EXAM("“The RPC is based mainly on the classical theory: the basis of liability is free will, and the penalty is retribution proportionate to the act. It has positivist features, such as Art. 4(2), which punishes an impossible crime because of the offender's criminal tendency even though no felony is produced.”"),
 DR([["A law passed today raises the penalty for an act done last year. Does it apply to that act?","No. It is an ex post facto law."],["A new law lowers the penalty, and the accused is a habitual criminal. Does he benefit?","No. Art. 22 excludes habitual criminals from retroactive favorable laws."],["A foreign consul stabs someone in Makati. Is he immune?","No. Consuls are not covered by the public-international-law exception."]])
]);

// ═══════════════════════ 2 · INTRODUCTORY READINGS ═══════════════════════
CH("readings","2","The introductory readings","Shavell · Cavanaugh · Restorative justice · Rossabi",
"Sir said the introductory readings are <b>part of the exam</b>. They answer the questions behind every article: <b>why</b> the State punishes, <b>what</b> punishment is for, and <b>where</b> our criminal law came from. Expect them in the objective or enumeration question, or as a “what theory explains this rule?” part of a problem.",
["Explain Shavell's economic case for criminal law and imprisonment","Give and evaluate the justifications of punishment in Cavanaugh","Define restorative justice and give its principles, objectives and practices","Trace the colonial roots of Philippine criminal procedure (Rossabi)","Connect each theory to a provision of the RPC"],
[
S("r0","How to use this chapter",
 P("The four readings were assigned before Art. 1 in the syllabus. On an exam they work in two ways: as <b>objective questions</b> (“enumerate the justifications of punishment”) and as the <b>reason</b> behind a rule in a problem (“why does the Code punish an impossible crime when no harm was done?”)."),
 TR("Source note","The reading texts themselves are not in your uploads. This chapter is built from your block's Midterms Reviewer summaries, RA 9344, and standard accounts of these theories. If you have time, skim each original's headings before Saturday.")),
S("r1","Shavell, “Criminal Law” (economic analysis)",
 P("Shavell asks an economist's question: <b>if the law already lets victims sue for damages and lets the State impose fines, why do we need criminal law and prison at all?</b> His answer is that money sanctions alone cannot deter certain harmful acts."),
 RQ("Why fines alone fail to deter",[["Offenders often lack wealth","A fine larger than what a person owns cannot be collected, so it cannot deter him."],["Offenders may escape detection","If the chance of being caught is low, the sanction must be very large to keep the expected penalty high. Such large fines exceed what offenders can pay."],["Some crimes bring large private gains","When the gain is high, the fine needed to outweigh it would be enormous."]]),
 P("So the law turns to <b>non-monetary sanctions</b>, chiefly imprisonment, which works in two ways: it <b>deters</b> (the threat discourages the act), and it <b>incapacitates</b> (a person in prison cannot commit more crimes outside). Imprisonment is costly to society, so it is reserved for the most harmful acts, typically intentional violent crimes such as murder and rape."),
 P("<b>What criminal acts look like.</b> They usually involve <b>deliberate</b> harm. They remain criminal even when the intended harm does not happen, which is the logic of punishing attempts. Accidental harm is generally <b>not</b> criminal unless it involves negligence or an attempt to conceal it. Criminal law also targets conduct that tries to <b>evade responsibility</b>, such as concealment."),
 K("Link to the RPC","Shavell's logic explains why the RPC punishes <b>attempts and frustrations</b> (Art. 6) even without harm, why <b>intent</b> generally separates crimes from mere civil wrongs (Art. 3), and why <b>culpa</b> is punished more lightly (Art. 365).")),
S("r2","Cavanaugh, “The Justification of Punishment”",
 P("Punishment deliberately inflicts suffering, so it needs a justification. Cavanaugh surveys the main answers:"),
 V("punish"),
 RQ("Justifications of punishment",[["Reductivism","Punishment is justified by its future effects: it <b>reduces crime</b>. Its three mechanisms are <b>deterrence</b> (discouraging the offender and others), <b>incapacitation</b> (physically preventing further crimes), and <b>reform</b> (rehabilitating the offender)."],["Retributivism","Punishment is justified because the offender <b>deserves</b> it for what he has already done. The penalty must be <b>proportionate</b> to the gravity of the crime."],["Denunciation","Punishment expresses <b>society's condemnation</b> of the act and reaffirms its values."],["Restorative justice","The focus moves from punishing the offender to <b>repairing the harm</b> and reintegrating him (see the next section)."]]),
 P("<b>The weaknesses each answer must face.</b> Reductivism looks only forward, so in theory it could justify punishing the innocent or punishing excessively if that deterred others. Retributivism insists on desert and proportion, but critics call it institutionalized vengeance that produces no social good. Reform depends on treatment that may not work and on sentences tied to the person, not the act. Most systems, including ours, <b>mix</b> them."),
 TB(["School","Core claim","Echo in our law"],[["<b>Classical</b>","Free will; clear laws; punishment proportionate to the act","The RPC's fixed penalties and the basis of liability (Ch. 1)"],["<b>Positivist</b>","Crime comes from social or psychological causes; focus on the offender and rehabilitation","Art. 4(2) impossible crimes; juvenile justice; the Indeterminate Sentence Law"],["<b>Justice model</b>","“Just deserts”: punishment proportionate to the crime, with due process; rejects the positivist emphasis on rehabilitation","Proportionality behind Art. 5 ¶2 (clearly excessive penalties)"]]),
 K("A likely exam angle","“Which theory justifies punishing an impossible crime?” Positivist and reductivist (incapacitation and deterrence of a dangerous person), because no harm was done that would deserve retribution. “Which theory underlies Art. 5 ¶2?” Retributive proportionality (the penalty should fit the malice and the injury).")),
S("r3","Restorative justice (Gilman; Marshall)",
 P("Retributive justice asks: <b>what law was broken, who did it, and what does he deserve?</b> Restorative justice asks: <b>who was hurt, what do they need, and whose obligation is it to repair the harm?</b> Crime is seen first as harm to people and relationships, not just a violation of the State's law."),
 K("Definitions","<b>Marshall</b> (the overview your block summarized): a process in which all the parties with a stake in a specific offense come together to resolve <b>collectively</b> how to deal with its aftermath and its implications for the future. <b>RA 9344, § 4(q)</b>: a principle that requires a process of resolving conflicts with the <b>maximum involvement of the victim, the offender and the community</b>. It seeks <b>reparation</b> for the victim, <b>reconciliation</b> of the offender, the offended and the community, and <b>reassurance</b> to the offender that he can be reintegrated into society."),
 RQ("Principles",[["Personal involvement of those mainly concerned","The victim, the offender and the community, not just the State."],["Seeing crime problems in their social context",""],["A forward-looking, preventive, problem-solving orientation",""],["Flexibility and creativity of practice",""]]),
 RQ("Objectives",[["Attend fully to the victim's needs","Material, financial, emotional and social."],["Prevent re-offending by reintegrating offenders into the community",""],["Enable offenders to take active responsibility for their actions",""],["Recreate a working community that supports the rehabilitation of offenders and victims and helps prevent crime",""],["Avoid the escalation of legal justice and its costs and delays",""]]),
 TB(["Practice","Who takes part","Example"],[["Victim–offender mediation","Victim and offender","Direct or indirect dialogue; apology, explanation, reparation"],["Victim–community","Victim and support groups","Practical and emotional support for victims"],["Offender–community","Offender and community programs","Job search, retraining, counseling, housing; school programs on bullying and truancy"],["Victim, offender and community","Families and community contacts","Family group conferencing"]]),
 P("<b>Philippine examples</b>: diversion and intervention for children in conflict with the law under RA 9344; barangay conciliation (Katarungang Pambarangay); probation."),
 DS("Restorative vs. retributive","Retributive justice centers on the State and the offender's desert; restorative justice centers on the victim and the community and on repairing harm. The RPC is mainly retributive (classical), with restorative elements in civil liability (Arts. 100–113) and in special laws.")),
S("r4","Rossabi, “The Colonial Roots of Criminal Procedure in the Philippines”",
 P("Rossabi's point is that Philippine criminal law and procedure are a <b>synthesis</b> of indigenous, Spanish (civil-law) and American (common-law) sources, imposed in layers by colonizers. The tensions in our system make more sense once you see the layers."),
 V("colonial"),
 UL(["<b>Spanish period (1521–1898).</b> Built on the union of Church and State. Indigenous (“pagan”) customs were tolerated if they did not conflict with Spanish ways, then gradually nullified. The <b>Laws of the Indies</b> (Recopilación, 1680); a local court system in which the <b>gobernadorcillo</b>, a Filipino, settled minor conflicts; the <b>Penal Code of 1887</b>, a list of crimes and penalties that gave the accused few rights; trials before Spanish judges under the Governor-General. The <b>ilustrados</b> pressed for individual rights and the separation of Church and State; Spain responded by creating justices of the peace (<i>juez de paz</i>).","<b>American period (1898–1946).</b> A “trusteeship”; a shift toward the <b>common law</b>, built on precedent. The Schurman Commission; the separation of Church and State; <b>General Order No. 58</b> (1900), which remade criminal procedure (complaints, jurisdiction, preliminary examination, rights of the accused); the <b>Philippine Organic Act of 1902</b> (civil rule). Filipino justices were appointed, but Americans held the key posts.","<b>After independence.</b> The American-style procedure largely stayed, revised over time; the 1985 Rules on Criminal Procedure strengthened the rights of the accused within the same structure. The substantive law, the RPC (1932), remains Spanish-rooted."]),
 K("Why it matters for this course","It explains why we read <b>Spanish</b> doctrine (Viada, decisions of the Supreme Court of Spain) for the RPC's substantive rules, and <b>American</b> doctrine for procedure and constitutional rights. It is also why early cases such as <i>Bull</i> and <i>Ah Chong</i> are decisions of an American-era Supreme Court applying Spanish-based penal law.")),
S("r5","Putting the readings together",
 TB(["Question","Shavell","Cavanaugh","Restorative justice","Rossabi"],[["Why punish?","To deter acts that money sanctions cannot","Reduction, desert, or denunciation","To repair harm and restore relationships","(Historical) the colonizers' models of order"],["Key mechanism","Deterrence and incapacitation; imprisonment","Proportionate penalty (retributive) or reform (positivist)","Mediation, conferencing, reintegration","Spanish code + American procedure"],["RPC link","Arts. 3, 6 (intent, attempts)","Classical basis; Art. 4(2) positivist; Art. 5 proportionality","Civil liability; RA 9344 diversion","The RPC (1932) replacing the 1887 Code"]]))
],[
 EXAM("“The RPC rests mainly on the classical theory, which justifies punishment retributively by the offender's free choice and the gravity of his act. Some provisions, such as Art. 4(2) on impossible crimes, are justified instead on reductivist and positivist grounds: the offender is punished for the danger he poses, though no harm resulted.”"),
 DR([["Enumerate three reasons why fines alone cannot deter crime (Shavell).","Limited wealth of offenders; a low probability of detection; large private gains from the crime."],["Give the three mechanisms of reductivism.","Deterrence, incapacitation, reform."],["Define restorative justice under RA 9344.","A principle that resolves conflicts with the maximum involvement of the victim, the offender and the community, seeking reparation, reconciliation and reassurance of reintegration."],["What was General Order No. 58?","The 1900 American military order that remade Philippine criminal procedure (complaints, jurisdiction, preliminary examination, rights of the accused)."]])
]);

// ═══════════════════════ 2 · ART. 2 ═══════════════════════
CH("a2","3","Art. 2 · Where the Code applies","Territoriality and its five exceptions",
"Art. 2 answers one question: <b>can a Philippine court try this crime?</b> Inside the territory, yes (with the usual exceptions to generality). Outside it, <b>only in the five cases listed</b>. Foreign merchant ships in our waters have their own rule, taught through four opium-and-cattle cases.",
["Draw what “Philippine territory” covers","Apply the English rule to foreign merchant vessels (Bull, Wong Cheng, Look Chaw, Ah Sing)","Recite and apply the five extraterritorial cases, including piracy (Lol-lo)"],
[
S("a2-1","The provision",CO("2"),
 P("Read it in two halves. The first clause states <b>territoriality</b>: the Code is enforced <i>within</i> the archipelago, including its atmosphere, interior waters and maritime zone. The second clause lists the <b>exceptions</b>: five situations where the Code follows the offender <i>outside</i> our jurisdiction. Both are subject to treaties and laws of preferential application.")),
S("a2-2","What counts as Philippine territory",
 V("territory"),
 P("The <b>archipelago</b> includes the islands, the <b>atmosphere</b> above them, the <b>interior waters</b> (bays, rivers, lakes, straits, gulfs) and the <b>maritime zone</b>. Under the 1987 Constitution and UNCLOS, sovereignty extends to the <b>territorial sea, 12 nautical miles</b> from the baselines. The contiguous zone (24 nm) and the EEZ (200 nm) give only limited rights."),
 K("Why it matters","A crime anywhere in this space is triable here <b>regardless of the nationality</b> of the offender or the victim (territoriality plus generality). The 2019 bar problem: a Malaysian kills an Australian aboard an Indonesian ship docked in Manila → triable here.")),
S("a2-3","Foreign merchant vessels in our waters",
 P("When a foreign <b>merchant</b> ship is in our waters, whose courts try a crime aboard it? There are two rules:"),
 DS("French rule vs. English rule","<b>French rule</b>: crimes aboard are <i>not</i> triable by the coastal state unless they affect its peace and security. <b>English rule</b>: they <i>are</i> triable by the coastal state unless they merely affect things within the vessel or its internal management. <mark>We follow the English rule</mark> (<i>Wong Cheng</i>)."),
 V("vessels"),
 P("The opium cases show where the line falls. <b>Mere possession</b> aboard a ship <b>in transit</b> causes no harm here, so it is not triable. <b>Using</b> the drug in our waters, <b>landing</b> it, or bringing it to a ship's <b>port of destination</b> brings the harm into our territory, so it is triable."),
 C("bull","A continuing offense that continues inside our waters is triable here, even if it began on the high seas."),
 C("wongcheng","The English rule: smoking opium while anchored in Manila Bay is a breach of public order."),
 C("lookchaw","In transit: possession alone is not triable here, but landing or selling the opium is."),
 C("ahsing","Terminal port: once the ship arrives at its destination with the drug aboard, importation is consummated."),
 TR("Warships are different","A foreign <b>warship</b> (or other public vessel) is treated as the territory of its flag state. Crimes aboard it are <b>never</b> triable here, wherever it is anchored.")),
S("a2-4","The five extraterritorial cases",
 P("Outside Philippine jurisdiction, the Code applies only to those who:"),
 RQ("Art. 2, items 1–5",[["Commit an offense while on a Philippine ship or airship","The vessel must be <b>registered</b> here. The owner's nationality is irrelevant. This applies when the ship is on the high seas; in a foreign country's waters, that country's law generally governs."],["Forge or counterfeit Philippine coins, currency notes, or government obligations and securities","This protects the nation's credit, wherever the forgery happens."],["Introduce those forged obligations and securities into the Philippines","Even if someone else did the forging abroad."],["As public officers or employees, commit an offense in the exercise of their functions","e.g., a consul who falsifies a document or takes a bribe in the course of his duties. An offense <b>unrelated to the functions</b> (e.g., bigamy by an embassy employee) is <b>not</b> covered."],["Commit crimes against national security and the law of nations (Title One, Book Two)","Treason, conspiracy and proposal to commit treason, espionage, inciting to war, violation of neutrality, correspondence with hostile country, flight to an enemy country, piracy and mutiny. <b>Rebellion and coup d'état are not here</b>: they are in Title Three (public order)."]]),
 C("lollo","Item 5 in action: pirates are enemies of all mankind, so they are triable wherever caught."),
 TR("Three classic bar traps","(1) A ship <b>owned</b> by a Filipino but <b>registered in Panama</b> is not a Philippine ship (2000 Bar). (2) <b>Bigamy</b> contracted abroad is not in Art. 2, so it is not triable here (1994 Bar). (3) <b>Rebellion</b> abroad is not covered by item 5 (2011 Bar MCQ)."),
 P("Special laws may give themselves extraterritorial reach. Reyes notes that the anti-terrorism law (then RA 9372, now RA 11479) applies to certain acts committed abroad."))
],[
 EXAM("“Under the territoriality principle, the RPC is enforced within the Philippine archipelago, including its interior waters (Art. 2). We follow the English rule: a crime aboard a foreign merchant vessel in our waters is triable here unless it concerns only the ship's internal management (People v. Wong Cheng). Outside our territory, the Code applies only in the five cases enumerated in Art. 2.”"),
 DR([["Bull, but the cattle were unloaded in Formosa before the ship entered our waters.","Not triable here: the offense no longer continued in our waters."],["Look Chaw, but he only kept the opium in his cabin and never landed or sold it.","Not triable: mere possession in transit."],["Wong Cheng, but the ship was a foreign warship.","Not triable: a warship is the territory of its flag state."],["A Filipino consul in Hong Kong falsifies a passport in the course of his functions.","Triable here: Art. 2(4)."],["A Filipino commits bigamy in Singapore and then lives here.","Not triable: not one of Art. 2's five cases."]])
]);

// ═══════════════════════ 3 · ART. 3 ═══════════════════════
CH("a3","4","Art. 3 · Felonies","Act, punishability, dolo and culpa; mistake of fact",
"Art. 3 defines the building block of the whole Code: the <b>felony</b>. Every later article assumes you can say whether there is a felony at all, whether it was committed with <b>dolo</b> (intent) or <b>culpa</b> (fault), and whether a <b>mistake of fact</b> wiped out the intent. Ah Chong, the case Sir loves, lives here.",
["Give the three elements of a felony and explain each","State the requisites of dolo and of culpa, and what negates each","Apply the three requisites of mistake of fact (Ah Chong vs. Oanis)","Distinguish intent from motive, and mala in se from mala prohibita"],
[
S("a3-1","The provision and the formula",CO("3"),
 P("Art. 3 gives a definition and a formula. Felonies are acts or omissions <b>punishable by law</b> (Reyes: by the RPC; offenses under special laws are “offenses,” not felonies). They are committed in one of two ways: by <b>deceit (dolo)</b>, meaning with deliberate intent, or by <b>fault (culpa)</b>, meaning through imprudence, negligence, lack of foresight or lack of skill."),
 V("felony"),
 RQ("Elements of felonies (Reyes)",[["There must be an act or omission","An external, physical act (or a failure to act where the law requires action). Thoughts alone are never punished."],["The act or omission must be punishable by the RPC","No law, no felony: nullum crimen sine lege."],["It must be done by means of dolo or culpa","It must be voluntary, done with freedom and intelligence, and either with intent or with fault."]])),
S("a3-2","Element 1 · An act or omission",
 P("An <b>act</b> is any bodily movement that tends to produce some effect in the external world. Reyes stresses that <mark>only the external act is punished</mark>; criminal thoughts, however evil, are not. An <b>omission</b> is the failure to perform a positive duty that the <b>law</b> requires, e.g., failing to help a person in danger (Art. 275), failing to render accounts (Art. 218), or failing to report a conspiracy to commit treason (Art. 116)."),
 K("Omission needs a legal duty","No legal duty to act, no felony by omission. A moral duty alone is not enough.")),
S("a3-3","Element 2 · Punishable by law",
 P("The act must be <b>punishable</b>. This is where Art. 5 comes in: if the court thinks an act deserves punishment but no law punishes it, the court must <b>acquit</b> (Chapter 7). An act covered by a <b>justifying circumstance</b> (Art. 11) is also not a felony, because the law makes it lawful.")),
S("a3-4","Element 3 · Dolo: freedom, intelligence, intent",
 P("A felony by dolo must be <b>voluntary</b>, and voluntariness has three parts. Learn what <mark>takes each part away</mark>, because those are the defenses later in the Code:"),
 TB(["Requisite","Meaning","What negates it"],[
  ["<b>Freedom</b>","The act is done by free choice","Irresistible force; uncontrollable fear (Art. 12(5), (6))"],
  ["<b>Intelligence</b>","The capacity to know right from wrong and the consequences of the act","Insanity, imbecility, minority (Art. 12(1)–(3))"],
  ["<b>Intent</b>","The purpose to use a particular means to achieve a particular result","<b>Mistake of fact</b>; accident (Art. 12(4))"]]),
 P("Intent is a state of mind, so it is proven by <b>overt acts</b>: the weapon, the wounds, the words used. The law <b>presumes</b> criminal intent from the commission of an unlawful act, but the presumption is <b>rebuttable</b> (that is what Ah Chong did)."),
 DS("General intent vs. specific intent","<b>General</b> criminal intent is presumed once the unlawful act is proven. <b>Specific</b> intent is an element of particular felonies and <b>must be proven</b>: intent to <b>gain</b> in theft and robbery (Magsumbol), intent to <b>kill</b> in attempted or frustrated homicide (Ravelo), lewd designs in forcible abduction. If the specific intent is not proven, that felony is not committed.")),
S("a3-5","Culpa: freedom, intelligence, fault",
 P("In felonies by culpa the act is still voluntary (freedom and intelligence are there), but <b>intent is replaced by imprudence or negligence</b>. The mind is not criminal; the act is wrongful because the injury came from a lack of care that the law demands."),
 DS("Imprudence vs. negligence","<b>Imprudence</b> is a deficiency of <b>action</b>: failing to take the precautions needed to avoid injury (lack of skill). <b>Negligence</b> is a deficiency of <b>perception</b>: failing to pay attention and to foresee the injury (lack of foresight). Reckless imprudence is punished under Art. 365."),
 TR("Dolo and culpa cannot coexist","A deliberate intent to do an unlawful act is essentially inconsistent with reckless imprudence (<i>Guillen</i>). So a deliberate shooting that hits the wrong person is <b>not</b> “homicide through reckless imprudence” (Oanis), and a grenade thrown at the President that kills bystanders is murder (Guillen)."),
 EX("No dolo, no culpa, no crime","Ramos, Abandia and Catangay were hunting deer at night. Catangay, his gun cocked at a deer, stumbled on an embankment; the gun went off and killed Ramos. Not liable: he had no intent and was not negligent, so this is an <b>accident</b> (Art. 12(4)). But the act must be <b>lawful</b>: firing a gun in a public place (Art. 155) is not, so injury from it would be punished.")),
S("a3-6","Mistake of fact (ignorantia facti excusat)",
 P("Ignorance of the <b>law</b> excuses no one (Civ. Code Art. 3), but an honest mistake about the <b>facts</b> can remove intent, the third requisite of dolo. Reyes gives three requisites:"),
 RQ("Mistake of fact (Reyes)",[["The act would have been lawful had the facts been as the accused believed them to be","Imagine the facts as he saw them: would his act be justified (e.g., self-defense) or innocent?"],["The intention of the accused in performing the act is lawful","He meant to defend himself, not to hurt an innocent person."],["The mistake is without fault or carelessness on his part","He had <b>no time or means to verify</b>. A negligent mistake does not excuse; at most it turns the crime into one by culpa."]]),
 V("ahchongoanis"),
 C("ahchong","The model case: all three requisites are met. Read the facts twice; Sir asks about them."),
 C("oanis","The counter-model: the third requisite fails, because there was time to verify."),
 C("gervero","The first requisite fails: even under the facts as believed, the killing would not have been lawful."),
 C("magsumbol","Mistake of fact negates the specific intent to gain in theft."),
 DS("Mistake of fact vs. error in personae","In <b>mistake of fact</b>, the act would have been <b>lawful</b> under the facts as believed, so there is no liability. In <b>error in personae</b> (Art. 4(1)), the act is a felony <b>whoever</b> the victim is (you meant to kill B and killed C), so you are liable.")),
S("a3-7","Crimes under special laws: intent to perpetrate the act",
 P("Reyes describes three classes of crimes: intentional felonies, culpable felonies, and crimes under <b>special laws</b>. In the third, <mark>criminal intent is not required</mark>; it is enough that the offender <b>intended to perpetrate the prohibited act</b>, i.e., did it freely and consciously."),
 EX("People v. Bayona","He carried his revolver inside the fence of a polling place on election day. Convicted, even though he did not mean to intimidate anyone: carrying the gun there was the prohibited act, and he did it consciously. But a man who merely passes on the road with a gun, or a resident cleaning his gun at home within 50 meters, has <b>no intent to perpetrate the act</b> prohibited, so he is not liable."),
 TB(["","Mala in se","Mala prohibita"],[["Nature","Wrong in itself, inherently immoral","Wrong only because the law prohibits it"],["Usually found in","The RPC","Special laws"],["Good faith / lack of intent","A defense","Not a defense (only the intent to do the act matters)"],["Stages, degree of participation, modifying circumstances","Taken into account","Generally not (unless the law adopts RPC penalties)"]]),
 TR("Labels don't decide it","Some crimes under special laws are mala in se (e.g., plunder, per <i>Estrada v. Sandiganbayan</i>). Ask whether the act is inherently wrong, not where it is punished.")),
S("a3-8","Intent vs. motive",
 DS("Intent vs. motive","<b>Intent</b> is the purpose to use a particular means to achieve a result (intent to kill). <b>Motive</b> is the moving power that impels the act (revenge, jealousy, money). Intent is an element of dolo; <mark>motive is not an element of any crime</mark>."),
 P("Motive is therefore generally <b>immaterial</b>, but it becomes relevant when (1) the <b>identity</b> of the offender is in doubt, (2) the evidence is <b>purely circumstantial</b>, or (3) the act could constitute different crimes and motive shows which one. It need not be proven when the accused is positively identified. Motive is proven by testimony or by the acts of the accused, and <b>motive alone never supports a conviction</b>."))
],[
 G("g-mof"),
 EXAM("“There is no felony by dolo without intent. Under the doctrine of mistake of fact, the accused is not liable if (1) the act would have been lawful had the facts been as he believed, (2) his intention was lawful, and (3) the mistake was without fault or carelessness (U.S. v. Ah Chong). If he had time and opportunity to ascertain the facts and did not, the mistake does not excuse him (People v. Oanis).”"),
 DR([["Ah Chong, but the lights were on and Pascual called out his own name.","No mistake of fact: there was no reasonable basis for the belief, so homicide."],["Oanis, but the man in bed suddenly reached for a gun under his pillow.","There is now a reason to act at once, so mistake of fact or fulfillment of duty becomes arguable."],["Magsumbol, but the boundary was clearly fenced and marked.","Good faith is implausible; intent to gain may be inferred, so theft."],["A person cleans his gun at home within 50 m of a polling place on election day.","No intent to perpetrate the prohibited act (Bayona), so not liable."]])
]);
})();

(()=>{const {CH,S,P,K,TR,DS,EX,C,V,CO,RQ,UL,TB,EXAM,DR,G}=window.RH;

// ═══════════════════════ 4 · ART. 4(1) ═══════════════════════
CH("a4a","5","Art. 4(1) · A wrong different from that intended","Proximate cause, error in personae, aberratio ictus, praeter intentionem",
"Once a person commits a felony, he is liable for <b>everything that naturally and logically flows from it</b>, intended or not. This chapter is about the <b>chain of causation</b>: when it holds, and the few things that break it. It is the most common “combination” issue on crim exams.",
["State the rationale and the two requisites of Art. 4(1)","Define proximate cause and list what is and is not an efficient intervening cause","Apply the chain to Brobst, Iligan, Mananquil and Garcia","Distinguish error in personae, aberratio ictus and praeter intentionem, and their effects"],
[
S("a4a-1","The provision and its reason",CO("4",[0,1]),
 P("Paragraph 1 rests on an old maxim: <mark><i>el que es causa de la causa es causa del mal causado</i></mark>, “he who is the cause of the cause is the cause of the evil caused.” A person who commits a felony is responsible for <b>all its consequences</b> that may naturally and logically follow, <b>whether foreseen or intended or not</b>. Ordinarily, a person who acts with malice intends the consequences; Art. 4(1) covers the cases where the result goes beyond the intent."),
 RQ("Requisites of Art. 4(1)",[["An intentional felony has been committed","The starting act must itself be a felony by dolo."],["The wrong done is the direct, natural and logical consequence of that felony","There must be an unbroken causal chain between the felony and the result: proximate cause."]])),
S("a4a-2","Requisite 1 · An intentional felony was committed",
 P("Everything hinges on the starting act being a <b>felony</b>. No felony is committed when (1) the act is <b>not punishable</b> by the RPC, or (2) the act is <b>justified</b> under Art. 11. In either case, Art. 4(1) does not apply, and the actor is not liable for an unintended result."),
 EX("Reyes's examples of “no felony, no Art. 4(1)”","<b>Attempted suicide</b> is not punishable, so A, who jumps from a window to kill himself and lands on an old woman, killing her, is not liable for intentional homicide. <b>Self-defense</b>: B, shot at by C, fires back, misses C and kills bystander D. B is not liable, because he was not committing a felony. <b>Duty</b>: a policeman fires at an escaping armed prisoner; the bullet passes through and injures a passer-by. He is not liable (as long as he used due care; otherwise culpa)."),
 EX("People v. Salinas","Crisanto held Severino to stop him from going down to fight Crisanto's father. When Mercuria tried to free Severino, Crisanto pulled her hand; she fell on her one-month-old baby, who died. Not liable for the death: holding Severino back to prevent a fight was not a felony, so the death was not the result of a felony."),
 TR("Culpa goes to Art. 365","If the starting act was <b>negligent</b>, not intentional, the unintended result is handled under Art. 365 (reckless imprudence resulting in…), not Art. 4(1). Art. 4(1) speaks of a felony “different from that which he <b>intended</b>,” so it presupposes dolo (San Beda Q4: the pharmacist).")),
S("a4a-3","Requisite 2 · Direct, natural and logical consequence",
 P("<b>“Natural”</b> means it happens in the ordinary course of human life; <b>“logical”</b> means there is a rational connection between the act and the result. The felony need not be the <b>immediate</b> cause of the result. It is enough that it <b>set in motion</b> the events that produced it."),
 V("chain"),
 K("★ Immediate sense of danger","If a person, by a felony, creates in another's mind an <b>immediate sense of danger</b> that makes the victim do something that injures him, the offender is liable for the injury. A woman who jumped from a jeepney when robbers said “or else there will be shots” and died: the robbers were liable (<i>Toling</i>; <i>Page</i>). A victim chased with a knife who jumps into a river and drowns: homicide (<i>U.S. v. Valdez</i>)."),
 P("Reyes lists situations where the offender <b>remains liable</b> even though something else contributed:"),
 UL(["The victim <b>jumped into the water</b> to escape and drowned because of the current or because he could not swim.","The victim, in pain, <b>pulled out the drainage tube</b> from his wound and died of peritonitis (<i>Quianzon</i>). The act came from the pain the wound caused, not from free choice.","Other causes, even <b>unskillful medical treatment</b>, cooperated, as long as the wound was dangerous to life.","The victim had an <b>internal malady</b> (tuberculosis, heart disease) that the blow aggravated or accelerated.","The victim <b>refused a surgical operation</b>; he is not obliged to undergo one to relieve the offender (<i>Marasigan</i>).","The wound became <b>infected</b> (tetanus, gangrene), or the victim's drinking slowed healing, or a complication followed a necessary operation (<i>Reloj</i>: paralytic ileus)."]),
 C("brobst","No autopsy, but a healthy man who dies right after the blow: the blow is the cause."),
 C("iligan","The felony need not be the immediate cause: the hacking set off the chain that ended with a vehicle."),
 C("mananquil","Complications in the hospital (pneumonia) are still consequences of the burns."),
 C("garcia","A pre-existing heart condition does not break the chain; take the victim as you find him.")),
S("a4a-4","Proximate cause, and what breaks the chain",
 K("★ Proximate cause (definition)","“That cause which, in natural and continuous sequence, <b>unbroken by any efficient intervening cause</b>, produces the injury, and <b>without which the result would not have occurred</b>.” It may act immediately, or by setting other events in motion, each closely connected to the one before."),
 P("Pre-existing conditions (the victim's disease or constitution), concurrent conditions (doctors' negligence), and supervening conditions (tetanus, pneumonia, gangrene) do <b>not</b> change the cause-and-effect relationship."),
 RQ("The felony is NOT the proximate cause when",[["An active force intervened that is a distinct act or fact absolutely foreign to the felonious act","e.g., the victim, recovering normally, is struck by lightning or killed in an unrelated accident."],["The resulting injury is due to the intentional act of the victim","e.g., he deliberately reopens the wound to blame the accused."]]),
 EX("How to determine proximate cause: the bus case (Bataclan)","At about 2:00 a.m., a speeding bus blew a tire and overturned; gasoline leaked. Rescuers came with a lighted torch, and the bus caught fire, burning the trapped passengers. The proximate cause was the <b>overturning</b>, not the torch: in the dark, rescuers coming with a torch in answer to calls for help was natural and expected. A truly <b>extraordinary</b> event, such as lightning or bandits setting the bus on fire, would have been an efficient intervening cause."),
 RQ("Death is presumed the natural consequence of physical injuries when",[["The victim was in normal health when injured","Brobst: Saldivar had been working and was apparently healthy."],["Death may be expected from the injuries inflicted","The injury is of a kind that can kill."],["Death followed within a reasonable time","Days, not months."]]),
 EX("Efficient intervening cause: two examples","<i>Tammang</i>: a teacher spanked a boy and threw him against a post; the boy, previously healthy, vomited blood and died 3 days later. Homicide. But had the defense proven that the boy died of <b>hydrophobia</b> (rabies), that would have been an intervening cause and an acquittal. <i>Urbano v. IAC</i> (not on the syllabus): death from <b>tetanus</b> that set in about three weeks after a hacking wound had healed was due to an efficient intervening cause, so the accused was not liable for the death.")),
S("a4a-5","The three situations: personae, ictus, praeter intentionem",
 P("Art. 4(1) covers three ways a result can differ from the intent. All three make the offender liable; they differ in the <b>penalty effect</b>."),
 V("threeerrors"),
 TB(["Situation","What happened","Effect"],[
  ["<b>Error in personae</b><br>(mistake in identity)","He hits the person he aimed at, but that person is not who he thought.","Liable for the crime committed. If it differs from the crime intended, Art. 49: the lesser penalty, in its maximum period."],
  ["<b>Aberratio ictus</b><br>(mistake in the blow)","He aims at A; the blow lands on B, who is also present.","Two results from a single act: usually a <b>complex crime</b> (Art. 48), e.g., attempted homicide of A + homicide of B."],
  ["<b>Praeter intentionem</b><br>(result greater than intended)","He meant only to injure, but the victim died.","Liable for the result, with the mitigating circumstance of “no intention to commit so grave a wrong” (Art. 13(3)), unless the means used show intent (a knife to the chest)."]]),
 TR("Praeter intentionem is judged by the means","The mitigating circumstance is not available if the weapon or the manner of attack shows that the result was intended or expected. A single fist blow to the body: yes (Garcia). A stab to the chest: no."))
],[
 G("g-4a"),
 EXAM("“Under Art. 4(1), one who commits a felony is liable for all its direct, natural and logical consequences, though unintended (el que es causa de la causa es causa del mal causado). The felony need not be the immediate cause; it suffices that it is the proximate cause, unbroken by an efficient intervening cause (People v. Iligan). The victim's pre-existing illness is not such a cause (Garcia v. People).”"),
 DR([["Garcia, but Chy died a week later of a heart attack while jogging.","The chain may be broken by an independent cause; physical injuries only."],["Iligan, but Quiñones walked home safely and was hit by a car the next morning on his way to work.","An efficient intervening cause: no liability for the death."],["A punches B; B falls, hits his head on the pavement and dies.","Homicide (Art. 4(1)) with praeter intentionem as mitigating."],["A, in self-defense, shoots at C, misses, and kills bystander D.","Not liable: there was no felony to start the chain."]])
]);

// ═══════════════════════ 5 · ART. 4(2) ═══════════════════════
CH("a4b","6","Art. 4(2) · Impossible crimes","Punishing the criminal mind",
"Here the offender does everything, with evil intent, but the crime <b>could never happen</b>: the victim was already dead, the room was empty, the check was worthless, the poison was sugar. The Code still punishes him, for his <b>criminal propensity</b>. This is the Code's most positivist provision.",
["Explain why impossible crimes are punished","State and apply all four requisites","Distinguish legal and physical impossibility, and inadequate and ineffectual means","Separate impossible crimes from attempted and frustrated felonies (Balmores, Intod, Jacinto, Domasian)"],
[
S("a4b-1","The provision and its purpose",CO("4",[0,2]),
 P("Objectively, no crime was committed. Subjectively, the offender is a criminal. Reyes explains that the law punishes him to <mark>protect society from a person who is socially dangerous</mark>, because his act showed he is ready to commit crimes. The penalty is in <b>Art. 59</b> (arresto mayor or a fine), fixed according to the social danger and the degree of criminality shown."),
 RQ("Requisites of an impossible crime",[["The act would have been an offense against persons or property",""],["The act was done with evil intent",""],["Its accomplishment is inherently impossible, or the means employed are inadequate or ineffectual",""],["The act does not constitute a violation of another provision of the RPC",""]])),
S("a4b-2","Requisite 1 · An offense against persons or property",
 P("Only felonies <b>against persons</b> (Title Eight: parricide, murder, homicide, infanticide, abortion, physical injuries, rape…) or <b>against property</b> (Title Ten: robbery, theft, estafa, malicious mischief, arson…) can be impossible crimes. If the act would be any other kind of felony, there is <b>no impossible crime</b>."),
 C("domasian","Kidnapping is a crime against liberty, so it can never be an impossible crime, and it was consummated anyway."),
 TR("Liberty, chastity and public interest are out","Kidnapping, illegal detention, falsification and the like do not qualify (2014 Bar: “impossible crime of kidnapping” was wrong).")),
S("a4b-3","Requisite 2 · Evil intent",
 P("The offender must have intended to commit the offense, that is, to cause injury to another. Without evil intent, he is not a criminal even subjectively."),
 EX("Stabbing a body he knows is dead","A wanted to kill B. He found B already dead and, to vent his grudge, stabbed the corpse three times. No impossible crime: he <b>knew</b> B was dead, so he did not intend to cause an injury that he knew he could not cause. (If he had believed B was alive, it would be an impossible crime.)")),
S("a4b-4","Requisite 3 · Inherent impossibility or inadequate/ineffectual means",
 V("impossibility"),
 P("<b>Inherent impossibility</b> means the intended act is, by its nature, impossible to accomplish. It is <b>legal</b> when the intended acts, even if completed, would not be a crime: taking a watch that turns out to be your own (theft requires property belonging to another), or shooting a man who died hours before (a corpse cannot be killed). It is <b>physical (factual)</b> when circumstances unknown to the offender make it impossible: picking an empty pocket, opening an empty safe, shooting into a room the victim had left (<i>Intod</i>), stealing a worthless check (<i>Jacinto</i>)."),
 P("<b>Inadequate means</b> are insufficient in quantity or force: too little poison. <b>Ineffectual means</b> cannot produce the result at all: sugar instead of arsenic, or an unloaded gun."),
 K("★ Adequate means + no result = frustrated, not impossible","If the means were adequate (enough poison to kill an ordinary person) but the victim survived because of something outside the offender's control (he had built up a resistance working in a mine, or a doctor saved him), the crime is <b>frustrated murder</b>, not an impossible crime."),
 C("intod","Physical impossibility: the intended victim was not in the room."),
 C("jacinto","Physical/legal impossibility in theft: a worthless check means nothing of value can be gained.")),
S("a4b-5","Requisite 4 · No other felony committed",
 P("If the act, though it cannot produce the intended crime, produces <b>another felony</b>, the offender is liable for that felony instead."),
 EX("Reyes's watch example","A decides to rob B of the watch B always carries. When A points a gun at B and demands it, B has no watch. Not an impossible crime: A committed <b>grave threats</b> or coercion, which are other felonies. Likewise, if the 'non-toxic' substance gives the victim an upset stomach requiring 10 days of treatment, the offender is liable for <b>less serious physical injuries</b> (2014 Bar)."),
 TR("Intod and the damaged house","In <i>Intod</i>, the shots also damaged the house. The Court still convicted for an impossible crime. If asked, note the argument that malicious mischief is “another felony,” but follow <i>Intod</i>.")),
S("a4b-6","Impossible crime vs. attempted and frustrated felony",
 DS("Same failure, different reason","In all three, the evil intent is not accomplished. In an <b>impossible crime</b>, it <b>could not</b> be accomplished (inherent impossibility; inadequate or ineffectual means). In an <b>attempted or frustrated felony</b>, it <b>could</b> have been, but an outside cause or accident intervened."),
 C("balmores","An alert clerk is an outside cause: attempted estafa, not an impossible crime."),
 K("No attempted or frustrated impossible crime","The offender in an impossible crime has already performed all the acts he could; the impossibility is inherent. So an impossible crime has no stages."))
],[
 G("g-imp"),
 EXAM("“An impossible crime is committed when the act would be an offense against persons or property, is done with evil intent, cannot be accomplished because of inherent impossibility or the use of inadequate or ineffectual means, and constitutes no other felony (Art. 4(2)). Firing at a room where the intended victim is absent is an impossible crime of murder (Intod v. CA).”"),
 DR([["Intod, but Bernardina's son-in-law was in the room and was hit.","No longer impossible: liable for the crime against the son-in-law (Art. 4(1), error in personae)."],["Jacinto, but the check was funded and was encashed.","Consummated qualified theft."],["A puts 'poison' that is really sugar into B's coffee.","Impossible crime (ineffectual means)."],["A uses enough arsenic to kill, but B survives after his stomach is pumped.","Adequate means → frustrated murder."]])
]);

// ═══════════════════════ 6 · ART. 5 ═══════════════════════
CH("a5","7","Art. 5 · The duty of the court","Acts not punishable; clearly excessive penalties",
"Art. 5 tells judges what to do in two uncomfortable situations: when an act <b>deserves punishment but no law punishes it</b>, and when the law's penalty is <b>clearly too harsh</b>. In both, the judge applies the law as written and writes to the President.",
["State what the court must do in each paragraph","Explain why the court cannot convict or lower the penalty itself"],
[
S("a5-1","The provision",CO("5"),
 V("art5")),
S("a5-2","Paragraph 1 · An act not punishable by law",
 P("Based on <mark><i>nullum crimen, nulla poena sine lege</i></mark>: there is no crime when no law punishes the act. So however reprehensible the act, the court must <b>acquit</b>; it cannot create a crime by judicial decision."),
 RQ("Paragraph 1 requires",[["The act committed is not punishable by any law",""],["The court deems it proper to repress the act",""],["The court renders the proper decision by dismissing the case and acquitting the accused",""],["The judge reports to the Chief Executive, through the Secretary of Justice, the reasons why the act should be made the subject of penal legislation",""]])),
S("a5-3","Paragraph 2 · A clearly excessive penalty",
 P("Here the accused <b>is guilty</b>, but the penalty seems too heavy given his <b>degree of malice</b> and the <b>injury</b> caused. Courts must apply the penalty the law provides (<i>dura lex sed lex</i>); they cannot impose a lighter one because they find it fairer. The remedy is executive clemency."),
 RQ("Paragraph 2 requires",[["After trial, the court finds the accused guilty",""],["The penalty provided and imposed appears clearly excessive, because the accused acted with a lesser degree of malice, and/or there is no injury or only a slight one",""],["The court does not suspend the sentence; it submits a statement to the Chief Executive, through the DOJ, recommending executive clemency",""]]),
 C("mananquil","Art. 5 in practice: the Court affirmed parricide but recommended the 71-year-old accused for executive clemency."),
 TR("Two things the judge cannot do","(1) Convict for an act not punished by law. (2) Lower the penalty or suspend its execution. Art. 5 ¶2 refers to “this Code,” so it is used for RPC penalties."))
],[
 EXAM("“Under Art. 5, the court cannot convict for an act not punished by law (nullum crimen, nulla poena sine lege); it must acquit and report to the Chief Executive, through the DOJ, recommending legislation. When the penalty is clearly excessive, the court must still impose it without suspending its execution, and may recommend executive clemency.”")
]);

// ═══════════════════════ 7 · ART. 6 ═══════════════════════
CH("a6","8","Art. 6 · Stages of execution","Attempted, frustrated, consummated",
"Art. 6 measures <b>how far</b> a crime got. It is the article with the most syllabus cases (12) and the most exam problems. Master three things: <b>what an overt act is</b> (attempt starts there), <b>when the subjective phase ends</b> (attempt becomes frustration), and <b>which crimes cannot be frustrated</b> because of their elements.",
["Trace the development of a crime from thought to consummation","Explain each element of attempted and of frustrated felony","Apply the subjective/objective phase test, including the homicide wound ladder","Determine the stage by the nature, elements and manner of the crime (theft, robbery, rape, estafa, arson)"],
[
S("a6-1","The provision",CO("6"),
 P("Art. 6 does two things: it makes all three stages <b>punishable</b>, and it defines them. The stages matter because the penalty drops by one degree for frustration and two for attempt (Arts. 50–51), so the stage you name changes the sentence.")),
S("a6-2","How a crime develops",
 V("stages"),
 P("A crime passes through <b>internal acts</b> (ideas and plans, never punished) and <b>external acts</b>. External acts are either <b>preparatory</b>, ordinarily not punished, or <b>acts of execution</b>, punished as attempted, frustrated or consummated."),
 P("Preparatory acts are punished only when the law makes them separate crimes: e.g., possession of picklocks (Art. 304), or <b>conspiracy and proposal</b> to commit treason, rebellion and coup d'état (Art. 8).")),
S("a6-3","Attempted felony",
 RQ("Elements of an attempted felony",[["The offender commences the commission of the felony directly by overt acts","The line between preparation and attempt."],["He does not perform all the acts of execution which should produce the felony","Something remained for him to do."],["The offender's act is not stopped by his own spontaneous desistance",""],["The non-performance of all acts of execution is due to a cause or accident other than his spontaneous desistance","e.g., the victim grabbed his hand; a policeman arrived."]]),
 K("★ Overt act (definition)","Some physical activity or deed, indicating the intention to commit a <b>particular</b> crime, more than mere planning or preparation, which, if carried to its complete termination following its natural course, without being frustrated by external obstacles or by the offender's voluntary desistance, will <b>logically and necessarily ripen into a concrete offense</b>."),
 P("So an overt act needs two things: (1) <b>external acts</b>, and (2) a <b>direct connection</b> with the crime intended. Buying poison is preparation (it could be for rats). Mixing it into B's food, which B begins to eat, is an overt act of murder; if B spits it out, it is attempted murder."),
 DS("Equivocal acts are not overt acts","<i>Tabago</i>: a hand going to a holstered pistol is “very equivocal”; it is not attempted homicide, because he might still have desisted. To be attempted homicide, a gun must be <b>fired</b> at the victim with intent to kill. <i>U.S. v. Simeon</i>: raising a bolo as if to strike, with no blow struck, is only threats (Art. 285). An overt act need not be physical: <b>offering a bribe</b> to a public officer is an overt act of corruption."),
 P("<b>“Directly”</b> means only offenders who <b>personally</b> take part in the execution can be guilty of an attempt. If A induces B to kill C and B refuses, A is not liable for attempted homicide; his inducement is only a proposal. If B agrees and shoots at C but misses, both are liable for the attempt, because of conspiracy."),
 C("lamahang","The indeterminate offense: breaking a wall shows an intent to enter, but not what he would do once inside."),
 K("Intent is read from the acts, not from the admission","Acts that can be read either way (innocent or criminal) cannot ground an attempt. The objective must be shown by the nature of the acts themselves (<i>Lizada</i>; <i>Lamahang</i>).")),
S("a6-4","Spontaneous desistance",
 P("If the offender <b>voluntarily stops</b> before performing all the acts of execution, he is not liable for the attempt. Desistance is an <b>absolutory cause</b>: the law rewards the change of heart."),
 UL(["It must be <b>spontaneous</b>: stopping because a policeman arrived or the victim fought back is not desistance.","It must come <b>before all the acts of execution</b> are performed, i.e., only in the attempted stage. After that, the felony is frustrated or consummated, and desisting changes nothing (2022 Bar: Sisa threw down the knife only after stabbing).","He is still liable for whatever crime his acts <b>already</b> constitute: the physical injuries already inflicted, the trespass already committed."])),
S("a6-5","The subjective and objective phases",
