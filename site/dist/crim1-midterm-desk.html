   "Art. 2 (1)–(5)",
   "Art. 4(2) requisites",
   "Reductivism, retributivism, denunciation",
   "Valenzuela",
   "Ah Chong requisites"
  ],
  "a": "<b>(1)</b> Offenses committed while on a Philippine ship or airship; forging or counterfeiting Philippine coins, currency notes, or government obligations and securities; introducing those obligations and securities into the Philippines; offenses by public officers or employees in the exercise of their functions; crimes against national security and the law of nations (Title One, Book Two).<br><b>(2)</b> The act would be an offense against persons or property; it was done with evil intent; its accomplishment is inherently impossible or the means are inadequate or ineffectual; it constitutes no other felony.<br><b>(3)</b> Reductivism (deterrence, incapacitation, reform); retributivism (deserved, proportionate punishment); denunciation (society's condemnation). Reductivist provision: Art. 4(2), which punishes the dangerous offender though no harm resulted.<br><b>(4)</b> False. Theft is consummated upon taking with intent to gain; disposal is not an element, so there is no frustrated theft (Valenzuela).<br><b>(5)</b> The act would have been lawful had the facts been as the accused believed; his intention was lawful; the mistake was without fault or carelessness on his part.",

  "q": "(a) In a mall supermarket, Eli loaded six boxes of detergent into a cart, wheeled them past the cashiers without paying, and loaded them into a waiting taxi in the parking lot. A guard stopped the taxi before it left. The RTC convicted Eli of frustrated theft. Correct? (b) Fred shot Gino once in the left shoulder with a .45 pistol inside a store; Gino ran and hid in a back room, and Fred fled. Gino recovered after nine days in the hospital. Fred is charged with frustrated murder. (c) Same as (b), except Gino was shot in the chest, fell, and lay still; Fred, thinking him dead, walked away. Gino survived after emergency surgery. (d) Hector, intending to rape Ana, pinned her down and removed her clothes, and his penis touched her labia before she kicked him away. Hector argues it is only frustrated rape.",
  "iss": [
   "No frustrated theft; apoderamiento (Valenzuela)",
   "Subjective phase not complete; victim escaped (Sy Pio)",
   "Subjective phase complete; mortal wound (Eduave)",
   "No frustrated rape; slightest penetration (Orita; Campuhan)"
  ],
  "a": "<b>Rule.</b> A felony is consummated when all its elements are present; frustrated when the offender performs all the acts of execution but the felony is not produced for causes independent of his will; attempted when he begins by overt acts but does not perform all the acts of execution, for a cause other than his own spontaneous desistance (Art. 6). The stage depends on each crime's elements.<br><br><div class=\"sx-part\">(a) Eli</div><br><br><b>Issue.</b> Is taking detergent past the cashiers into a taxi, then being stopped, frustrated or consummated theft?<br><br><b>Analysis.</b> Theft's elements are complete upon <b>taking</b>, that is, gaining possession with intent to gain. Eli had the boxes in his possession and loaded them into the taxi. <b>Why not frustrated?</b> Being able to dispose of the goods is not an element of theft, so being stopped in the parking lot does not leave any act undone (Valenzuela).<br><br><b>Conclusion.</b> Consummated theft; the RTC erred.<br><br><div class=\"sx-part\">(b) Fred, first version</div><br><br><b>Issue.</b> Is a non-fatal shoulder wound, after which the victim runs and hides, frustrated or attempted murder?<br><br><b>Analysis.</b> Frustration requires that all the acts of execution be performed; in homicide or murder, this generally means a <b>mortal wound</b> (or a subjective phase completed in the offender's mind). The shoulder wound was not fatal, and Fred <b>saw Gino escape</b>, so he knew he had not finished (Sy Pio). <b>Why not frustrated?</b> Not all the acts of execution were performed.<br><br><b>Conclusion.</b> Attempted murder (if treachery attended the shooting; otherwise attempted homicide).<br><br><div class=\"sx-part\">(c) Fred, second version</div><br><br><b>Issue.</b> Is a chest wound that would have killed but for surgery frustrated murder?<br><br><b>Analysis.</b> The chest wound was <b>mortal</b>, and Fred left believing Gino dead: the subjective phase was complete (Eduave). Death was prevented only by surgery, a cause independent of his will. <b>Why not attempted?</b> He had performed the last act needed to kill.<br><br><b>Conclusion.</b> Frustrated murder (or homicide).<br><br><div class=\"sx-part\">(d) Hector</div><br><br><b>Issue.</b> Is touching the labia, before the victim kicks him away, frustrated or consummated rape?<br><br><b>Analysis.</b> Rape is consummated by carnal knowledge, and any penetration, even touching the labia, suffices (Orita; Campuhan). <b>Why not frustrated?</b> Rape has no frustrated stage: before penetration, not all the acts of execution are done (attempt); upon penetration, the crime is complete.<br><br><b>Conclusion.</b> Consummated rape.",
  "c": "Theft and rape have no frustrated stage (Valenzuela; Orita). Homicide is frustrated only when the subjective phase is complete (Eduave), not when the victim visibly escapes (Sy Pio)."
 },
 {

  "t": [

  "q": "(a) At a card game, Celso accused Dindo of cheating. Dindo swung a wooden pole at Celso; Celso ducked, drew a knife and stabbed Dindo in the arm. Dindo dropped the pole and ran. Celso chased him for 30 meters and stabbed him in the back, killing him. (b) In a crowded, brightly lit church, Lorna's ex-suitor sat beside her and touched her knee. She stabbed him in the neck with a pocket knife. (c) Brothers Ted and Ned arrived at the rice field to see their father lying in the mud, bleeding, with their uncle standing over him holding a bolo. They hacked the uncle to death. It later turned out that their father had started the fight. Discuss the liability of Celso, Lorna, and Ted and Ned.",
  "iss": [
   "Two stages; aggression ceased (Alconga)",
   "Unlawful aggression vs. reasonable necessity; place and occasion (Jaurigue)",
   "Defense of relatives; honest belief (Esmedia)",
   "Relative's provocation immaterial if the defender had no part in it",
   "Incomplete justification (Art. 69)"
  ],
  "a": "<b>Rule.</b> Self-defense requires (1) unlawful aggression, which must still exist when the defense is made; (2) reasonable necessity of the means; and (3) lack of sufficient provocation. Without unlawful aggression there is no defense at all; with it and a majority of the requisites, the defense is incomplete (privileged mitigating, Art. 69). Defense of relatives requires (1) and (2), and if the relative provoked, that the defender had no part in it.<br><br><div class=\"sx-part\">(a) Celso</div><br><br><b>Issue.</b> Is Celso justified in the fatal stab after chasing Dindo?<br><br><b>Analysis.</b> The first stab was defense against an actual attack with the pole. But when Dindo <b>dropped the pole and ran</b>, the aggression ceased. <b>Why not self-defense for the fatal blow?</b> There was nothing left to repel; chasing him 30 meters and stabbing his back is retaliation (Alconga). <b>Why not incomplete self-defense?</b> That too requires unlawful aggression at the time.<br><br><b>Conclusion.</b> Celso is liable for homicide.<br><br><div class=\"sx-part\">(b) Lorna</div><br><br><b>Issue.</b> Is stabbing the ex-suitor's neck in a lit, crowded church justified as defense of honor?<br><br><b>Analysis.</b> Touching her knee is unlawful aggression against her honor, and she gave no provocation. But the <b>means</b> were unreasonable: in a brightly lit, crowded church there was no real danger of rape, and a slap or a push would have sufficed (Jaurigue). <b>Why not complete self-defense?</b> Requisite 2 fails. <b>Why not homicide with no mitigation?</b> Unlawful aggression plus the majority of the requisites make it incomplete self-defense.<br><br><b>Conclusion.</b> Homicide, with the privileged mitigating circumstance of incomplete self-defense.<br><br><div class=\"sx-part\">(c) Ted and Ned</div><br><br><b>Issue.</b> Are the brothers justified in killing the uncle, though their father started the fight?<br><br><b>Analysis.</b> Their father is a relative under ¶2. As things appeared, with their father down and bleeding and the uncle standing over him with a bolo, they <b>honestly and reasonably believed</b> the attack would continue; unlawful aggression may rest on that belief (Esmedia). <b>Why does the father's provocation not matter?</b> Under ¶2, the relative's provocation bars the defense only if the defenders took part in it, and they did not.<br><br><b>Conclusion.</b> Ted and Ned are justified (defense of relatives).",
  "c": "Fleeing aggressor = aggression ceased (Alconga); excessive means in a safe setting = incomplete defense (Jaurigue); honest belief + no part in the provocation = defense of relatives (Esmedia)."
 },

  "set": "Mock exam B",

  "q": "(a) In a hotel in Singapore, Colonel X persuaded Majors Y and Z to join him in seizing a military camp in Manila to topple the government. All three agreed and fixed the date. Upon arrival at NAIA, they were arrested. What crime, if any, may they be charged with? (b) In Manila, Ana asked her friend Bea, for ₱50,000, to kill Ana's husband. Bea refused and reported Ana to the police. Is Ana liable? (c) Carlo agreed with Dino to rob a store. As they approached it, Dino changed his mind and went home; Carlo forced open the back door and was caught inside before taking anything. What are their liabilities?",
  "iss": [
   "Conspiracy/proposal punishable only when the law provides (Art. 8)",
   "Conspiracy to commit coup d'état (Art. 136); territoriality (Art. 2); Title Three not in Art. 2(5)",
   "Proposal to commit murder: not punishable",
   "Desistance before overt acts; indeterminate offense / overt acts (Lamahang)"
  ],
  "a": "<b>Rule.</b> Conspiracy and proposal are punishable only where the law specially provides a penalty (Art. 8), as in treason, coup d'état, rebellion and sedition. Penal laws are territorial; outside the Philippines, the RPC applies only in Art. 2's five cases. An attempt requires overt acts directly connected to a specific crime (Art. 6).<br><br><div class=\"sx-part\">(a) Colonel X and the majors</div><br><br><b>Issue.</b> Can they be prosecuted here for conspiring in Singapore to stage a coup?<br><br><b>Analysis.</b> Conspiracy to commit coup d'état <b>is</b> punishable (Art. 136). But the agreement was made in <b>Singapore</b>. <b>Why not Art. 2(5)?</b> It covers crimes against national security and the law of nations (Title One); coup d'état is a crime against public order (Title Three). On arrival they had committed no act here. If the problem shows they renewed the agreement or took steps in the Philippines, the conspiracy would be committed here.<br><br><b>Conclusion.</b> No crime triable here on these facts.<br><br><div class=\"sx-part\">(b) Ana</div><br><br><b>Issue.</b> Is Ana liable for proposing that Bea kill her husband?<br><br><b>Analysis.</b> <b>Why not proposal?</b> No law punishes a proposal to commit murder or parricide. <b>Why not attempted parricide?</b> An attempt requires that the offender commence the crime <b>directly</b> by overt acts; an inducement that is refused is only a proposal.<br><br><b>Conclusion.</b> Ana is not criminally liable.<br><br><div class=\"sx-part\">(c) Carlo and Dino</div><br><br><b>Issue.</b> What are the liabilities of a conspirator who withdraws and of one who breaks the door?<br><br><b>Analysis.</b> <b>Dino</b>: conspiracy to rob is not a crime by itself, and he withdrew before any overt act. <b>Carlo</b> forced the back door, an overt act. <b>Why attempted robbery and not attempted trespass, as in Lamahang?</b> In Lamahang the purpose was indeterminate; here the prior agreement to rob shows the specific crime intended. He did not complete the acts of execution, for a reason other than desistance. If the purpose to rob cannot be proven, he is liable only for what the acts show (attempted trespass).<br><br><b>Conclusion.</b> Dino: not liable. Carlo: attempted robbery.",
  "c": "Conspiracy and proposal are crimes only where the law provides (Art. 8: coup d'état, rebellion, treason, sedition); a conspiracy formed abroad to commit coup d'état is outside Art. 2. A proposal to commit murder is not punishable."
 },

  "a": "<div class=\"sx-part\">(a) Mario</div><br><br><b>Issue.</b> Is destroying the dike justified, and who pays for the fish?<br><br><b>Rule.</b> Art. 11(4): the evil sought to be avoided must actually exist; the injury feared must be greater than that done; and there must be no other practical and less harmful means. The persons benefited are civilly liable in proportion to the benefit (Art. 101).<br><br><b>Analysis.</b> The flood was real and imminent; 200 homes outweigh one fishpond; on the facts there was no less harmful option. <b>Why not self-defense?</b> Pedro was not an aggressor; the harm fell on a third person's property to avoid a different evil.<br><br><b>Conclusion.</b> Mario is not liable; the villagers who benefited pay Pedro proportionately.<br><br><div class=\"sx-part\">(b) Pvt. Lim</div><br><br><b>Issue.</b> Does obedience to his sergeant's order justify the beating?<br><br><b>Rule.</b> Art. 11(6) requires an order from a superior, for a lawful purpose, carried out by lawful means.<br><br><b>Analysis.</b> An order to beat a detainee has no lawful purpose. <b>Why not the good-faith exception in Beronilla?</b> That protects a subordinate who did not know, and could not have known, that the order was illegal; this order was illegal on its face.<br><br><b>Conclusion.</b> Lim is liable for serious physical injuries.<br><br><div class=\"sx-part\">(c) The ₱40,000 fine</div><br><br><b>Issue.</b> Is a felony punished by a ₱40,000 fine light or less grave?<br><br><b>Rule.</b> Art. 9: light felonies are those punished by arresto menor or a fine not exceeding ₱40,000.<br><br><b>Analysis.</b> <b>Why not less grave, since Art. 26 calls ₱40,000 correctional?</b> Art. 26 classifies fines; Art. 9 classifies felonies, and it prevails for this purpose.<br><br><b>Conclusion.</b> Light felony.<br><br><div class=\"sx-part\">(d) The judge</div><br><br><b>Issue.</b> May the judge lower the penalty for the starving mother?<br><br><b>Rule.</b> Art. 5 ¶2: the court must impose the penalty and may not suspend its execution, but it may recommend executive clemency when the penalty is clearly excessive given the malice and the injury.<br><br><b>Analysis.</b> <b>Why not just lower it?</b> Courts apply the law as written (dura lex sed lex).<br><br><b>Conclusion.</b> Impose the penalty and recommend executive clemency through the DOJ.",
  "c": "State of necessity justifies, but the persons benefited pay (Art. 101); an unlawful order does not justify; a ₱40,000 fine is a light felony (Art. 9); an excessive penalty must still be imposed, with a recommendation for clemency (Art. 5)."
 },
 {

  "a": "<b>(1)</b> The offender commences the commission of the felony directly by overt acts; he does not perform all the acts of execution; his act is not stopped by his own spontaneous desistance; the non-performance is due to a cause or accident other than his spontaneous desistance.<br><b>(2)</b> Spouse; ascendants; descendants; legitimate, natural or adopted brothers and sisters; relatives by affinity in the same degrees; relatives by consanguinity within the fourth civil degree.<br><b>(3)</b> Reparation for the victim; reconciliation of the offender, the offended and the community; reassurance to the offender that he can be reintegrated into society.<br><b>(4)</b> Conspiracy: treason (Art. 115); coup d'état, rebellion, insurrection (Art. 136); sedition (Art. 141); monopolies and combinations in restraint of trade (Art. 186). Proposal: treason (Art. 115); coup d'état, rebellion, insurrection (Art. 136).<br><b>(5)</b> Justifying circumstances affect the act (there is no crime), while exempting circumstances affect the actor (there is a crime, but no criminal liability); justifying circumstances generally carry no civil liability (except ¶4), while exempting circumstances generally do.<br><b>(6)</b> Light felony: Art. 9 defines light felonies as those punished by a fine not exceeding ₱40,000; it prevails over Art. 26 (which classifies the fine as correctional) for classifying felonies.",

<script>// Diagram library for the textbook. Each entry returns HTML; interactive ones also get an init(el).

V.punish=()=>fig("Four answers to “why punish?”, and where each shows up in our law.",

V.colonial=()=>fig("Rossabi: the layers of Philippine criminal law and procedure.",

V.theories=()=>fig("The RPC is mainly classical; Art. 4(2) is its clearest positivist feature.",
 `<div class="vz-2">${box("Classical (basis of the RPC)","<ul><li>Free will → the choice to do wrong</li><li>Penalty = <b>retribution</b>, in proportion to the act</li><li>Focus on the <b>act</b> and its result</li><li>Fixed penalties; mechanical</li></ul>","t-green")}${box("Positivist","<ul><li>Crime as a social and natural phenomenon</li><li>Penalty = <b>reform and protection</b></li><li>Focus on the <b>offender</b></li><li>Individualized measures (e.g., Art. 4(2), minors)</li></ul>","t-blue")}</div>`);

 `<div class="vz-terr"><svg viewBox="0 0 340 230" role="img" aria-label="Maritime zones">
 <circle cx="170" cy="190" r="170" class="z4"/><circle cx="170" cy="190" r="128" class="z3"/><circle cx="170" cy="190" r="92" class="z2"/><circle cx="170" cy="190" r="58" class="z1"/>
 <path d="M120 200 q20 -40 50 -30 q30 -25 55 5 q10 25 -20 30 q-40 15 -85 -5z" class="land"/>

V.felony=()=>fig("A felony needs all three elements. Dolo and culpa share freedom and intelligence; only the third requisite differs.",

V.chain=()=>fig("The chain holds through the victim's condition, refusal of treatment, medical error and infection. Only a foreign force or the victim's deliberate act breaks it.",
 `<div class="vz-chain"><div class="vz-link t-dark">Felony<br><small>(punch, hack, burn)</small></div><div class="vz-arrow">→</div><div class="vz-link">Natural, continuous sequence</div><div class="vz-arrow">→</div><div class="vz-link t-red">Result<br><small>(death, injury)</small></div></div>
 <div class="vz-2" style="margin-top:10px">${box("Does NOT break the chain",`<ul><li>The victim's illness or weak constitution (<i>Garcia</i>)</li><li>Complications such as pneumonia or infection (<i>Mananquil</i>)</li><li>A second force set off by the felony (<i>Iligan</i>: the vehicle)</li><li>Refusal of treatment or surgery; jumping into water out of fear</li><li>Unskillful medical treatment</li></ul>`,"t-green")}${box("BREAKS the chain",`<ul><li>An active force <b>absolutely foreign</b> to the felony (lightning; an unrelated accident)</li><li>The victim's own <b>intentional</b> act (deliberately reopening the wound)</li><li>A later, independent illness (<i>Urbano</i>: tetanus weeks later; rabies in <i>Tammang</i>)</li></ul>`,"t-red")}</div>`);

 ["Error in personae","He shoots the person in front of him, believing him to be B; it is C.",`<svg viewBox="0 0 120 50"><circle cx="12" cy="25" r="7" class="p"/><line x1="22" y1="25" x2="96" y2="25" class="ar"/><circle cx="106" cy="25" r="8" class="v"/><text x="106" y="47" class="tl">C (thought B)</text></svg>`,"Art. 49: the lesser penalty, in its maximum period (if the crimes differ)"],
 ["Aberratio ictus","He aims at A; the bullet hits B beside A.",`<svg viewBox="0 0 120 50"><circle cx="12" cy="25" r="7" class="p"/><line x1="22" y1="25" x2="70" y2="20" class="ar0"/><circle cx="80" cy="18" r="7" class="g"/><path d="M70 20 Q90 30 100 38" class="ar"/><circle cx="106" cy="40" r="7" class="v"/><text x="80" y="8" class="tl">A</text><text x="106" y="50" class="tl">B</text></svg>`,"Usually a complex crime (Art. 48)"],

<script>(function(){
"use strict";
const EXAM=new Date("2026-11-07T14:00:00+08:00").getTime();
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const strip=s=>String(s).replace(/<[^>]+>/g,"");
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const KEY="crimdesk1:";
const store={get(k,d){try{const v=localStorage.getItem(KEY+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v));}catch(e){}}};
const KIT=["Blue book or notebook inserts","1/4 index card (3 × 5 in), name written <b>surname first</b>","Envelope","Stapler","Sign pen or fountain pen, <b>blue or black</b> (bring a spare)"];
let kit=store.get("kit",{});
let srs=store.get("srs",{}),fix=store.get("fix",{}),read=store.get("read2",{}),stats=store.get("stats",{rev:0,streak:0,best:0,days:{}}),sxdone=store.get("sx",{}),notes=store.get("notes",{});
const save=()=>{store.set("srs",srs);store.set("fix",fix);store.set("stats",stats);store.set("read2",read);store.set("sx",sxdone);};

// ---------- topics / cases ----------
const TOPIC={},TOPIC_NAME={};TOPICS.forEach(t=>{TOPIC[t.k]=t;TOPIC_NAME[t.k]=t.n;});
const SEC_OF={};TOPICS.forEach(t=>t.sec.forEach((s,i)=>SEC_OF[s.id]={t,s,i}));
const chProg=t=>{const n=t.sec.length,r=t.sec.filter(s=>read[s.id]).length;return{n,r,p:n?r/n:0};};
const ART_TOPIC={"1":"intro","2":"a2","3":"a3","4":"a4a","5":"a5","6":"a6","7":"a7","8":"a8","9":"a9","10":"a10","11":"a11"};
const CASE={};CASES.forEach(c=>CASE[c.id]=c);
const SHORT={bull:"Bull",vanwilsem:"Van Wilsem",wongcheng:"Wong Cheng",lookchaw:"Look Chaw",ahsing:"Ah Sing",lollo:"Lol-lo",ahchong:"Ah Chong",oanis:"Oanis",magsumbol:"Magsumbol",gervero:"Gervero",iligan:"Iligan",mananquil:"Mananquil",brobst:"Brobst",garcia:"Garcia",balmores:"Balmores",intod:"Intod",domasian:"Domasian",jacinto:"Jacinto",eduave:"Eduave",orita:"Orita",campuhan:"Campuhan",adiao:"Adiao",valenzuela:"Valenzuela",lamahang:"Lamahang",salvilla:"Salvilla",borinaga:"Borinaga",sypio:"Sy Pio",ravelo:"Ravelo",kalalo:"Kalalo",boholst:"Boholst-Caballero",alconga:"Alconga",mack:"Mack",sumicad:"Sumicad",genosa:"Genosa",luague:"Luague",delacruz:"De la Cruz",jaurigue:"Jaurigue",apolinar:"Apolinar",bumanglag:"Bumanglag",narvaez:"Narvaez",chuahiong:"Chua Hiong",pelayo:"Pelayo",esmedia:"Esmedia",normahernandez:"Norma Hernandez",dudley:"Dudley",ty:"Ty",delima:"Delima",belbes:"Belbes",beronilla:"Beronilla",agao:"Agao"};
const BY_SHORT={};Object.entries(SHORT).forEach(([id,s])=>BY_SHORT[s.toLowerCase()]=id);

// where each case is discussed in the textbook
const CASE_SEC={};TOPICS.forEach(t=>t.sec.forEach(s=>s.b.forEach(b=>{if(b.k==="case"&&!CASE_SEC[b.id])CASE_SEC[b.id]=s.id;})));

// ---------- cards ----------
const CARDS={},DECK={codal:[],elements:[],cases:[]};
CODAL.forEach(ar=>ar.p.forEach((para,pi)=>{let bi=0;para.replace(/\[\[(.+?)\]\]/g,()=>{const id=`c-${ar.a}-${pi}-${bi}`;CARDS[id]={id,deck:"codal",art:ar.a,t:ART_TOPIC[ar.a],ar,pi,bi};DECK.codal.push(id);bi++;return"";});}));
ELEMENTS.forEach(L=>L.i.forEach((_,ii)=>{const id=`e-${L.id}-${ii}`;CARDS[id]={id,deck:"elements",t:L.t,L,ii};DECK.elements.push(id);}));
const DIRS={cr:"Case → doctrine",fc:"Facts → case",dc:"Doctrine → case",fr:"Facts → ruling & why"};
CASES.forEach(c=>Object.keys(DIRS).forEach(d=>{const id=`k-${c.id}-${d}`;CARDS[id]={id,deck:"cases",t:c.t,c,dir:d};DECK.cases.push(id);}));

// ---------- SRS ----------
const now=()=>Date.now(),DAY=864e5;
const isDue=id=>{const s=srs[id];return s&&s.due<=now();};
function grade(id,g){
  const s=srs[id]||{ivl:0,ease:2.3,reps:0,due:0};
  if(g===1){s.ivl=0;s.ease=Math.max(1.3,s.ease-.2);s.due=now()+2*6e4;s.lapses=(s.lapses||0)+1;}
  else if(g===2){s.ivl=Math.max(.3,s.ivl*1.2);s.ease=Math.max(1.3,s.ease-.15);}
  else if(g===3){s.ivl=s.reps===0?.5:Math.max(1,s.ivl*s.ease);}
  else{s.ivl=s.reps===0?2:s.ivl*s.ease*1.4;s.ease=Math.min(2.8,s.ease+.15);}
  s.ivl=Math.min(s.ivl,4);if(g>1)s.due=now()+s.ivl*DAY;s.reps++;srs[id]=s;
  if(g===1)fix[id]=0;else if(id in fix&&g>=3){fix[id]++;if(fix[id]>=2)delete fix[id];}
  stats.rev++;const dk=new Date().toDateString();stats.days[dk]=(stats.days[dk]||0)+1;
  if(g>=3){stats.streak++;stats.best=Math.max(stats.best,stats.streak);}else stats.streak=0;
  save();
}
function buildRound(ids,n=20){
  const due=ids.filter(isDue).sort((a,b)=>srs[a].due-srs[b].due),fresh=ids.filter(i=>!srs[i]),later=ids.filter(i=>srs[i]&&!isDue(i)).sort((a,b)=>srs[a].due-srs[b].due),fx=ids.filter(i=>i in fix);
  return shuffle([...new Set([...fx,...due,...shuffle(fresh),...later])].slice(0,n));
}

// ---------- block rendering ----------
function codalHTML(a,ps){

  const idx=ps&&ps.length?ps:ar.p.map((_,i)=>i);

  return `<div class="tb-codal"><div class="tb-codal-h"><span class="mono">Codal</span><span class="tb-codal-t">${label}. ${esc(ar.t)}</span></div>${idx.map(i=>`<p>${ar.p[i].replace(/\[\[(.+?)\]\]/g,'<span class="key">$1</span>')}</p>`).join("")}${ar.n&&(!ps||ps.includes(2))?`<div class="tb-codal-n">⚠ ${ar.n}</div>`:""}</div>`;
}
const linkCases=html=>html.replace(/<i>([^<]+)<\/i>/g,(m,t)=>{const id=BY_SHORT[t.trim().toLowerCase()];return id?`<i class="cl" data-case="${id}">${t}</i>`:m;});

  ${c.x?`<div class="tb-flag">⚠ ${c.x}</div>`:""}</div></article>`;
}
function gateHTML(gid){const G=GATES[gid];if(!G)return"";return `<div class="gt" data-gate="${gid}"><div class="gt-h"><span class="mono">Decision gate</span><b>${G.n}</b></div><div class="gt-body"></div></div>`;}
function runGate(el){
  const G=GATES[el.dataset.gate],body=$(".gt-body",el),path=[];
  function show(id){const nd=G.nodes[id];body.innerHTML=`${path.length?`<div class="gt-path">${path.join(" → ")}</div>`:""}<div class="gt-q">${nd.q}</div><div class="cd-row"><button class="cd-btn sm pri" data-a="y">Yes</button><button class="cd-btn sm" data-a="n">No</button>${path.length?'<button class="cd-btn sm ghost" data-a="r">Restart</button>':""}</div>`;
    body.onclick=e=>{const a=e.target.dataset.a;if(!a)return;if(a==="r"){path.length=0;return show(G.start);}const nx=nd[a];path.push(a==="y"?"Yes":"No");if(typeof nx==="string")show(nx);else end(nx);};}
  function end(x){const tone={g:"t-green",r:"t-red",y:"t-gold",b:"t-blue"}[x.tone]||"t-blue";body.innerHTML=`<div class="gt-path">${path.join(" → ")}</div><div class="gt-end ${tone}">${x.end}</div><div class="cd-row" style="margin-top:8px"><button class="cd-btn sm ghost" data-a="r">Restart</button></div>`;body.onclick=e=>{if(e.target.dataset.a==="r"){path.length=0;show(G.start);}};}
  show(G.start);
}
function vizHTML(id){const v=VIZ[id];if(!v)return"";return `<div class="vz-wrap" data-viz="${id}">${typeof v==="function"?v():v.html()}</div>`;}

   case"p":return `<p>${b.x}</p>`;

   case"trap":return `<aside class="tb-call c-trap"><div class="tb-call-t">⚠ ${b.t}</div><div>${b.x}</div></aside>`;

   case"tbl":return `<div class="tblw"><table class="tb-t"><thead><tr>${b.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
   case"exam":return `<div class="tb-exam"><div class="mono">On the exam, write</div><div>${b.x}</div></div>`;
   case"drill":return `<div class="tb-drill"><div class="tb-drill-t">Change one fact <span class="cd-muted">tap to reveal</span></div>${b.x.map(([q,a])=>`<details><summary>${q}</summary><div class="ans">${a}</div></details>`).join("")}</div>`;

}

{d:"2026-11-03",lbl:"Tue 3 Nov",x:"Read the <b>updated Chapter 0</b> (Sir's format, IRAC, the confusable pairs) and the <b>new Chapter 2, Introductory readings</b>. Then finish Art. 2 and Art. 3. Elements deck: the readings lists.",ch:"method"},

{d:"2026-11-05",lbl:"Thu 5 Nov",x:"Chapters 9–12 (Arts. 7–10), then Chapter 13, <b>Art. 11</b> (20 cases). Codal cloze: Art. 11, word for word. Practice writing on the right-hand pages only.",ch:"a11"},
{d:"2026-11-06",lbl:"Fri 6 Nov",x:"<b>Mock exam A under exam conditions</b>: 5 questions, 2 hours, IRAC, right-hand pages only. Check against the model answers, then Mock B's problems. Clear the fix list. Pack the exam kit. Sleep by 1:00 a.m.",go:"samplex"},
{d:"2026-11-07",lbl:"Sat 7 Nov",x:"Morning: fix list → the readings and elements lists → the confusable pairs (Chapter 0). Bring the kit. <b>Exam 2:00–4:00 p.m.</b> Do the objective question first.",ch:"method"}];

V.today=m=>{
  const all=Object.keys(CARDS),seen=all.filter(i=>srs[i]).length,due=all.filter(isDue).length,fx=Object.keys(fix).length;
  const todayKey=new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Manila"});
  const totalSec=TOPICS.reduce((n,t)=>n+t.sec.length,0),readSec=Object.keys(read).filter(k=>read[k]&&SEC_OF[k]).length;

  const deckStat=d=>`${DECK[d].filter(i=>srs[i]).length}/${DECK[d].length}`;
  const sxMiss=Object.entries(sxdone).filter(([,v])=>v==="miss").map(([k])=>k);
  m.innerHTML=`<section class="hero"><div class="hero-in"><div class="mono hero-k">Criminal Law 1 · Prof. Gutierrez · Midterm</div>
  <h1>Your Crim 1 textbook, Arts. 1–11</h1><p class="hero-p">Every article explained from the codal and Reyes, with each syllabus case placed where its doctrine is taught, plus drills to make it stick. Saturday, 7 November, 2:00–4:00 p.m. · ${countdown()}.</p>

  <h2 class="sec-h">Contents</h2>

let D=null;
function drill(ids,title,back,pool){if(!ids.length){alert("No cards match that filter.");return;}D={q:ids.slice(),i:0,flipped:false,hist:[],title,back:back||tab,requeued:new Set(),pool:pool||ids.slice()};document.body.classList.add("focus");renderDrill();}
function exitDrill(){document.body.classList.remove("focus");const b=D&&D.back;D=null;go(b||"today");}
function cardFront(c){
  if(c.deck==="codal"){let bi=0;const para=c.ar.p[c.pi].replace(/\[\[(.+?)\]\]/g,(m,x)=>{const r=bi===c.bi?'<span class="dr-blank">?</span>':x;bi++;return r;});return `<div class="dr-kind mono">Codal · Art. ${c.art} · ${esc(c.ar.t)}</div><div class="dr-front tb-codal" style="margin-top:12px">${para}</div>`;}
  if(c.deck==="elements")return `<div class="dr-kind mono">Reyes · ${esc(TOPIC_NAME[c.t]||"")}</div><div class="disp" style="font-size:1.2rem;text-align:center;margin:8px 0">${esc(c.L.n)}</div><${c.L.o?"ol":"ul"} class="dr-items">${c.L.i.map((x,j)=>`<li>${j===c.ii?'<span class="dr-blank">?</span>':x}</li>`).join("")}</${c.L.o?"ol":"ul"}><div class="dr-cue">What is missing?</div>`;
  const k=c.c,lbl=`<div class="dr-kind mono">${DIRS[c.dir]} · ${esc(TOPIC_NAME[k.t]||"")}</div>`;
  if(c.dir==="cr")return `${lbl}<div class="dr-name">${esc(k.n)}</div><div class="dr-cue">State the doctrine, the ruling, and the fact that decided it.</div>`;
  if(c.dir==="dc")return `${lbl}<div class="dr-front" style="margin-top:14px;text-align:center;font-size:1.1rem">${k.d}</div><div class="dr-cue" style="margin-top:10px">Which case?</div>`;
  const facts=k.f.replace(new RegExp(SHORT[k.id].replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"),"▢▢▢");
  if(c.dir==="fc")return `${lbl}<div class="dr-front" style="margin-top:12px">${facts}</div><div class="dr-cue" style="margin-top:10px">Name the case.</div>`;

}
function cardBack(c){
  if(c.deck==="codal"){let bi=0;const para=c.ar.p[c.pi].replace(/\[\[(.+?)\]\]/g,(m,x)=>{const r=bi===c.bi?`<span class="dr-fill">${x}</span>`:x;bi++;return r;});return `<div class="tb-codal">${para}</div>`;}

function renderDrill(){

    $("#exit",m).onclick=exitDrill;$("#exit2",m).onclick=exitDrill;const p=$("#prev",m);if(p)p.onclick=undo;$("#again",m).onclick=()=>{const P=D.pool;drill(buildRound(P,20),D.title,D.back,P);};return;}

  <div class="cd-card dr-card" id="card">${cardFront(c)}${D.flipped?`<div class="dr-ans">${cardBack(c)}</div>`:'<button class="cd-btn dr-show" id="flip">Show answer (Space)</button>'}</div>
  ${D.flipped?`<div class="dr-grades"><button class="g1" data-g="1">Again<small>1 · ← swipe</small></button><button class="g2" data-g="2">Hard<small>2</small></button><button class="g3" data-g="3">Good<small>3 · swipe →</small></button><button class="g4" data-g="4">Easy<small>4 · swipe ↑</small></button></div>`:""}
  <div class="cd-row" style="margin-top:10px;justify-content:space-between"><button class="cd-btn sm" id="prev" ${D.hist.length?"":"disabled"}>← Previous</button><span class="cd-muted" style="font-size:.8rem">Space flip · 1–4 grade · ← back · Esc exit</span></div></div>`;
  $("#exit",m).onclick=exitDrill;$("#prev",m).onclick=undo;const f=$("#flip",m);if(f)f.onclick=flip;
  $$(".dr-grades button",m).forEach(b=>b.onclick=()=>doGrade(+b.dataset.g));
  const card=$("#card",m);let sx=0,sy=0,st=0;
  card.addEventListener("touchstart",e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now();},{passive:true});

}
function flip(){if(!D||D.flipped)return;D.flipped=true;renderDrill();}
function doGrade(g){if(!D||!D.flipped)return;const id=D.q[D.i];D.hist.push({i:D.i,id,s:srs[id]?{...srs[id]}:null,f:id in fix?fix[id]:undefined,streak:stats.streak,best:stats.best,rev:stats.rev,qlen:D.q.length});grade(id,g);if(g===1&&!D.requeued.has(id)){D.requeued.add(id);D.q.push(id);}D.i++;D.flipped=false;renderDrill();}
function undo(){if(!D||!D.hist.length)return;const h=D.hist.pop();if(h.s)srs[h.id]=h.s;else delete srs[h.id];if(h.f===undefined)delete fix[h.id];else fix[h.id]=h.f;stats.streak=h.streak;stats.best=h.best;stats.rev=h.rev;D.q.length=h.qlen;D.requeued.delete(h.id);D.i=h.i;D.flipped=true;save();renderDrill();}
document.addEventListener("keydown",e=>{

  const sets=[...new Set(ESSAYS.map(e=>e.set))];
  function draw(){let body="";
    if(sel.view==="essays"){body=ESSAYS.filter(e=>e.set===sel.set).map((e,i)=>`<div class="cd-card" id="sx-${e.id}"><div class="cd-row" style="justify-content:space-between"><span class="mono">${esc(e.src)}</span><span>${sxdone[e.id]==="ok"?'<span class="hk hk-r">got it</span>':sxdone[e.id]==="miss"?'<span class="hk hk-g">redo</span>':""}</span></div>
      <div class="disp" style="font-size:1.05rem;margin:4px 0">Q${i+1}. ${e.t.map(t=>esc(TOPIC_NAME[t].split(" · ")[0])).join(" + ")}</div><div class="sx-q">${e.q}</div>
      <textarea class="cd-in" data-note="${e.id}" placeholder="Outline in IRAC: Issue → Rule → Analysis (why this element, why not the other) → Conclusion. Saved on this device." style="margin-top:10px">${esc(notes[e.id]||"")}</textarea>
      <div class="cd-row" style="margin-top:8px"><button class="cd-btn sm" data-timer="${e.id}">⏱ 24:00</button><button class="cd-btn sm pri" data-rev="${e.id}">Show issues & model answer</button></div>
      <div class="sx-a" data-ans="${e.id}" hidden><div class="mono">Issues: tick the ones you spotted</div><div class="sx-iss">${e.iss.map(x=>`<label><input type="checkbox"> ${x}</label>`).join("")}</div>
      <div class="mono" style="margin-top:10px">Model answer</div><div>${linkCases(e.a)}</div><div class="tb-exam"><div class="mono">In one line</div>${e.c}</div>
      <div class="cd-row"><button class="cd-btn sm" data-mark="ok:${e.id}">✓ Got it</button><button class="cd-btn sm" data-mark="miss:${e.id}">✗ Missed issues → redo list</button></div></div></div>`).join("");}
    else body=MCQ.map((q,i)=>`<div class="cd-card" data-mcq="${q.id}"><div class="mono">${esc(q.src)}</div><div style="margin:6px 0"><b>${i+1}.</b> ${q.q}</div>${q.ch.map((c,j)=>`<button class="mc-ch" data-ch="${j}">(${"ABCD"[j]}) ${c}</button>`).join("")}<div class="mc-why" hidden><p><b>Answer: (${"ABCD"[q.k]})</b> ${q.why}</p>${q.note?`<p class="cd-muted">Note: ${q.note}</p>`:""}</div></div>`).join("");
    m.innerHTML=`<div class="cd-card"><div class="cd-row" style="justify-content:space-between"><h2 style="margin:0">Samplex</h2><div>${[["essays","Problems"],["mcq","MCQ"]].map(([k,l])=>`<button class="cd-chip ${sel.view===k?"on":""}" data-view="${k}">${l}</button>`).join("")}</div></div>
    ${sel.view==="essays"?`<div style="margin-top:8px">${sets.map(s=>`<button class="cd-chip ${sel.set===s?"on":""}" data-set="${esc(s)}">${esc(s)} (${ESSAYS.filter(e=>e.set===s).length})</button>`).join("")}</div><p class="cd-muted" style="font-size:.9rem;margin:6px 0 0">Each mock follows Sir\'s format: <b>4 problems + 1 objective/enumeration question</b>, 2 hours, about 24 minutes each. Write in IRAC on the right-hand pages only, then compare. Model answers show the “why, and why not” analysis he looks for.</p>`:`<p class="cd-muted" style="margin:6px 0 0">San Beda midterm MCQs (keys checked against Reyes) + mock items.</p>`}</div>${body}`;
    m.onclick=e=>{const v=e.target.closest("[data-view]");if(v){sel.view=v.dataset.view;store.set("sxSel",sel);draw();return;}const s=e.target.closest("[data-set]");if(s){sel.set=s.dataset.set;store.set("sxSel",sel);draw();return;}
      const r=e.target.closest("[data-rev]");if(r){const a=$(`[data-ans="${r.dataset.rev}"]`,m);a.hidden=!a.hidden;return;}
      const mk=e.target.closest("[data-mark]");if(mk){const[k,id]=mk.dataset.mark.split(":");sxdone[id]=k;save();draw();const el=$("#sx-"+id,m);if(el)el.scrollIntoView({block:"start"});return;}
      const tm=e.target.closest("[data-timer]");if(tm){if(timer)clearInterval(timer);let left=24*60;timer=setInterval(()=>{left--;if(!tm.isConnected){clearInterval(timer);return;}tm.textContent=`⏱ ${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;if(left<=0){clearInterval(timer);tm.textContent="⏱ Time!";tm.style.color="var(--red)";}},1000);return;}
      const ch=e.target.closest("[data-ch]");if(ch){const box=ch.closest("[data-mcq]"),q=MCQ.find(x=>x.id===box.dataset.mcq);$$(".mc-ch",box).forEach((b,j)=>{b.classList.toggle("ok",j===q.k);b.classList.toggle("no",j===+ch.dataset.ch&&j!==q.k);});$(".mc-why",box).hidden=false;}};
    $$("[data-note]",m).forEach(t=>t.oninput=()=>{notes[t.dataset.note]=t.value;store.set("notes",notes);});
    if(openId){const el=$("#sx-"+openId,m);if(el)el.scrollIntoView({block:"start"});openId=null;}}
  draw();
};

// ---------- SEARCH ----------
const IDX=[];
const btext=b=>[b.t,b.x&&(Array.isArray(b.x)?b.x.flat().join(" "):b.x),b.items&&b.items.flat().join(" "),b.rows&&b.rows.flat().join(" "),b.why].filter(Boolean).join(" ");
TOPICS.forEach(T=>{IDX.push({k:"Chapter",t:`${T.num} · ${T.n}`,x:strip(T.lead),go:()=>go("review",{ch:T.k})});T.sec.forEach((s,i)=>{const x=strip(s.b.filter(b=>b.k!=="case").map(btext).join(" "));IDX.push({k:"Reviewer",t:`${T.num}.${i+1} ${s.t}`,x,go:()=>openSec(s.id)});});});
CODAL.forEach(a=>IDX.push({k:"Codal",t:`Art. ${a.a}. ${a.t}`,x:strip(a.p.join(" ").replace(/\[\[|\]\]/g,"")),go:()=>go("codal")}));
CASES.forEach(c=>IDX.push({k:"Case",t:c.n,x:strip([c.h,c.f,c.r,c.w,c.d,(c.k||[]).join(" ")].join(" ")),go:()=>openCase(c.id)}));
ELEMENTS.forEach(L=>IDX.push({k:"Elements",t:L.n,x:strip(L.i.join(" · ")),go:()=>go("codal")}));
ESSAYS.forEach(e=>IDX.push({k:"Samplex",t:e.set+" · "+e.src,x:strip(e.q+" "+e.a),go:()=>go("samplex",e.id)}));
V.search=(m,q)=>{
  q=(q||"").trim();const words=q.toLowerCase().split(/\s+/).filter(Boolean);
  const hits=words.length?IDX.filter(h=>words.every(w=>(h.t+" "+h.x).toLowerCase().includes(w))).slice(0,60):[];
  const snip=x=>{const i=Math.max(0,x.toLowerCase().indexOf(words[0]));const s=Math.max(0,i-70);let t=esc(x.slice(s,s+220));words.forEach(w=>{t=t.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"),mm=>`<mark>${mm}</mark>`);});return(s?"…":"")+t+"…";};
  m.innerHTML=`<div class="cd-card"><h2 style="margin:0 0 6px">Search</h2><div class="cd-muted">${hits.length} result${hits.length===1?"":"s"} for “${esc(q)}”</div>${hits.map((h,i)=>`<div class="sr-hit" data-i="${i}"><span class="hk hk-b" style="margin:0 6px 0 0">${h.k}</span><b>${esc(h.t)}</b><div class="cd-muted" style="font-size:.9rem">${snip(h.x)}</div></div>`).join("")}</div>`;
  m.onclick=e=>{const h=e.target.closest("[data-i]");if(h)hits[+h.dataset.i].go();};
};

// ---------- boot ----------
function theme(t){if(t)document.documentElement.setAttribute("data-theme",t);else document.documentElement.removeAttribute("data-theme");store.set("theme",t||"");}
theme(store.get("theme",""));
$("#theme").onclick=()=>{const cur=document.documentElement.getAttribute("data-theme");const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme: dark)").matches;theme(dark?"light":"dark");};
$$(".cd-tab").forEach(b=>b.onclick=()=>go(b.dataset.tab));
const sIn=$("#search");let st;sIn.oninput=()=>{clearTimeout(st);st=setTimeout(()=>{if(sIn.value.trim().length>1)go("search",sIn.value);},250);};sIn.onkeydown=e=>{if(e.key==="Enter")go("search",sIn.value);};
const tick=()=>{$("#count").innerHTML=countdown();};tick();setInterval(tick,30000);
go(V[tab]&&tab!=="search"?tab:"today");
})();
</script>
</body>
