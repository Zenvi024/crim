 P("Reyes divides the acts of execution into two phases. The <b>subjective phase</b> runs from the start of the acts to the point where the offender still has <b>control</b> over his acts, including their natural course. The <b>objective phase</b> is the result: everything after he has lost control."),
 EX("The poison illustration","A mixes poison into B's soup and B begins to raise a spoonful. Until B swallows, A can still stop it by telling B to spit it out: subjective phase. Once B swallows, A has lost control; only a doctor can prevent death. If the doctor saves B, it is <b>frustrated</b> murder: the acts passed from the subjective to the objective phase."),
 K("★ The test","Interrupted in the <b>subjective</b> phase (not by desistance) → <b>attempted</b>. Subjective phase <b>complete</b>, but the felony is not produced for causes independent of the will → <b>frustrated</b>. Felony produced → <b>consummated</b>.")),
S("a6-6","Frustrated felony",
 RQ("Elements of a frustrated felony",[["The offender performs all the acts of execution","Nothing more is left for him to do; he performed the last act needed."],["All the acts performed would produce the felony as a consequence","The acts were capable of producing it."],["But the felony is not produced",""],["By reason of causes independent of the will of the perpetrator","e.g., timely medical help."]]),
 P("In homicide and murder, the question is when the offender has performed <b>all</b> the acts of execution. The cases have used two approaches:"),
 DS("Two approaches to frustrated homicide","<b>The belief of the accused</b>: in <i>Eduave</i> and <i>Dagman</i> (the victim “played possum”), the accused believed he had killed, so the subjective phase was complete and the crime was frustrated. In <i>Sy Pio</i>, he saw the victim escape, so he knew he had not finished: attempted. <b>The nature of the wound (now the controlling test)</b>: what matters is whether the acts would produce death, which in crimes against persons requires a <b>mortal wound</b>. Mortal wound + survival due to medical help → frustrated. No wound or a non-mortal wound → attempted."),
 V("woundladder"),
 C("eduave","The classic frustrated murder: a deep bolo wound, and he believed she was dead."),
 C("sypio","Attempted, not frustrated: the victim ran and hid, and the shoulder wound was not fatal."),
 C("borinaga","A split Court: the knife hit only the chair. The majority said frustrated; the dissent, attempted (today's view)."),
 C("kalalo","Four shots that missed show intent to kill, so attempted homicide."),
 C("ravelo","No proven intent to kill → not attempted or frustrated murder, only slight physical injuries."),
 DS("Frustrated vs. attempted","In a <b>frustrated</b> felony, the offender has reached the <b>objective</b> phase; no foreign cause intervened between the start and the performance of the last act. In an <b>attempted</b> felony, he never passed the <b>subjective</b> phase; some cause stopped him short.")),
S("a6-7","Consummated felony, and when an element is missing",
 P("A felony is consummated when <b>all the elements</b> necessary for its execution and accomplishment are present. Each crime has its own elements, so to tell the stage you must know what the crime requires."),
 P("When one element is not proven, three things can happen. (1) The felony is <b>not consummated</b>: no death, so homicide is only attempted or frustrated. (2) The felony is <b>not committed at all</b>: no intent to gain, so there is no theft; no deceit, so there is no estafa (only civil liability). (3) <b>Another felony</b> is shown: robbery with violence without intent to gain becomes grave coercion; forcible abduction without lewd designs becomes kidnapping.")),
S("a6-8","Finding the stage: nature, elements and manner",
 P("Reyes says the stage depends on (1) the <b>nature</b> of the offense, (2) its <b>elements</b>, and (3) the <b>manner</b> of committing it. This is where most problems are decided:"),
 V("crimestages"),
 P("<b>Theft.</b> Theft is consummated by the <b>taking</b>; carrying the thing away or being able to dispose of it is not required. Older Court of Appeals cases (<i>Diño</i>, cited in Reyes) found “frustrated theft” when thieves were caught at a checkpoint. <mark><i>Valenzuela</i> (2007, en banc) abandoned that: there is no frustrated theft.</mark>"),
 C("adiao","Theft consummated once the belt was taken and hidden in his desk."),
 C("valenzuela","No frustrated theft: possession gained = consummated, even if caught in the parking lot."),
 P("<b>Estafa</b> is consummated only when the victim is actually <b>damaged</b>. A salesman who pocketed ₱7.50 meant for the cashier but was caught at once committed <b>frustrated</b> estafa (<i>Dominguez</i>). This is why theft and estafa come out differently on similar facts: their elements differ."),
 P("<b>Robbery.</b> With force upon things (breaking into a building), the offender must <b>carry the thing out</b> of the building; thieves caught passing a sack of sugar through the hole in the bodega floor committed frustrated robbery. With violence or intimidation against persons, it is consummated the moment the offender <b>gains possession</b>."),
 C("salvilla","Robbery with intimidation: consummated once they had the loot, even though they never got away."),
 C("lamahang","Robbery requires a shown intent to take property; without it, only attempted trespass."),
 P("<b>Rape</b> is consummated by carnal knowledge, and any penetration of the labia suffices, so it has no frustrated stage."),
 C("orita","There is no frustrated rape."),
 C("campuhan","Touching the external genitalia without reaching the labia (a “mere strafing of the citadel”) is attempted rape."),
 C("agao","The 2022 refinement of Campuhan for child victims."),
 P("<b>Arson</b> is consummated once any part of the building is burned, however small; setting fire to kerosene-soaked rags placed against a wall with no part of the house burned is not consummated. <b>Manner</b>: <b>formal crimes</b> (slander, false testimony) are consummated in one act and have no attempt; some crimes are consummated by <b>mere attempt or proposal</b> (flight to an enemy country, corruption of minors); crimes by <b>omission</b> have no attempt; crimes needing <b>two parties</b> (betting, bribery) are consummated by agreement, so a rejected offer is an attempt. <b>Material crimes</b> (homicide, rape) have all three stages."),
 TR("Classic stage traps","“Frustrated theft” and “frustrated rape” do not exist. Physical injuries have no attempted or frustrated stage (2017 Bar). Pouring gasoline and lighting a match, caught before any fire → <b>attempted</b> arson (2019 Bar). There is no attempted or frustrated impossible crime."))
],[
 G("g-stage"),
 EXAM("“A felony is frustrated when the offender performs all the acts of execution that would produce it, but it is not produced for causes independent of his will; it is attempted when he commences it directly by overt acts but does not perform all the acts of execution, for a cause other than his own spontaneous desistance (Art. 6). In homicide, frustration requires that the subjective phase be complete, as with a mortal wound the victim survives only through medical help (U.S. v. Eduave); where the victim visibly escapes with a non-fatal wound, it is attempted (People v. Sy Pio).”"),
 DR([["Sy Pio, but Tan fell and lay still, and Sy Pio walked off believing him dead (with a mortal chest wound).","Subjective phase complete → frustrated murder (as in Eduave)."],["Eduave, but he stopped after a shallow cut and walked away of his own accord.","Spontaneous desistance → no attempted murder, but liable for the physical injuries inflicted."],["Valenzuela, but caught inside the store with the Tide still on the pushcart.","Still consummated: the taking was complete once he gained possession with intent to gain."],["Lamahang, but in his statement he says he wanted to rob the store.","Still judged by the nature of the acts; the admission alone does not make the robbery attempt determinate."],["Campuhan, but the medical exam shows a fresh laceration of the labia.","Consummated (statutory) rape."]])
]);
})();

(()=>{const {CH,S,P,K,TR,DS,EX,C,V,CO,RQ,UL,TB,EXAM,DR,G}=window.RH;

// ═══════════════════════ 8 · ART. 7 ═══════════════════════
CH("a7","9","Art. 7 · Light felonies","When they are punishable",
"A short article with a clear rule and one exception. Learn what a light felony is (Art. 9), why only consummated ones are punished, and why those against <b>persons or property</b> are different.",
["State the rule, the exception and the reason for each","Give examples of light felonies"],
[
S("a7-1","The provision and the rule",CO("7"),
 P("<b>Light felonies</b> are those punished by <b>arresto menor or a fine not exceeding ₱40,000</b>, or both (Art. 9, as amended by RA 10951)."),
 RQ("Rule and exception",[["General rule: punishable only when consummated","The harm is so slight that public conscience is satisfied by punishing only the completed act; an unfinished one does not need a penalty (Albert)."],["Exception: light felonies against persons or property are punishable even if attempted or frustrated","These show <b>moral depravity</b> in the offender, so even an unfinished attempt deserves punishment."]])),
S("a7-2","Examples",
 UL(["<b>Against persons</b>: slight physical injuries and maltreatment (Art. 266).","<b>Against property</b>: theft where the value is small and the offender was moved by hunger, poverty or difficulty in earning a living, or theft by hunting or gathering on enclosed land (Art. 309(7), (8)); alteration of boundary marks (Art. 313); malicious mischief of small value (Arts. 328(3), 329(3)).","<b>Others</b> (punished only when consummated): intriguing against honor, alarms and scandals, light threats, light coercion, slander by deed (not serious), disobedience to an agent of a person in authority, concealing one's true name, other forms of trespass."]),
 K("Linked rule: no accessories","For light felonies, only <b>principals and accomplices</b> are liable; accessories are not (Art. 16)."))
],[EXAM("“Under Art. 7, light felonies are punishable only when consummated, except those committed against persons or property, which are punishable even when attempted or frustrated.”")]);

// ═══════════════════════ 9 · ART. 8 ═══════════════════════
CH("a8","10","Art. 8 · Conspiracy and proposal","As crimes in themselves, and as a mode of liability",
"Art. 8 defines conspiracy and proposal and says they are crimes <b>only when a law specifically punishes them</b>. But conspiracy has a second life: when the crime is actually committed, it becomes the reason why <b>the act of one is the act of all</b>. Keep the two apart.",
["Recite which conspiracies and proposals are punishable","Explain each requisite of conspiracy and of proposal","Distinguish conspiracy as a felony from conspiracy as a mode of liability, and know the proof required"],
[
S("a8-1","The provision and the general rule",CO("8"),
 P("Conspiracy and proposal are <b>preparatory acts</b>. As long as conspirators do no overt act, Reyes says, “the sovereignty of the State is not outraged and the tranquility of the public remains undisturbed.” So the <b>general rule</b> is that they are <b>not punishable</b>. The <b>exception</b> is where a law specifically punishes them. There is <b>no common-law crime of conspiracy</b> in the Philippines."),
 V("conspiracy"),
 TB(["Felony","Conspiracy punished?","Proposal punished?"],[["Treason (Art. 115)","Yes","Yes"],["Coup d'état, rebellion, insurrection (Art. 136)","Yes","Yes"],["Sedition (Art. 141)","Yes","<b>No</b> (only inciting to sedition, Art. 142)"],["Monopolies and combinations in restraint of trade (Art. 186)","Yes","No"],["Murder, robbery, kidnapping, etc.","No","No"]]),
 P("Some special laws also punish conspiracy itself, e.g., conspiracy to commit offenses under the Comprehensive Dangerous Drugs Act.")),
S("a8-2","Requisites of conspiracy",
 RQ("Conspiracy (Art. 8, Reyes)",[["Two or more persons came to an agreement","A <b>meeting of the minds</b>. A commission found in the accused's papers proves nothing if he never accepted it."],["The agreement concerned the commission of a felony","An agreement to act, not mere discontent; airing complaints against the government is not conspiracy."],["The execution of the felony was decided upon","The conspirators have made up their minds; they are determined to commit it."]]),
 K("The crime must NOT have been committed","Conspiracy is a separate felony only when the crime agreed upon is <b>not</b> carried out. If the conspirators go on to commit treason or rebellion, they are liable for that crime, and the conspiracy becomes merely the <b>manner</b> of incurring liability.")),
S("a8-3","Conspiracy as a mode of liability",
 P("When a felony is actually committed by several people acting on a common plan, conspiracy makes <mark>the act of one the act of all</mark>. Each conspirator is a co-principal, whatever his share in the execution, because the law treats every act as done by all."),
 UL(["<b>Direct proof is not needed.</b> Conspiracy may be <b>inferred</b> from the acts of the accused before, during and after the crime showing a joint purpose, concerted action and a community of interest (<b>implied conspiracy</b>).","<b>But it must be proven beyond reasonable doubt</b>, as clearly as the crime itself, with evidence of actual cooperation, not mere knowledge or approval.","<b>Mere presence</b> at the scene, or a close relationship with the offender, is not conspiracy; “conspiracy transcends companionship.”"]),
 C("iligan","Co-accused Asis was acquitted: mere presence at the scene does not make one a conspirator."),
 EX("Desistance among conspirators","A conspirator who withdraws <b>before any overt act</b> is not liable for the crime agreed upon (though he may still be liable for the conspiracy itself where that is punishable).")),
S("a8-4","Proposal",
 RQ("Requisites of proposal",[["A person has decided to commit a felony","The proponent himself is determined."],["He proposes its execution to some other person or persons","A decided, concrete and formal proposal."]]),
 P("A proposal need not be <b>accepted</b> to be punishable (where the law punishes it). If it is accepted, the parties are conspirators. If the crime is then committed because of the proposal, the proponent is a <b>principal by inducement</b> and the proposal is absorbed."),
 RQ("There is NO criminal proposal when",[["The proponent has not decided to commit the felony","e.g., he wants the government overthrown but is afraid to act, and suggests it to others."],["There is no decided, concrete and formal proposal","A mere suggestion is not enough."],["What is proposed is not the execution of the felony","e.g., instructing followers to organize groups and spread propaganda: that proposes preparatory acts, not rebellion itself."]]),
 TR("Two exam patterns","(1) A <b>proposal to kill</b> someone, refused and reported, is not punishable (no law penalizes a proposal to commit murder), and it is not attempted murder either (Art. 6 requires a direct overt act). (2) A <b>conspiracy formed abroad</b> to commit coup d'état: Art. 136 punishes it, but coup d'état is not in Art. 2(5), so territoriality bars prosecution here unless acts of the conspiracy were done here (San Beda Q5)."))
],[
 EXAM("“Under Art. 8, conspiracy and proposal are punishable only when the law specially provides a penalty, as in treason, rebellion, coup d'état and sedition. When the felony is actually committed, conspiracy is not a separate crime but a mode of incurring liability: the act of one is the act of all. It must be proven beyond reasonable doubt, and mere presence at the scene is not enough (People v. Iligan).”")
]);

// ═══════════════════════ 10 · ART. 9 ═══════════════════════
CH("a9","11","Art. 9 · Grave, less grave, light","Classifying felonies by their penalty",
"Art. 9 sorts felonies by gravity, and gravity is read from the <b>penalty</b>, using the scale in Art. 25. The classification matters elsewhere: complex crimes, light felonies, accessories, and prescription.",
["Classify a felony from its penalty, including divided and compound penalties","Resolve the ₱40,000 conflict between Arts. 9 and 26"],
[
S("a9-1","The provision",CO("9"),V("gravity")),
S("a9-2","Reading the penalty",
 RQ("How to classify",[["Grave","The capital penalty, or a penalty that is afflictive <b>in any of its periods</b>."],["Less grave","A penalty that is correctional <b>in its maximum period</b>."],["Light","Arresto menor, a fine not exceeding ₱40,000, or both."]]),
 P("“Any of their periods” sounds loose, but Reyes explains what it means: when the penalty combines <b>two or more penalties or periods</b>, look at the <b>higher</b> one. Prisión correccional to prisión mayor → the higher, prisión mayor, is afflictive → <b>grave</b>. Prisión correccional maximum to prisión mayor minimum → <b>grave</b>. Arresto menor to destierro → the higher, destierro, is correctional → <b>less grave</b>."),
 TR("₱40,000 exactly","Art. 26 (as amended by RA 10951) calls a fine of ₱40,000 to ₱1,200,000 correctional, but Art. 9 says a felony with a fine <b>not exceeding</b> ₱40,000 is light. For <b>classifying felonies</b>, <mark>Art. 9 prevails</mark>; Art. 26 classifies fines (e.g., for prescription of the penalty). So a felony punished by a ₱40,000 fine is a light felony."),
 K("Why the classification matters","Art. 48 complex crimes involve grave or less grave felonies; Art. 7 applies to light felonies; Art. 16 excludes accessories from light felonies; and prescription periods depend on the gravity."))
],[EXAM("“Under Art. 9, grave felonies carry the capital penalty or penalties afflictive in any of their periods; less grave felonies, penalties correctional in their maximum period; light felonies, arresto menor or a fine not exceeding ₱40,000, or both.”")]);

// ═══════════════════════ 11 · ART. 10 ═══════════════════════
CH("a10","12","Art. 10 · Special laws","The RPC as a supplement",
"Special penal laws (drugs, firearms, BP 22, RA 9262) stand on their own. Art. 10 says they are not governed by the RPC, but the RPC fills their gaps <b>unless the special law says otherwise</b>.",
["Explain the two clauses and how they are reconciled","Know which RPC rules do and do not apply to special laws"],
[
S("a10-1","The provision and its two clauses",CO("10"),
 P("A <b>special law</b> is a penal statute that punishes acts not defined and penalized by the RPC (<i>U.S. v. Serapio</i>), and that is not an amendment of the RPC."),
 RQ("The two clauses, reconciled",[["“Not subject to the provisions of this Code”","Only means the RPC does not supersede special laws: special laws control the offenses they punish (special law prevails over general law)."],["“This Code shall be supplementary to such laws”","“The soul of the article”: RPC provisions fill gaps in special laws, unless the special law provides otherwise (<i>Ladonga v. People</i>: Art. 8 conspiracy applied to BP 22)."]])),
S("a10-2","What carries over and what does not",
 V("speciallaw"),
 P("Because special laws usually prescribe penalties in years (“5 to 10 years”) rather than RPC penalties with periods and degrees, the RPC rules that depend on the <b>scale of penalties</b> generally <b>cannot</b> apply: penalties for attempted and frustrated stages (Arts. 50–57), accomplices and accessories, and mitigating and aggravating circumstances (Arts. 13, 14, 64). So <mark>an attempt or frustration of an offense under a special law is not punishable unless the special law itself provides a penalty for it</mark>. Courts use “imprisonment,” not “prisión correccional,” for these penalties."),
 K("The exception: special laws using RPC nomenclature","When a special law <b>adopts the RPC's penalties</b> (e.g., reclusion perpetua, prisión mayor), as many amended laws now do, the RPC rules on graduating penalties and on modifying circumstances apply (<i>People v. Simon</i>)."),
 EX("Attempt punished by the special law itself","A passenger about to board a plane with four gold bars strapped to his body was convicted under the Central Bank rule penalizing “any person desiring to export gold” without a license. The rule itself covered the stage before actual export, so the attempt was punishable.")),
S("a10-3","Intent in special-law offenses",
 P("Crimes under special laws are generally <b>mala prohibita</b>: criminal intent and good faith are immaterial; what matters is the <b>intent to perpetrate the prohibited act</b> (Chapter 4, <i>Bayona</i>)."),
 TR("Possession offenses still need animus possidendi","Illegal possession of a firearm is malum prohibitum, but possession requires the <b>intent to possess</b>. A guard carrying an agency-issued firearm on the way to return it holds it incidentally to his duty (San Beda Q2)."))
],[EXAM("“Under Art. 10, offenses under special laws are governed by those laws, but the RPC applies suppletorily unless the special law provides otherwise (Ladonga v. People). Unless the special law adopts RPC penalties, its attempted and frustrated stages are not punishable unless it provides for them.”")]);

// ═══════════════════════ 12 · ART. 11 ═══════════════════════
CH("a11","13","Art. 11 · Justifying circumstances","When the act itself is lawful",
"Art. 11 lists six situations in which a person who causes harm <b>commits no crime at all</b>: self-defense, defense of relatives, defense of strangers, avoidance of a greater evil, fulfillment of duty, and obedience to an order. Twenty of your syllabus cases are here. Everything turns on the <b>requisites</b>, especially <b>unlawful aggression</b>.",
["Explain why justified acts carry no criminal (and usually no civil) liability","Explain every requisite of each paragraph, with its cases","Apply incomplete justification (Art. 69 / Art. 13(1))","Recognize the facts that defeat a self-defense claim"],
[
S("a11-0","The provision",CO("11")),
S("a11-1","What “justified” means",
 P("A justified act is <mark>in accordance with law</mark>, so the actor is deemed not to have violated it. There is <b>no crime and no criminal</b>. That is why the article says the actors “do not incur any criminal liability,” and why there is generally <b>no civil liability</b> either (except under ¶4)."),
 V("justexempt"),
 K("Burden of proof","Pleading a justifying circumstance <b>admits the act</b>. The accused must then prove the justification by <b>clear and convincing evidence</b>, relying on the strength of his own evidence and not the weakness of the prosecution's."),
 DS("Imputability, responsibility, guilt","<b>Imputability</b>: the act may be ascribed to the person as its author (done freely and knowingly). <b>Responsibility</b>: the obligation to suffer the penal and civil consequences. <b>Guilt</b> is an element of responsibility. Justification removes the crime; exemption (Art. 12) removes responsibility for it.")),
S("a11-2","¶1 Self-defense: what it protects and why",
 CO("11",[1]),
 P("Self-defense covers the defense of one's <b>person or rights</b>: life, limb, <b>honor</b> (chastity), <b>property</b>, and <b>reputation</b>. Why is it lawful? The Classicists say the State cannot protect everyone at every moment, so it lets the individual repel unjust attacks; the Positivists say defense is an act of social justice. Either way, <mark>no one is required to submit to an unlawful attack</mark>."),
 RQ("Requisites of self-defense",[["Unlawful aggression","The indispensable requisite."],["Reasonable necessity of the means employed to prevent or repel it","Measured by rational equivalence."],["Lack of sufficient provocation on the part of the person defending himself","He must not have caused the attack."]])),
S("a11-3","Requisite 1 · Unlawful aggression",
 K("★ The sine qua non","Unlawful aggression is <b>indispensable</b>. Without it there is <b>no self-defense, complete or incomplete</b>; the other two requisites do not even arise. It is also required in defense of relatives and of strangers."),
 P("<b>Meaning.</b> Unlawful aggression is an <b>actual physical assault</b>, or at least a <b>threat to inflict real injury</b>. The danger must be to life or limb (or to another right being defended), and it must be <b>actual</b> (the attack is happening) or <b>imminent</b> (it is on the point of happening)."),
 V("aggression"),
 UL(["<b>Threats count only if offensive and positively strong</b>, showing a real intent to cause injury: aiming a revolver, drawing a knife and moving to attack, picking up a weapon after declaring an intent to use it. A <b>mere threatening or intimidating attitude</b> is not aggression; nor are insulting words (<i>Carrero</i>), a hand placed in a pocket, or a light push on the head.","<b>A slap on the face is</b> unlawful aggression, because it attacks one's dignity (<i>Roxas</i>).","<b>The aggression must be real, not imaginary</b>; the mere belief in an impending attack is not enough. But an honest belief based on how things reasonably appeared is judged from the defender's point of view (a toy gun that looks real; cf. <i>Ah Chong</i>).","<b>It must be unlawful.</b> A lawful arrest or lawful force by an officer is not unlawful aggression; neither is the owner's defense of her property against a thief (2019 Bar).","<b>Agreement to fight</b>: when two parties agree to fight, the aggression is reciprocal and neither can claim self-defense, unless one attacks before the agreed time and place. One who voluntarily joins a fight cannot claim self-defense.","<b>No duty to retreat</b>: the rule is “stand ground when in the right.” A person unlawfully attacked need not run away."]),
 C("boholst","Choking is unlawful aggression; the wife who grabbed the husband's own knife was fully justified."),
 K("★ It must still exist when the defense is made","When the aggressor <b>flees</b>, is <b>disarmed</b>, or <b>stops</b>, the aggression ceases, and anything done afterward is <b>retaliation</b>, not defense. But if the aggressor retreats only to get a <b>better position</b> or a weapon, the aggression continues."),
 C("alconga","Two stages: self-defense while the deceased attacked; homicide once he fled and Alconga chased him."),
 P("<b>Who was the aggressor?</b> Where evidence conflicts, courts look at who had the motive, the number and location of wounds, and the conduct of the parties after the incident.")),
S("a11-4","Unlawful aggression against honor, property and reputation",
 P("The “rights” in ¶1 include more than life and limb. The cases show how far each extends:"),
 P("<b>Honor (chastity).</b> An attempt to rape is unlawful aggression against honor, a right as precious as life, and a woman may kill if that is the only way to protect it. But the means must still be reasonable for the actual danger."),
 C("luague","Attempted rape at knifepoint in the kitchen: killing the attacker is justified."),
 C("delacruz","Grabbed from behind on a dark path and being thrown down: the knife is justified."),
 C("jaurigue","A hand on the thigh in a lighted, crowded chapel: aggression, yes, but stabbing the neck was excessive."),
 P("<b>Property.</b> Under the older rule, defense of property justifies force only when the attack on property is coupled with an <b>attack on the person</b> guarding it. Civil Code Art. 429 now lets an owner use <b>reasonably necessary force</b> to repel an actual or threatened unlawful invasion of his property, but killing to save property is rarely reasonable."),
 C("apolinar","Shooting a fleeing palay thief is not justified: no attack on the person."),
 C("bumanglag","The sheathed bolo disproves the claimed aggression."),
 C("narvaez","An attack on property rights is aggression, but shotgun fire is disproportionate: incomplete defense."),
 P("<b>Reputation.</b> A person defamed may defend his good name. Unlike a physical attack, the sting of a libel stays after it is made, so a reply to it is still defense. But the reply must be <b>adequate</b> to repair the damage, not a new attack on another subject."),
 C("chuahiong","An adequate libelous reply to a libel is justified."),
 C("pelayo","Answering with an unrelated accusation (bribery) is a new defamation, not defense.")),
S("a11-5","Requisite 2 · Reasonable necessity of the means employed",
 P("This requisite presupposes aggression: “<b>prevent</b>” refers to imminent aggression and “<b>repel</b>” to actual aggression. Reyes splits it into two questions:"),
 RQ("Two necessities",[["Necessity of the course of action","Was any defensive action still needed? None, if the aggressor had fled, was lying down, or had been disarmed."],["Necessity of the means used","Was this weapon or force reasonable against this attack?"]]),
 K("★ Rational equivalence, not material equality","The law does not require the defender's weapon to match the aggressor's. It asks whether the means were <b>reasonable</b> given the <b>nature and quality of the weapons</b>, the <b>physical condition, size and character</b> of the parties, the <b>number</b> of attackers, and the <b>place and occasion</b>. Fists against fists between equals; but a knife can be reasonable for a smaller man cornered by several bigger attackers."),
 V("equivalence"),
 UL(["The person defending <b>is not expected to control his blow</b> or to aim at a non-vital part; in the heat of the moment he cannot coolly weigh his response (<i>Mack</i>).","Necessity is judged by the <b>imminent danger</b> as it reasonably appeared, not by the harm actually done (<i>Boholst-Caballero</i>).","Peace officers must stand their ground and overcome the aggressor; they are not expected to retreat."]),
 C("mack","A revolver against an advancing bolo at a few feet: reasonable, even at a vital part."),
 C("sumicad","A bolo against a bigger, stronger bully who had cornered him and was trying to wrest it away: reasonable."),
 TR("Evidence that defeats the claim","The <b>number, location and seriousness</b> of the wounds (many stab wounds, wounds in the back); the improbability of the deceased being the aggressor; failure to tell the police at once about self-defense; and <b>flight</b> (incompatible with self-defense).")),
S("a11-6","Requisite 3 · Lack of sufficient provocation",
 P("The defender must not have <b>caused</b> the attack by his own unjust conduct. The reason is simple: one who provokes an attack shares the blame for it."),
 RQ("The third requisite is PRESENT when",[["No provocation at all was given",""],["Provocation was given, but it was not sufficient",""],["It was sufficient, but it was not given by the person defending himself",""],["It was given by the defender, but it was not proximate and immediate to the aggression",""]]),
 P("<b>Sufficient</b> provocation is provocation <b>proportionate</b> to the aggression and <b>adequate</b> to stir the aggressor to commit it. Asking a neighbor why he is fencing your land is the exercise of a right, not provocation. Challenging someone to a fight, or hurling serious insults, can be sufficient.")),
S("a11-7","Battered Woman Syndrome",
 P("BWS describes a pattern of psychological and behavioral symptoms in women living in battering relationships. It explains why a woman may act against her batterer even when he is not attacking her at that moment."),
 V("bws"),
 C("genosa","Recognized BWS but required proof of the full cycle twice; no unlawful aggression at the time of the killing."),
 K("RA 9262 § 26 changed the result","A woman found by the court to suffer from BWS incurs <b>no criminal and no civil liability</b>, even if the requisites of self-defense are absent. Psychiatrists and psychologists help the court in deciding this.")),
S("a11-8","¶2 Defense of relatives",
 CO("11",[2]),
 P("The basis is humanitarian sentiment: the <b>impulse of blood</b> that makes people rush to save those close to them in great danger."),
 RQ("Requisites",[["Unlawful aggression","Can rest on the honest belief of the one making the defense (<i>Esmedia</i>)."],["Reasonable necessity of the means employed","Judged as the situation appeared to the defender."],["If the relative attacked gave provocation, the defender had no part in it","“In case” means “in the event that”: the relative's own provocation is immaterial if the defender was not involved."]]),
 V("relatives"),
 C("esmedia","Seeing their father down in the mud with the attacker standing over him, the sons reasonably believed he would strike again."),
 TR("The in-law cousin","Relatives by affinity are covered only “in the same degrees” (ascendants, descendants, siblings). A <b>wife's first cousin</b> is not a relative under ¶2, so defending him is defense of a stranger (2016 Bar).")),
S("a11-9","¶3 Defense of a stranger",
 CO("11",[3]),
 P("What a person may do to defend himself, another may do for him; the law does not expect people to stand idly by while someone is killed. A <b>stranger</b> is anyone not listed in ¶2, even a best friend or a distant relative."),
 RQ("Requisites",[["Unlawful aggression",""],["Reasonable necessity of the means employed",""],["The person defending was not induced by revenge, resentment or other evil motive","The defender must act from a disinterested or generous motive."]]),
 K("“Be not induced”","A defender who has a <b>grudge</b> against the aggressor can still invoke ¶3, as long as the grudge was not what <b>induced</b> him to act, i.e., the generous motive to save the stranger actually moved him (San Beda Q1: Ric, Leo and Morty).")),
S("a11-10","¶4 Avoidance of a greater evil (state of necessity)",
 CO("11",[4]),
 RQ("Requisites",[["The evil sought to be avoided actually exists","Not merely expected or anticipated; it must be real and imminent."],["The injury feared is greater than that done to avoid it","Compare the two evils objectively. Self-preservation makes one's own safety weigh more heavily."],["There is no other practical and less harmful means of preventing it",""]]),
 V("necessity"),
 P("The evil must not be brought about by the actor's own <b>negligence or violation of law</b>; a speeding driver cannot invoke ¶4 for the danger he himself caused. “Damage to another” includes injury to <b>persons, property and honor</b>. Classic examples: pulling down a burning house to stop a fire from spreading; throwing cargo overboard to save a ship; a doctor sacrificing a fetus to save the mother's life."),
 C("normahernandez","Escaping a loveless marriage is avoiding a greater evil; the damage to honor is justified."),
 C("dudley","A life for a life is not avoiding a greater evil."),
 C("ty","No actual evil, other means available, and the danger was of her own making."),
 K("★ The only paragraph with civil liability","Under Art. 101, the persons <b>benefited</b> by the act pay for the damage, in proportion to the benefit each received. Grappling with a victim's son to stop him from shooting the attackers is not avoiding an evil, because the son's defense of his father was lawful (2004 Bar).")),
S("a11-11","¶5 Fulfillment of duty; lawful exercise of a right or office",
 CO("11",[5]),
 RQ("Requisites",[["The accused acted in the performance of a duty or in the lawful exercise of a right or office",""],["The injury caused or the offense committed is the necessary consequence of the due performance of the duty or the lawful exercise of the right or office",""]]),
 P("Unlike self-defense, ¶5 <b>does not require unlawful aggression</b>. A police officer may use the force <b>reasonably necessary</b> to arrest, to overcome resistance or to prevent escape, but never unnecessary force or deadly means when the arrest could be made otherwise. Shooting an offender who resists or flees with a weapon after refusing to surrender is justified; shooting a petty thief who merely runs away is not."),
 C("delima","A policeman who kills an armed escapee who resisted recapture is justified, though self-defense would fail."),
 C("belbes","On duty, but firing an armalite without warning was not the necessary consequence of keeping order: incomplete."),
 C("oanis","On duty, but killing a sleeping man without verifying his identity: incomplete, so a privileged mitigating circumstance."),
 P("<b>Lawful exercise of a right</b> includes the owner's right under Civil Code Art. 429 to use reasonable force to repel an actual or threatened unlawful invasion of his property; unlawful aggression is not required, but the force must be reasonable. <b>Office</b>: an executioner carrying out a death sentence; a surgeon who amputates to save a life.")),
S("a11-12","¶6 Obedience to an order of a superior",
 CO("11",[6]),
 RQ("Requisites",[["An order has been issued by a superior",""],["The order is for some lawful purpose",""],["The means used by the subordinate to carry out the order are lawful",""]]),
 P("Both the superior and the subordinate must act within the law. A subordinate who obeys an order that is <b>illegal on its face</b> is liable (a soldier torturing a man on his sergeant's order). But a subordinate who obeys in <b>good faith</b>, unaware that the order is illegal and without negligence, acts without criminal intent."),
 C("beronilla","Good-faith obedience to wartime superiors' orders: no criminal intent, so acquitted.")),
S("a11-13","When the justification is incomplete",
 V("sdmeter"),
 P("If not all the requisites are present, the act is not justified, but the law reduces the penalty. <b>Unlawful aggression must be present</b> for any reduction based on self-defense. With unlawful aggression and the <b>majority</b> of the remaining requisites, there is a <b>privileged mitigating circumstance</b>: the penalty is lowered by one or two degrees (Art. 69). With fewer, there is an <b>ordinary</b> mitigating circumstance (Art. 13(1)). For ¶5, if only the first requisite is present (on duty, but the injury was not a necessary consequence), it is privileged mitigating (<i>Oanis</i>, <i>Belbes</i>).")
)
],[
 G("g-sd"),
 EXAM("“Self-defense requires (1) unlawful aggression, (2) reasonable necessity of the means employed to prevent or repel it, and (3) lack of sufficient provocation on the part of the defender (Art. 11(1)). Unlawful aggression is indispensable; it must be actual or imminent and must still exist when the defense is made. Once the aggressor flees, it ceases, and what follows is retaliation (People v. Alconga).”"),
 DR([["Alconga, but the fleeing aggressor runs to his jeep for a gun.","Aggression continues (retreat for a better position), so pursuit is allowed."],["Boholst-Caballero, but the husband had let go and walked away.","Aggression ceased; the stabbing is retaliation."],["Jaurigue, but on a dark, deserted path.","Like De la Cruz: complete defense of honor is likely."],["Apolinar, but the thief swings a bolo at the owner.","Unlawful aggression against the person, so the shooting can be justified."],["Delima, but Napilon had raised his hands to surrender.","Not a necessary consequence of duty → homicide (cf. Oanis)."],["Beronilla, but he had received the radiogram questioning the trial.","Good faith is gone → murder."],["Dudley and Stephens in the Philippines.","¶4 fails: a life for a life is not a greater evil."]])
]);

// Samplex. Essays: id, set, src, t (topics), q, iss (issues to spot), a (model answer, IRAC/CLEAR), c (back-page CLEAR line).

window.ESSAYS = [
// ── SAN BEDA 2019 MIDTERM (essay part; Q3 is on penalties, outside your coverage) ──
{id:"sb1",set:"San Beda 2019 midterm",src:"San Beda Alabang, Crim 1 Midterm (Frias), Q1 (10 pts)",t:["a11"],
q:"Ric was at a party when he saw his friend Morty on the ground screaming for help because Leo was on top of him and about to stab him. Ric and Leo had a long-standing grudge (Leo had kissed Ric's girlfriend). Ric thought, “Two birds with one stone: I save Morty and get revenge on Leo,” and stabbed Leo in the back, killing him. At trial, it turned out Morty was Ric's long-lost brother. You are Ric's lawyer. Present your defense.",
iss:["Defense of a relative (¶2) vs. a stranger (¶3)","Third requisite of ¶3: 'induced' by evil motive","¶2 has no motive requirement","Honest belief; reasonable means (stab in the back vs. an armed attacker on top)"],
a:"<b>Defense: Ric acted in defense of a relative (Art. 11(2)), or at least of a stranger (Art. 11(3)).</b><br><br><b>Primary.</b> Morty is Ric's <b>brother</b>, a relative under ¶2. Defense of relatives requires only (1) unlawful aggression, (2) reasonable necessity of the means, and (3) if the relative gave provocation, that the defender had no part in it. ¶2 has <b>no requirement about the defender's motive</b>. (1) Leo was on top of Morty about to stab him: actual, imminent unlawful aggression. (2) Stabbing an armed attacker who is about to stab is a reasonable means under rational equivalence; Ric could not be expected to calculate his blow. (3) Ric gave no provocation. The defense is complete. The law looks at the objective situation, so the relationship justifies the act even though Ric did not know of it.<br><br><b>Alternative.</b> Even as a <b>stranger</b>, ¶3 bars the defense only if the defender was “<b>induced</b>” by revenge. A grudge does not defeat the defense if the defender also acted to save the victim; Ric's primary aim was to save Morty, who was in mortal danger. The revenge was incidental, not the inducing cause.",
c:"Defense of a relative needs no proof of good motive; even under ¶3, a grudge does not defeat the defense unless it was the inducing cause."},
{id:"sb2",set:"San Beda 2019 midterm",src:"San Beda, Q2 (10 pts)",t:["a10","a3"],
q:"Thomas, a security guard, was issued a firearm by his agency. His routine: get the firearm at the agency, go on duty, return it. One night, on his way back to the agency, he stopped to have dinner with a friend at a restaurant. A police officer saw the firearm protruding from his waist and asked for the license; it had none. Was the arrest valid? (Answer the criminal-law part: is there a crime?)",
iss:["Mala prohibita (Art. 10): intent immaterial","But animus possidendi required for possession","Possession incidental to duty / temporary, in transit"],
a:"<b>Criminal-law issue: illegal possession is malum prohibitum</b>, so good faith or lack of criminal intent is generally not a defense (Art. 10; special law). But possession offenses still require <b>animus possidendi</b>, the intent to possess. A guard carrying a firearm issued by his agency, in the course of returning it after duty, holds it <b>temporarily and incidentally to his duty</b>, not as his own. Jurisprudence has acquitted guards and employees in that situation. The dinner stop is a short, incidental deviation while still in transit to return the firearm. <b>Conclusion: no illegal possession on his part</b> (the agency may be liable for the unlicensed firearm). The arrest without a warrant is a criminal procedure question (an offense committed in the officer's presence), so its validity depends on whether a crime was being committed; on this view, it was not.",
c:"Malum prohibitum: intent is immaterial, but animus possidendi is still required; a guard returning an agency-issued firearm lacks it."},
{id:"sb4",set:"San Beda 2019 midterm",src:"San Beda, Q4 (10 pts)",t:["a3","a4a"],
q:"Tata had a fever; his doctor prescribed paracetamol. The pharmacist sold him three tablets. He took one and, an hour later, had a seizure and died. The autopsy showed the tablet was not paracetamol but a drug to which he was allergic. The pharmacist was charged with the death of Tata. Is the charge proper?",
iss:["No dolo: no intent → not Art. 4(1)","Culpa: negligence/imprudence (Art. 3; Art. 365)","Proximate cause"],
a:"<b>Proper only as reckless imprudence resulting in homicide</b>, not an intentional felony. Art. 4(1) requires an <b>intentional</b> felony; the pharmacist had no intent to harm. But a felony may be committed by <b>culpa</b> (Art. 3): the wrongful act results from imprudence or negligence. A pharmacist must use the highest degree of care in dispensing drugs; giving the wrong drug is a deficiency of action (imprudence) and of perception (negligence). Taking the tablet was the <b>proximate cause</b> of the seizure and death, with no efficient intervening cause. The charge should be reckless imprudence resulting in homicide under Art. 365.",
c:"No intent → no dolo, but culpa: the pharmacist's imprudence was the proximate cause → reckless imprudence resulting in homicide."},
{id:"sb5",set:"San Beda 2019 midterm",src:"San Beda, Q5 (10 pts)",t:["a8","a2"],
q:"During a convention in Hong Kong, General Li and other AFP officers agreed to stage a coup d'état against President Lee. Rio, one of them, informed the government. On arrival at NAIA, General Li and the others were arrested for conspiracy to commit coup d'état. Is the arrest proper?",
iss:["Art. 8: conspiracy punishable only when the law provides (Art. 136: yes)","Territoriality: conspiracy formed abroad","Art. 2(5) covers Title One only; coup d'état is Title Three"],
a:"<b>Not proper.</b> Conspiracy to commit coup d'état is punishable (Art. 136, as allowed by Art. 8). But penal laws are <b>territorial</b>: the conspiracy was formed and completed in <b>Hong Kong</b>. The RPC applies abroad only in the five cases in Art. 2. Coup d'état is a crime against <b>public order</b> (Title Three), not a crime against national security and the law of nations (Title One), so Art. 2(5) does not cover it. On arrival at NAIA they had committed no overt act in the Philippines. (Alternative: if the agreement is shown to have continued or been renewed here, the conspiracy would be committed here.)",
c:"Conspiracy to commit coup d'état is punishable (Art. 136), but one formed abroad is outside Art. 2 (Title Three, not Title One)."},
{id:"sb6",set:"San Beda 2019 midterm",src:"San Beda, Q6 (20 pts)",t:["a2","a4a","a11"],
q:"Jia, a Filipino, was sailing across the Atlantic on a Philippine-registered boat with her friend John. John called her corny; angry, Jia punched at him. John dodged and punched back; Jia fell off the boat and was eaten by a shark. Discuss Jia's and John's criminal liability.",
iss:["Jurisdiction: Art. 2(1), Philippine-registered vessel","Jia: attempted slight physical injuries (light felony against persons, Art. 7)","John: self-defense? Unlawful aggression; reasonable means (fist vs. fist)","Art. 4(1): natural consequence; shark as efficient intervening cause?","Praeter intentionem"],
a:"<b>Jurisdiction.</b> The boat is <b>Philippine-registered</b>, so the RPC applies even on the Atlantic (Art. 2(1)).<br><br><b>Jia</b>: she threw a punch that missed: <b>attempted slight physical injuries</b>. As a light felony <b>against persons</b>, it is punishable even if only attempted (Art. 7). Her criminal liability is extinguished by her death (Art. 89), so in practice she is not liable.<br><br><b>John: not liable (self-defense).</b> (1) Jia's punch was an actual physical assault: <b>unlawful aggression</b>. (2) A punch against a punch is a <b>reasonable means</b> (rational equivalence). (3) Calling her “corny” is not <b>sufficient</b> provocation; mere words that are not proportionate to an assault do not count. Since his act was justified, it was not a felony, and <b>Art. 4(1) cannot apply</b> to the death. <b>Alternatively</b>, if self-defense is rejected (e.g., the aggression had ceased when he struck back), the punch is an intentional felony and death by drowning or a shark after falling overboard is a natural consequence of a blow on a boat at sea (the shark being a danger inherent in the situation): homicide mitigated by praeter intentionem (Art. 13(3)), and arguably by provocation.",
c:"Art. 2(1) applies. John: unlawful aggression + reasonable means + no sufficient provocation → justified; with no felony, Art. 4(1) does not attach. Otherwise homicide with praeter intentionem."},

// ── PAST BAR (from your QUAMTO file; answers follow UPLC/Reyes) ──
{id:"b1",set:"Past bar",src:"2019, 2015 Bar",t:["a2"],
q:"Ms. M, a Malaysian, was aboard an Indonesian-registered vessel still docked at the port of Manila when she saw her enemy Ms. A, an Australian, and stabbed her in the neck from behind, killing her. Ms. M argues the RPC cannot apply because both are foreigners on a foreign vessel. Tenable?",iss:["Territoriality + generality","English rule"],
a:"<b>No.</b> Under the <b>territoriality</b> principle, the RPC applies to crimes committed within Philippine territory, including its ports and interior waters; under <b>generality</b>, it binds all who live or sojourn here regardless of citizenship. A killing aboard a foreign merchant vessel docked in Manila disturbs public order and is triable here under the English rule. The vessel's registry is irrelevant inside our territory. (The crime is murder, given treachery.)",c:"Territoriality + generality: a killing aboard a foreign merchant vessel docked in Manila is triable here."},
{id:"b2",set:"Past bar",src:"1994 Bar",t:["a2"],q:"Abe, married to Liza, married Connie in Singapore. Abe and Connie returned and lived together in Calamba, Laguna. Can Abe be prosecuted for bigamy?",iss:["Territoriality; Art. 2 exceptions do not cover bigamy"],
a:"<b>No.</b> Bigamy is consummated where the second marriage is celebrated: Singapore. It is not among the Art. 2 cases in which the RPC applies extraterritorially, so the general rule of territoriality governs. (Cohabitation here is not itself bigamy; concubinage may be explored.)",c:"Bigamy abroad is outside Art. 2 → territoriality controls → not triable."},
{id:"b3",set:"Past bar",src:"2014, 2009, 2004 Bar",t:["a4b"],q:"Puti, wanting to kill his roommate Pula, asked a veterinarian for poison “for a sick pet.” The vet gave him a non-toxic solution, which Puti mixed into Pula's food; Pula did not die. (a) What crime? (b) What if Pula got an upset stomach and was hospitalized for 10 days?",iss:["Ineffectual means","Another felony committed → liable for it"],
a:"<b>(a) Impossible crime</b> (of murder): with intent to kill, he used <b>ineffectual</b> means (Art. 4(2)). <b>(b) Less serious physical injuries.</b> An impossible crime exists only if the act does not constitute another felony; here the act produced injuries requiring 10 days of medical attendance, so he is liable for that felony.",c:"Non-toxic 'poison' = ineffectual means → impossible crime, unless injuries result, in which case he is liable for the physical injuries."},
{id:"b4",set:"Past bar",src:"1994 Bar",t:["a4b"],q:"JP, Aries and Randal, guided by Ella, fired their automatic weapons at Elsa's room at 10:00 p.m. Elsa was at a prayer meeting in another barangay. The RTC convicted them of attempted murder. Decide the appeal.",iss:["Intod"],
a:"<b>Set aside; impossible crime of murder</b> (<i>Intod v. CA</i>, on nearly identical facts). Their intent to kill was clear, and the act would have been murder, but it was factually impossible because Elsa was not in the room. Factual impossibility is inherent impossibility under Art. 4(2).",c:"Absent victim = physical impossibility = impossible crime (Intod)."},
{id:"b5",set:"Past bar",src:"2019 Bar",t:["a6"],q:"Mr. A poured gasoline on the walls of Mr. B's rest house and lit a match, but the caretaker caught him before he could set it on fire. He was charged with frustrated arson. Proper?",iss:["Attempted vs. frustrated"],
a:"<b>No; attempted arson.</b> He commenced the commission by overt acts (pouring gasoline, lighting a match) but did not perform all the acts of execution (setting the house on fire), because of a cause other than his own desistance (Art. 6).",c:"Interrupted before all the acts of execution were done → attempted."},
{id:"b6",set:"Past bar",src:"2022 Bar",t:["a6"],q:"A police officer found Sisa stabbing her 1-year-old child with a kitchen knife; he grabbed her and she threw down the knife. The child survived multiple stab wounds thanks to treatment. Sisa says it is only attempted parricide because she voluntarily desisted. Tenable?",iss:["Desistance only in attempt; not spontaneous","Frustrated if wounds mortal"],
a:"<b>No.</b> Desistance must be <b>spontaneous</b>; she dropped the knife only after the officer grabbed her. Desistance is also relevant only in the attempted stage. If the stab wounds were <b>mortal</b> and the child survived only because of timely medical help, she performed all the acts of execution: <b>frustrated parricide</b>. If the wounds were not mortal, it is attempted parricide, but not because of desistance.",c:"Desistance must be spontaneous and occur in the attempted stage; mortal wounds + medical help = frustrated."},
{id:"b7",set:"Past bar",src:"2020-21 Bar",t:["a4a"],q:"At an ECQ checkpoint, a resident angered by a barangay tanod's tone punched him on the head. The tanod fell, suffered a brain hemorrhage, and died. Charged with homicide, the resident argues he had no intent to kill. Tenable?",iss:["Art. 4(1)","Praeter intentionem"],
a:"<b>No.</b> Under Art. 4(1), one who commits a felony (the punch: physical injuries) is liable for its direct, natural and logical consequences, even if unintended. The fall and hemorrhage flowed directly from the blow. Lack of intent to kill only mitigates (Art. 13(3), praeter intentionem).",c:"Art. 4(1): liable for the death; no intent to kill → only Art. 13(3) mitigating."},
{id:"b8",set:"Past bar",src:"2019 Bar",t:["a11"],q:"Mr. R broke into Mrs. V's bedroom at night and stashed her cash and jewelry. Mrs. V woke, cocked a rifle and said “Stop or I will shoot you!” Mr. R lunged, wrested the gun away and shot her dead. May he invoke self-defense?",iss:["Unlawful aggression must be unlawful","Lawful defense of property is not aggression"],
a:"<b>No.</b> There was no <b>unlawful</b> aggression by Mrs. V: as owner, she was lawfully defending her property against a thief caught in the act. Mr. R was the unlawful aggressor. (Robbery with homicide.)",c:"A lawful defense of property is not unlawful aggression; the thief cannot claim self-defense."},
{id:"b9",set:"Past bar",src:"2000, 1998 Bar",t:["a11"],q:"Osang, asleep, let a man have intercourse with her thinking he was her husband. When he said “Salamat Osang” and left, she realized it was her neighbor Julio, grabbed a balisong and stabbed him to death. Defense of honor?",iss:["Aggression had ceased"],
a:"<b>No.</b> When she stabbed him, the act was over and he was leaving; the unlawful aggression had ceased. What she did was retaliation, not defense. She may invoke mitigating circumstances (immediate vindication of a grave offense; passion or obfuscation).",c:"Aggression had ceased → no defense of honor; mitigating circumstances only."},
{id:"b10",set:"Past bar",src:"2016 Bar",t:["a11"],q:"Pedro saw a man stabbing Juan, the first cousin of Pedro's wife. Pedro hit the attacker with a spade, killing him. Defense of a relative?",iss:["Affinity: same degrees only","Defense of a stranger"],
a:"<b>Not defense of a relative</b>: relatives by affinity are covered only “in the same degrees” (ascendants, descendants, siblings), and a wife's first cousin is not among them. <b>But</b> Pedro may invoke <b>defense of a stranger</b> (¶3) if there was unlawful aggression, reasonable means, and he was not induced by revenge or another evil motive.",c:"A wife's first cousin is a 'stranger' → ¶3."},
{id:"b11",set:"Past bar",src:"2002 Bar",t:["a11"],q:"A saw three men punching B; C was about to stab B with a knife. Not knowing that B had earlier challenged them to a fight, A shot C. May A invoke defense of a stranger?",iss:["Honest belief; appearances","Provocation by the stranger is immaterial for ¶3 if the defender had no part"],
a:"<b>Yes.</b> As things appeared to A, there was unlawful aggression against B (a knife about to be used), and shooting an attacker with a knife is a reasonable means. A was not induced by an evil motive, and he had no part in B's provocation. Defense is judged by the facts as they reasonably appeared to the defender (<i>Esmedia</i>).",c:"Appearances govern; A had no part in B's provocation → defense of a stranger."},
{id:"b12",set:"Past bar",src:"1996 Bar",t:["a11"],q:"A security guard shot dead a man he saw scaling the factory wall. The man was unarmed. The guard claims defense of property and fulfillment of duty. Convict?",iss:["No unlawful aggression","Killing not a necessary consequence of duty"],
a:"<b>Yes, convict him of homicide.</b> Defense of property requires unlawful aggression; climbing a wall, without any attack on the guard, is not. Fulfillment of duty requires that the injury be the <b>necessary consequence</b> of the duty; a guard's duty does not require killing an unarmed intruder. At most, he gets incomplete fulfillment of duty (Art. 69).",c:"No aggression; killing not a necessary consequence of duty → homicide."},
{id:"b13",set:"Past bar",src:"1996 Bar",t:["a6","a8"],q:"Edgardo paid Vicente to kidnap a girl Edgardo was courting. Vicente asked for more money; when Edgardo would not pay, Vicente reported him. Attempted kidnapping?",iss:["Proposal is preparatory, not overt"],
a:"<b>No.</b> No overt act toward kidnapping was commenced. At most, Edgardo made a <b>proposal</b>, which is a preparatory act and is not punishable for kidnapping (Art. 8).",c:"Proposal ≠ overt act; a proposal to kidnap is not punishable."},
{id:"b14",set:"Past bar",src:"2004 Bar",t:["a11","a8"],q:"BB and CC knifed FT. FT's son ST drew a gun, but AA grappled with him to stop him from shooting. FT died. AA claims avoidance of a greater evil. Will it prosper?",iss:["¶4 requires an actual evil; ST's defense of his father is lawful","Conspiracy"],
a:"<b>No.</b> ST's act was a lawful defense of a relative, not an “evil.” By stopping it, AA only helped ensure the killing (cf. <i>Ricohermoso</i>). His acts show a common design with BB and CC, so he is a co-conspirator: the act of one is the act of all.",c:"Preventing a lawful defense is not avoiding an evil; AA is a co-conspirator."},
{id:"b15",set:"Past bar",src:"1990 Bar",t:["a11"],q:"(a) Is a doctor liable for deliberately turning off a patient's life support (mercy killing)? (b) What if, to save the mother, the doctor sacrificed the unborn child?",iss:["Euthanasia not justified","State of necessity"],
a:"<b>(a) Liable</b>: euthanasia is not a justifying circumstance in our jurisdiction. <b>(b) Not liable</b>: avoidance of a greater evil (Art. 11(4)). The evil to the mother actually existed, the injury avoided was greater, and there was no other practical and less harmful means.",c:"Euthanasia: liable. Sacrificing the fetus to save the mother: Art. 11(4)."}
];

{id:"q1",src:"San Beda 2019 · MCQ 1",q:"Principles of public international law exempt certain individuals from the generality of criminal law. Who among the following is NOT exempt?",ch:["Ministers resident","Commercial attaché of a foreign country","Ambassador","Chiefs of mission"],k:1,why:"Ambassadors, ministers resident and chiefs of mission are diplomatic agents. A commercial attaché, like a consul, is not covered."},
{id:"q2",src:"San Beda 2019 · MCQ 2",q:"The maxim “Nullum crimen, nulla poena sine lege” means that:",ch:["the act is criminal when committed but the penalty is prescribed in a later law","the act is criminal and punished under common law","there is a crime as long as the act is inherently evil","crime is a product of the law"],k:3,why:"There is no crime without a law punishing it: crime is a creation of law (basis of Art. 5 ¶1)."},
{id:"q3",src:"San Beda 2019 · MCQ 3 (2011 Bar)",q:"Three men gave Arnold fist blows and kicks, causing him to fall. As they surrounded him and kept hitting him, he grabbed a knife from his pocket and stabbed one of them in the heart. What crime did Arnold commit?",ch:["Homicide with incomplete self-defense, since he could have run","Homicide, since stabbing the heart is fatal","Homicide mitigated by incomplete self-defense, since stabbing the heart is excessive","No crime, since he needed to repel the aggression with reasonable means"],k:3,why:"There was continuing unlawful aggression by three men; a knife is rationally equivalent given their number; there is no duty to retreat; he is not expected to aim at less vital parts (Mack)."},
{id:"q4",src:"San Beda 2019 · MCQ 4 (2011 Bar)",q:"X killed B, mistakenly believing she was his wife, upon surprising her having sex with another man in a motel room. What is X's liability?",ch:["None: exceptional circumstances (Art. 247)","None: mistake of fact","Parricide","Homicide"],k:3,why:"B was not his wife, so it is not parricide, and the Art. 247 privilege (destierro, not exemption) belongs to a spouse who surprises his own spouse. Killing a stranger by mistaking her identity is still a felony (error in personae) → homicide.",note:"Arguable: Reyes says mistake of fact can cover an absolutory situation such as Art. 247. But neither 'none' option fits, because even Art. 247 is punished with destierro. Go with (D)."},
{id:"q5",src:"San Beda 2019 · MCQ 5/7 (2011 Bar)",q:"When committed outside Philippine territory, our courts DO NOT have jurisdiction over the crime of:",ch:["treason","piracy","espionage","rebellion"],k:3,why:"Art. 2(5) covers crimes against national security and the law of nations (Title One). Rebellion is in Title Three (public order)."},
{id:"q6",src:"San Beda 2019 · MCQ 6",q:"Which is an exception to the territoriality rule?",ch:["Trademark violation by an alien in the Philippines","Forgery of US bank notes in the Philippines","A crime by a Filipino in the disputed Spratly Islands","Plunder committed by a Philippine public officer at his post abroad"],k:3,why:"Art. 2(4): an offense by a public officer in the exercise of his functions, committed abroad. (A and B are committed within the Philippines, so territoriality applies.)"},
{id:"q8",src:"San Beda 2019 · MCQ 8",q:"Motive is generally IMMATERIAL in determining criminal liability EXCEPT when:",ch:["the court wants to know who led several offenders","the evidence is both direct and circumstantial","fixing the degree of the penalty","the evidence of guilt is circumstantial"],k:3,why:"Motive matters when identity is in doubt or the evidence is purely circumstantial."},
{id:"q9",src:"San Beda 2019 · MCQ 9 (2011 Bar)",q:"X inflicted serious injuries on Y. Because of a delay in medical treatment, Y died. Is X liable for Y's death?",ch:["Yes: the delay did not break the causal connection","Yes: any intervening cause is immaterial","No: the injury was not the immediate cause","No: the delay was an intervening cause"],k:0,why:"Neglect by the victim or a third person, such as delayed treatment, is not an efficient intervening cause (Reyes). (B) overstates: an efficient intervening cause does break the chain."},
{id:"q10",src:"San Beda 2019 · MCQ 10 (2011 Bar)",q:"In an attempted felony, the offender's preparatory act:",ch:["itself constitutes an offense","must seem connected to the intended crime","must not be connected to the intended crime","requires another act to result in a felony"],k:3,why:"A preparatory act is not yet an act of execution: another act (an overt act) is needed before it becomes an attempt.",note:"Oddly worded bar question; (D) is the published answer."},
{id:"q11",src:"San Beda 2019 · MCQ 11 (2011 Bar)",q:"X violently kicked vital parts of E's body. E fled for his life, refused treatment, and died 3 days later. Is X liable for E's death?",ch:["No: kicks cannot cause death","No: death took too long","Yes: E cannot be compelled to undergo treatment","Yes: death was a natural result of the injuries X inflicted"],k:3,why:"Death within a reasonable time from injuries to vital parts is the natural consequence; refusal of treatment is not an efficient intervening cause."},
{id:"q12",src:"San Beda 2019 · MCQ 12",q:"A battered woman claiming self-defense must prove that the final acute battering episode was preceded by:",ch:["3 battering episodes","4 battering episodes","5 battering episodes","2 battering episodes"],k:3,why:"Genosa: the cycle of violence must have occurred at least twice."},
{id:"q13",src:"San Beda 2019 · MCQ 13 (2011 Bar)",q:"An Indonesian crewman murders the Filipino captain aboard a Russian-registered vessel anchored outside the breakwaters of Manila Bay. Which court has jurisdiction?",ch:["Indonesian","Russian","Philippine","Whichever court first asserts it"],k:2,why:"The vessel is within Philippine waters; murder breaches public order → triable here (English rule)."},
{id:"q14",src:"San Beda 2019 · MCQ 14",q:"A proposal to commit a felony is punishable only when the law specifically provides, as in proposal to commit:",ch:["rebellion","sedition","espionage","highway robbery"],k:0,why:"Proposal is punished for treason and for coup d'état, rebellion and insurrection (Art. 136). Not for sedition (only conspiracy, Art. 141)."},
{id:"q15",src:"San Beda 2019 · MCQ 15",q:"The Spanish maxim for “He who is the cause of the cause is the cause of the evil caused”:",ch:["El que dela causa es causa del mal causado","El causa dela causa del causa es causa del mal causado","El que es causa de la causa es causa del mal causado","El que es causa es causa dela causa del mal causado"],k:2,why:"El que es causa de la causa es causa del mal causado: the basis of Art. 4(1)."},
{id:"q16",src:"Mock",q:"Theft is consummated when:",ch:["the thief leaves the premises","the thief is able to dispose of the property","the thief gains possession of the property with intent to gain","the owner discovers the loss"],k:2,why:"Valenzuela: apoderamiento is complete upon gaining possession; there is no frustrated theft."},
{id:"q17",src:"Mock",q:"Which of these can never be an impossible crime?",ch:["Murder","Theft","Kidnapping","Estafa"],k:2,why:"Art. 4(2) covers only offenses against persons or property; kidnapping is against liberty (Domasian)."},
{id:"q18",src:"Mock",q:"A felony punishable by a fine of exactly ₱40,000 is:",ch:["grave","less grave","light","not a felony"],k:2,why:"Art. 9 (RA 10951): 'not exceeding ₱40,000' → light. Art. 9 prevails over Art. 26 for classifying felonies."},
{id:"q19",src:"Mock",q:"The only justifying circumstance under which civil liability is incurred:",ch:["self-defense","defense of a stranger","avoidance of a greater evil","obedience to an order"],k:2,why:"Art. 11(4): the persons benefited pay in proportion to the benefit (Art. 101)."},
{id:"q20",src:"Mock",q:"In Oanis, why was mistake of fact rejected?",ch:["The victim was armed","The officers had time and opportunity to verify the victim's identity","The officers had no arrest order","The victim fired first"],k:1,why:"The victim was asleep; nothing pressed them to act at once; the mistake was due to their fault."}

 {

  "q": "Officers Ramos and Tuazon were ordered to arrest Dado, an escaped convict known to be armed, and to “bring him in dead or alive if he resists.” At 2:00 a.m. they learned Dado was hiding in a boarding house. Ramos kicked the door open and, in the dark, saw a man rising from a bed and reaching under his pillow. Ramos fired, killing him. Tuazon, entering a second room, found a man asleep with his back to the door and fired three shots without saying a word. Neither man was Dado: the first was a boarder who kept a flashlight under his pillow; the second was a vendor. Discuss the criminal liability of Ramos and Tuazon.",
  "iss": [
   "Mistake of fact (Ah Chong requisites)",
   "Fault or carelessness: time to verify (Oanis)",
   "Fulfillment of duty (Art. 11(5)): necessary consequence",
   "Incomplete justification → privileged mitigating (Art. 69)",
   "Dolo vs. culpa (deliberate shooting is not reckless imprudence)",
   "Treachery (sleeping victim) → murder"
  ],
  "a": "<div class=\"sx-part\">Ramos</div><br><br><b>Issue.</b> Is Ramos liable for killing the boarder he mistook for the armed fugitive?<br><br><b>Rule.</b> There is no felony by dolo without intent. A mistake of fact negates intent if (1) the act would have been lawful had the facts been as he believed, (2) his intention was lawful, and (3) the mistake was without fault or carelessness.<br><br><b>Analysis.</b> (1) Had the man been Dado, an armed fugitive reaching under his pillow at an officer serving an arrest, shooting would be the <b>necessary consequence of duty</b> (or self-defense), so it would be lawful. (2) His intent was to effect a lawful arrest. (3) The room was dark and the man moved toward a hidden object at the moment of entry; there was <b>no time to verify</b>. <b>Why not culpa?</b> He was not careless; he reacted to an apparent, imminent threat, like Ah Chong, who was struck as the intruder forced the door.<br><br><b>Conclusion.</b> Ramos is not criminally liable.<br><br><div class=\"sx-part\">Tuazon</div><br><br><b>Issue.</b> Is Tuazon liable for shooting the sleeping vendor, and for what crime?<br><br><b>Rule.</b> The same three requisites; a mistake due to fault does not excuse. A deliberate shooting is dolo, not reckless imprudence. Fulfillment of duty requires that the injury be the necessary consequence of performing the duty.<br><br><b>Analysis.</b> Requisite (3) fails: the vendor was <b>asleep with his back to the door</b>, so nothing pressed Tuazon to act at once; he had time to verify and make a bloodless arrest (as in Oanis). Requisite (1) also fails: even if the man had been Dado, the order allowed force only if he resisted, and a sleeping man does not resist. <b>Why not reckless imprudence?</b> He fired three shots deliberately; a mistake in identity in a deliberate act is still dolo. <b>Why murder, not homicide?</b> Shooting a sleeping victim ensures the killing without risk to the shooter: treachery. <b>Why mitigated?</b> He was on duty (the first requisite of Art. 11(5)) but the killing was not its necessary consequence, so the justification is incomplete.<br><br><b>Conclusion.</b> Tuazon is liable for murder, with the privileged mitigating circumstance of incomplete fulfillment of duty.",
  "c": "Ramos: no time to verify, so mistake of fact without fault → not liable. Tuazon: a sleeping victim, time to verify → murder, mitigated by incomplete fulfillment of duty."
 },

  "q": "(a) The M/V Erin, a Liberian-registered merchant vessel en route from Hong Kong to Sydney, anchored for one night off Batangas. Lito, a Chinese crewman, smoked shabu on deck; Paco, another crewman, kept 50 grams of shabu in his locker and never left the ship; Wei, a third crewman, sold some to a fisherman who came alongside. Which of them may be prosecuted in the Philippines? (b) The M/V Bayani, registered in the Philippines but owned by a Panamanian corporation, was on the high seas when Bert, a Filipino seaman, stabbed Kenji, a Japanese seaman. Do Philippine courts have jurisdiction? (c) Would your answer in (b) change if the Bayani had been registered in Panama but owned by a Filipino?",
  "iss": [
   "English rule; breach of public order (Wong Cheng)",
   "Mere possession in transit (Look Chaw)",
   "Landing or sale → triable (Look Chaw)",
   "Art. 2(1): Philippine ship = registry, not owner (2000 Bar)"
  ],
  "a": "<div class=\"sx-part\">(a) The three crewmen</div><br><br><b>Issue.</b> Can Philippine courts try crimes aboard a foreign merchant vessel in our waters?<br><br><b>Rule.</b> We follow the English rule: crimes aboard a foreign merchant vessel in our territorial waters are triable here unless they concern only the vessel's internal management. Mere possession of a drug aboard a vessel in transit is not triable, because it produces no effect here; using or landing it is.<br><br><b>Analysis.</b> <b>Lito</b>: smoking shabu in our waters makes the drug produce its effects here, a breach of public order (Wong Cheng). <b>Why not internal management?</b> Drug use is not a shipboard disciplinary matter; it is exactly what our law means to prevent. <b>Paco</b>: the ship was <b>in transit</b> (Hong Kong to Sydney) and he only kept the drug in his locker; mere possession causes no harm here (Look Chaw). <b>Wei</b>: selling to a local fisherman brings the drug into our territory, which is an open violation (Look Chaw).<br><br><b>Conclusion.</b> Lito and Wei may be prosecuted here; Paco may not.<br><br><div class=\"sx-part\">(b) and (c) The high seas</div><br><br><b>Issue.</b> Does the RPC reach a crime committed on the high seas aboard the Bayani?<br><br><b>Rule.</b> Art. 2(1): the Code applies outside Philippine jurisdiction to offenses committed while on a Philippine ship, i.e., one registered in the Philippines.<br><br><b>Analysis.</b> (b) The Bayani is <b>registered here</b>, so it is a Philippine ship; the Panamanian owner and the Japanese victim are irrelevant. (c) If registered in Panama, it is not a Philippine ship even if a Filipino owns it. <b>Why not apply generality?</b> Generality binds people within our territory; on the high seas, only Art. 2's exceptions apply.<br><br><b>Conclusion.</b> (b) Triable here. (c) Not triable here.",
  "c": "English rule: use or sale in our waters is a breach of public order (Wong Cheng; Look Chaw); mere possession in transit is not. Art. 2(1) turns on registry, not ownership."
 },

  "q": "During a drinking spree, Nonoy punched Badong, a 60-year-old with a known heart condition, twice in the chest. Badong staggered out of the house in fear and onto the highway, where a speeding jeepney hit him. He was brought to a hospital where he refused a blood transfusion for religious reasons, and he died the next morning. The autopsy listed the cause of death as “cardiac arrest secondary to blunt trauma and blood loss.” Nonoy argues: (1) he only meant to hurt Badong; (2) the jeepney and the refusal of treatment, not his punches, killed Badong. Rule on both arguments.",
  "iss": [
   "Art. 4(1) requisites",
   "Proximate cause; chain unbroken (Iligan)",
   "Pre-existing illness not an efficient intervening cause (Garcia)",
   "Victim's refusal of treatment / neglect not efficient",
   "Immediate sense of danger",
   "Praeter intentionem (Art. 13(3))"
  ],
  "a": "<b>Issue.</b> Is Nonoy liable for Badong's death, given that he meant only to hurt him and that a jeepney and a refused transfusion intervened?<br><br><b>Rule.</b> Under Art. 4(1), one who commits an intentional felony is liable for all its direct, natural and logical consequences, even unintended ones. The felony must be the proximate cause: the cause that, in natural and continuous sequence, unbroken by an efficient intervening cause, produces the result. The victim's illness, his neglect or refusal of treatment, and other events set in motion by the felony do not break the chain; only a foreign force or the victim's deliberate act does.<br><br><b>Analysis.</b> <b>Intentional felony</b>: two punches to the chest are intentional physical injuries. <b>The heart condition</b> does not break the chain; the offender takes his victim as he finds him (Garcia, where a mauling caused a fatal heart attack). <b>The jeepney</b>: Badong ran onto the highway in fear created by the assault, so being hit was a natural consequence, as in Iligan, where the victim was hacked and then run over. <b>Why not an efficient intervening cause?</b> The jeepney was not a foreign, independent force; the assault put Badong in its path. <b>The refused transfusion</b> is neglect by the victim, which Reyes lists as not an efficient intervening cause. <b>Lack of intent to kill</b> does not remove liability for the death; it only mitigates. <b>Why praeter intentionem applies here</b>: two fist blows do not show intent to kill, so there is a notable disproportion between the means and the result.<br><br><b>Conclusion.</b> Nonoy is liable for homicide, mitigated by lack of intention to commit so grave a wrong (Art. 13(3)).",
  "c": "Art. 4(1): the punches started an unbroken chain (Iligan); the illness and the refusal of treatment are not efficient intervening causes (Garcia) → homicide, with Art. 13(3) mitigating."
 },

  "q": "(a) Ading, a collector of Bright Foam, received a ₱50,000 check from a customer, payable to Bright Foam. She deposited it in her boyfriend's account. The check bounced for insufficient funds. Charged with qualified theft, Ading says she committed no crime. (b) Tonyo, wanting to kill his rival Jun, crept to Jun's hut at night and fired five shots through the bamboo wall where Jun usually slept. Jun had left for Manila that afternoon; Jun's goats inside were killed. (c) Pinong abducted a 7-year-old boy and mailed a ransom note to the parents. Police rescued the boy before the note arrived. Pinong argues it is an impossible crime. Discuss.",
  "iss": [
   "Impossible crime requisites (Art. 4(2))",
   "Legal/factual impossibility: worthless check (Jacinto)",
   "Physical impossibility: absent victim (Intod)",
   "'No violation of another provision': damage to the goats (malicious mischief?)",
   "Kidnapping is a crime against liberty; consummated (Domasian)"
  ],
  "a": "<b>Rule.</b> An impossible crime (Art. 4(2)) requires: (1) an act that would be an offense against persons or property, (2) done with evil intent, (3) whose accomplishment is inherently impossible or whose means are inadequate or ineffectual, and (4) that constitutes no other felony.<br><br><div class=\"sx-part\">(a) Ading</div><br><br><b>Issue.</b> Is depositing a worthless check that was meant for the employer qualified theft, or an impossible crime?<br><br><b>Analysis.</b> Theft is an offense against property, and her intent to gain is clear. But the check was <b>unfunded from the start</b>, so nothing of value could be taken: inherent (factual) impossibility, as in Jacinto. <b>Why not consummated qualified theft?</b> The property taken must have value. <b>Why not attempted?</b> The failure was not due to an outside cause intervening; there was never anything to gain.<br><br><b>Conclusion.</b> Impossible crime (of qualified theft).<br><br><div class=\"sx-part\">(b) Tonyo</div><br><br><b>Issue.</b> Is firing into the empty sleeping quarters attempted murder or an impossible crime?<br><br><b>Analysis.</b> Intent to kill is shown by the five shots aimed where Jun slept. Jun's absence made the killing <b>physically impossible</b>, as in Intod. <b>Why not attempted murder?</b> An attempt presupposes a crime that could have been accomplished but was stopped by an outside cause; here it could never have been. <b>The goats</b>: the killing of the goats was not deliberate, so the better view, following Intod, is still an impossible crime, with civil liability for the goats. If the problem treats the damage as malicious mischief, the fourth requisite fails and he is liable for that felony instead.<br><br><b>Conclusion.</b> Impossible crime of murder.<br><br><div class=\"sx-part\">(c) Pinong</div><br><br><b>Issue.</b> Is the kidnapping an impossible crime because the ransom note arrived after the rescue?<br><br><b>Analysis.</b> <b>Why not an impossible crime?</b> (1) Kidnapping is a crime against <b>liberty</b>, not against persons or property, so requisite 1 fails. (2) Nothing was impossible: the crime was <b>consummated</b> the moment the boy was deprived of his liberty (Domasian). The late ransom note bears only on the penalty.<br><br><b>Conclusion.</b> Kidnapping and serious illegal detention.",
  "c": "Worthless check → impossible theft (Jacinto); absent victim → impossible murder (Intod); kidnapping is never an impossible crime and was consummated anyway (Domasian)."
 },

  "q": "Answer briefly.\n(1) Enumerate the five cases in which the RPC applies outside Philippine jurisdiction.\n(2) Give the four requisites of an impossible crime.\n(3) Give the three justifications of punishment discussed by Cavanaugh, and one RPC provision reflecting the reductivist view.\n(4) True or false, with a reason: “Theft may be committed in the frustrated stage.”\n(5) Give the three requisites of mistake of fact.",
